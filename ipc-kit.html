PC lead review<\/td>\n          <td>Role responsible for Part A review and monthly routine.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>IPC-03<\/strong><\/td>\n          <td>training claim<\/td>\n          <td>Effective IPC improvement combines multiple elements (supplies at point of care, training, observation and feedback, reminders, and supportive culture).<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO Minimum requirements for IPC programmes 2019<\/td>\n          <td>Core Component 5: Multimodal strategies for IPC interventions<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Explains why stock, readiness, and hand hygiene are paired.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>PR-01<\/strong><\/td>\n          <td>checklist item<\/td>\n          <td>The Facility Data-Handling Plan organizes local device, backup, access, and retention rules around administrative, physical, and technical safeguard categories as a reference model, not a claim of legal HIPAA compliance.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>US Department of Health and Human Services (HHS) – HIPAA Security Rule<\/td>\n          <td>Administrative, Physical, and Technical Safeguards (45 CFR Part 164 Subpart C)<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Reference model only; kit stores no ePHI.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>PR-02<\/strong><\/td>\n          <td>app rule / checklist item<\/td>\n          <td>Personal identifiers listed in the HIPAA Safe Harbor de-identification standard (names, ID numbers, exact timestamps, photos, clinical details) are excluded from all app fields and paper sheets.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>US Department of Health and Human Services (HHS) – HIPAA Privacy Rule<\/td>\n          <td>Safe Harbor de-identification method (45 CFR 164.514(b)(2))<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Used to verify that no identifying fields exist.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>PR-03<\/strong><\/td>\n          <td>app rule<\/td>\n          <td>The IPC Starter Kit stores no personal health information (PHI) or staff identifiers; any future workflow that collects PHI requires a separate deployment-specific privacy and security review.<\/td>\n          <td><span class=\"type-badge\">Kit design choice<\/span><\/td>\n          <td>IPC Starter Kit architecture &amp; scope boundary<\/td>\n          <td>Data minimization and zero-PHI scope<\/td>\n          <td>Kit design choice (verified in schema &amp; forms)<\/td>\n          <td>Enforced across all HTML forms and JSON/CSV exports.<\/td>\n        <\/tr>\n      <\/tbody>\n    <\/table>\n\n    <h2>2. Facility Choice Rows (Configurable Locally)<\/h2>\n    <p>These thresholds and operational parameters are set or adjusted by the local facility in <code>Settings<\/code> or on the printable checklists:<\/p>\n    <table>\n      <thead>\n        <tr>\n          <th style=\"width: 6%;\">ID<\/th>\n          <th style=\"width: 11%;\">Used in<\/th>\n          <th style=\"width: 25%;\">Claim / Configurable parameter (our original wording)<\/th>\n          <th style=\"width: 11%;\">Type<\/th>\n          <th style=\"width: 14%;\">Source<\/th>\n          <th style=\"width: 12%;\">Expected section/topic<\/th>\n          <th style=\"width: 12%;\">Verification status<\/th>\n          <th style=\"width: 9%;\">Notes<\/th>\n        <\/tr>\n      <\/thead>\n      <tbody>\n        <tr class=\"facility-choice\">\n          <td><strong>HH-07<\/strong><\/td>\n          <td>app metric / app rule<\/td>\n          <td>Hand hygiene results based on fewer than 200 opportunities (default; facility can change this threshold in Settings) are flagged 'Small sample – interpret with care'.<\/td>\n          <td><span class=\"type-badge type-fc\">Facility choice<\/span><\/td>\n          <td>Facility choice, informed by WHO Hand Hygiene Technical Reference Manual 2009 [TRM]<\/td>\n          <td>Sample size guidance for hand hygiene observation (~200 opportunities per unit/period)<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Default is 200; small clinics may review lower counts with care.<\/td>\n        <\/tr>\n        <tr class=\"facility-choice\">\n          <td><strong>ST-08<\/strong><\/td>\n          <td>app rule / checklist item<\/td>\n          <td>The expiry alert window defaults to 90 days before an item's expiry date and can be customized by the facility or per item.<\/td>\n          <td><span class=\"type-badge type-fc\">Facility choice<\/span><\/td>\n          <td>Facility choice (local resupply lead-time setting)<\/td>\n          <td>Configurable expiry warning lead time<\/td>\n          <td>Facility choice (configurable in Settings and per item)<\/td>\n          <td>Set longer if resupply deliveries take &gt;3 months.<\/td>\n        <\/tr>\n        <tr class=\"facility-choice\">\n          <td><strong>ST-09<\/strong><\/td>\n          <td>app rule / checklist item<\/td>\n          <td>Each supply item has a locally set reorder point that triggers an alert when usable stock is at or below that quantity.<\/td>\n          <td><span class=\"type-badge type-fc\">Facility choice<\/span><\/td>\n          <td>Facility choice, informed by USAID | DELIVER Logistics Handbook 2011 [LH]<\/td>\n          <td>Minimum/maximum stock levels and emergency order point concepts<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Facility calculates based on monthly use and lead time.<\/td>\n        <\/tr>\n      <\/tbody>\n    <\/table>\n\n    <h2>3. Sources and Reuse Terms<\/h2>\n    <p>\n      <strong>Decision recorded for this kit:<\/strong> <strong>NO third-party text, tables, or graphics are bundled in this repository.<\/strong> All app text, training scenarios, and printable sheets are 100% original wording released under CC BY-NC-SA 4.0. Reuse terms for the cited reference publications are noted below as <em>to confirm<\/em>:\n    <\/p>\n    <table>\n      <thead>\n        <tr>\n          <th style=\"width: 28%;\">Source document<\/th>\n          <th style=\"width: 34%;\">Citation URL / ISBN (plain text)<\/th>\n          <th style=\"width: 20%;\">Publisher reuse terms (to confirm)<\/th>\n          <th style=\"width: 18%;\">How used in this kit<\/th>\n        <\/tr>\n      <\/thead>\n      <tbody>\n        <tr>\n          <td>WHO Hand Hygiene Technical Reference Manual (2009) [TRM]<\/td>\n          <td><code>https://www.who.int/publications/i/item/9789241598606<\/code><\/td>\n          <td>To confirm: 2009 publication may be 'All rights reserved' by WHO.<\/td>\n          <td>Cited only (HH-01..HH-12); no text or 'My 5 Moments' graphic copied.<\/td>\n        <\/tr>\n        <tr>\n          <td>WHO Guidelines on Hand Hygiene in Health Care (2009)<\/td>\n          <td>ISBN <code>9789241597906<\/code><\/td>\n          <td>To confirm: 2009 publication may be 'All rights reserved' by WHO.<\/td>\n          <td>Cited only for glove rule &amp; rub/wash duration (HH-11, HH-13).<\/td>\n        <\/tr>\n        <tr>\n          <td>USAID | DELIVER PROJECT, The Logistics Handbook: A Practical Guide for the Supply Chain Management of Health Commodities (2nd ed., 2011) [LH]<\/td>\n          <td><code>https://pdf.usaid.gov/pdf_docs/pnaeb974.pdf<\/code><\/td>\n          <td>To confirm: USAID-funded publication reuse/attribution terms.<\/td>\n          <td>Cited only for stock card, FEFO, physical count, and usable stock concepts (ST-01..ST-10).<\/td>\n        <\/tr>\n        <tr>\n          <td>WHO / UNICEF Water and Sanitation for Health Facility Improvement Tool (WASH FIT), 2nd ed. (2022)<\/td>\n          <td><code>https://www.who.int/publications/i/item/9789240043237<\/code><\/td>\n          <td>To confirm: WHO 2022 publications are usually CC BY-NC-SA 3.0 IGO.<\/td>\n          <td>Cited only for readiness domains and action plan concepts (RC-01..RC-06).<\/td>\n        <\/tr>\n        <tr>\n          <td>WHO Minimum requirements for infection prevention and control programmes (2019)<\/td>\n          <td><code>https://www.who.int/publications/i/item/9789241516945<\/code><\/td>\n          <td>To confirm: WHO 2019 publications are usually CC BY-NC-SA 3.0 IGO.<\/td>\n          <td>Cited only for core components (IPC-01..IPC-03, HH-12, RC-01..RC-04).<\/td>\n        <\/tr>\n        <tr>\n          <td>US HHS HIPAA Security Rule &amp; Privacy Rule (Safe Harbor de-identification)<\/td>\n          <td><code>https://www.hhs.gov/hipaa/for-professionals/security/laws-regulations/index.html<\/code><\/td>\n          <td>To confirm: US federal government guidance (generally public domain in the US).<\/td>\n          <td>Cited only as safeguard reference model and identifier exclusion list (PR-01, PR-02).<\/td>\n        <\/tr>\n      <\/tbody>\n    <\/table>\n\n    <footer>\n      IPC Starter Kit v1.0.0 · Original text © 2026 @mostafase · <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\">CC BY-NC-SA 4.0<\/a> · Sources: see evidence register (<a href=\"evidence-register.html\">evidence/evidence-register.html<\/a>)\n    <\/footer>\n  <\/div>"},"docs/DEVICE-TESTING.md":{"id":"docs/DEVICE-TESTING.md","slug":"device-testing","label":"Device testing & opening guide","title":"Device testing & opening guide – IPC Starter Kit v1.0.0","kind":"md","inAllSheets":false,"scopeClass":"fk-sheet-md","scopedCss":"@page { size: auto; margin: 12mm; }\n.fk-sheet-md, .fk-sheet-md * { box-sizing: border-box; }\n.fk-sheet-md {\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n  color: #111;\n  background: #fff;\n  padding: 10px;\n  font-size: 13.5px;\n  line-height: 1.45;\n  max-width: 190mm;\n  margin: 0 auto;\n}\n.fk-sheet-md h1 { font-size: 19px; margin: 0 0 8px 0; border-bottom: 2px solid #000; padding-bottom: 4px; }\n.fk-sheet-md h2 { font-size: 15px; margin: 14px 0 6px 0; border-bottom: 1px solid #999; padding-bottom: 2px; }\n.fk-sheet-md h3 { font-size: 13.5px; margin: 10px 0 4px 0; }\n.fk-sheet-md p, .fk-sheet-md ul, .fk-sheet-md ol { margin: 6px 0; }\n.fk-sheet-md ul, .fk-sheet-md ol { padding-left: 20px; }\n.fk-sheet-md li { margin-bottom: 4px; }\n.fk-sheet-md hr { border: 0; border-top: 1px solid #bbb; margin: 12px 0; }\n.fk-sheet-md blockquote { margin: 8px 0; padding: 6px 10px; border-left: 3px solid #12324f; background: #f5f7fa; }\n.fk-sheet-md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: #eef1f5; padding: 1px 4px; border-radius: 3px; }\n.fk-sheet-md pre { background: #f4f6f8; border: 1px solid #ccc; padding: 8px 10px; overflow-x: auto; font-size: 12px; line-height: 1.35; }\n.fk-sheet-md pre code { background: transparent; padding: 0; }\n.fk-sheet-md table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12px; }\n.fk-sheet-md th, .fk-sheet-md td { border: 1px solid #000; padding: 4px 6px; text-align: left; vertical-align: top; }\n.fk-sheet-md th { background: #eee; }\n@media print {\n  .fk-sheet-md { padding: 0; font-size: 11px; max-width: 100%; }\n}","bodyHtml":"<div class=\"page\"><h1>Device Testing &amp; Opening Guide (<code>docs/DEVICE-TESTING.md<\/code>)<\/h1>\n<p>The matrix records results from the original package. Re-run the workflow on the revised package before rollout. For the restore check, use a practice backup in Practice mode and a real-mode backup made with fictional test data in Real mode.<\/p>\n<p>The IPC Starter Kit (<code>ipc-kit.html<\/code>, v1.0.0) is a single-file offline web application that stores records in your browser&#x27;s local storage (<code>localStorage<\/code>) on that specific device. Because browsers handle <code>file://<\/code> URLs differently across operating systems, always check each device before using it for real facility records.<\/p>\n<hr>\n<h2>1. Tested Combinations<\/h2>\n<table><thead><tr><th>Device<\/th><th>OS<\/th><th>Browser + version<\/th><th>Open from local file<\/th><th>Save/reload<\/th><th>Backup download<\/th><th>Restore<\/th><th>Print<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td>Desktop / Laptop PC<\/td><td>Linux (<code>x86_64<\/code>)<\/td><td>Mozilla Firefox 158.0.1 (headless BiDi)<\/td><td>PASS (<code>file://<\/code> from unzipped <code>ipc-starter-kit-v1.0.0-offline.zip<\/code>)<\/td><td>PASS (<code>localStorage<\/code> persisted across full browser quit &amp; reopen)<\/td><td>PASS (<code>Blob<\/code> JSON &amp; UTF-8 BOM CSV download + text fallback)<\/td><td>PASS (valid + earlier <code>sample-data/practice-backup.json<\/code> &amp; UTF-8 backups restored; corrupt, tampered &amp; unexpected-field files rejected intact)<\/td><td>PASS (<code>@media print<\/code> &amp; single-page <code>field-kit<\/code> sheets verified 1 page each via PDF print)<\/td><td><strong>PASS — Verified<\/strong> (<code>tests/test_browser_e2e.py<\/code>, incl. all 6 UN languages &amp; Arabic <code>dir=&quot;rtl&quot;<\/code>)<\/td><\/tr><tr><td>Desktop / Laptop PC<\/td><td>Windows 10/11 &amp; macOS<\/td><td>Chrome, Edge, Firefox, Safari<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td><strong>NOT TESTED<\/strong> in this build environment (verify locally using Section 2A &amp; Section 3; on macOS prefer Chrome/Firefox over Safari)<\/td><\/tr><tr><td>Android phone/tablet<\/td><td>Android (LineageOS / Chromium WebView &quot;Jelly&quot;)<\/td><td>Default LineageOS Browser (Jelly) / <code>content://<\/code> file opener<\/td><td>Partial (<code>content://<\/code> opens single file; <code>file://<\/code> &amp; relative links blocked)<\/td><td>Check with <strong>Settings &gt; Check this device<\/strong><\/td><td>Fallback (<code>blob:<\/code> downloads blocked silently; auto-opens <strong>Copy text<\/strong> box)<\/td><td>Paste text / chosen file<\/td><td>WebView blocks <code>window.print()<\/code> button (use <strong>Clean print view<\/strong> + menu <code>⋮ → Share / Print<\/code>)<\/td><td><strong>PARTIAL (WebView limits)<\/strong> — Built-in Printable Kit &amp; guides open inside <code>ipc-kit.html<\/code>, but Android WebView silently ignores JS Print &amp; <code>blob:<\/code> Save buttons; use <strong>Clean print view<\/strong> + <code>⋮<\/code>, <strong>Copy text<\/strong>, or switch to <strong>Firefox for Android<\/strong> / <strong>Chrome<\/strong><\/td><\/tr><tr><td>Android phone/tablet<\/td><td>Android (other browsers: Firefox / Chrome app dir)<\/td><td>Firefox for Android / Chrome<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td><strong>NOT TESTED<\/strong> in this build environment (test locally using Section 2B &amp; Section 3, or use paper forms)<\/td><\/tr><tr><td>iPhone<\/td><td>iOS<\/td><td>Safari / iOS browsers<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td><strong>iPhone – NOT TESTED<\/strong> (no physical device available; Safari blocks local file storage – use paper forms)<\/td><\/tr><tr><td>iPad<\/td><td>iPadOS<\/td><td>Safari / iPadOS browsers<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td><strong>iPad – NOT TESTED<\/strong> (no physical device available; Safari blocks local file storage – use paper forms)<\/td><\/tr><\/tbody><\/table>\n<p><strong>Release v1.0.0 Review Record (Who Tested What):<\/strong><\/p>\n<ul><li><strong>Automated + Clean-Package Agent Review (Desktop Linux, Firefox 158.0.1):<\/strong> Ran from a clean extraction of <code>ipc-starter-kit-v1.0.0-offline.zip<\/code> following the public <code>README.md<\/code> / <code>START-HERE.html<\/code> quick-start steps offline over <code>file://<\/code>; executed unit, Python helper, and BiDi browser E2E suites (covering all 6 UN languages <code>en<\/code>, <code>ar<\/code> RTL, <code>zh<\/code>, <code>fr<\/code>, <code>ru<\/code>, <code>es<\/code>, plus simulated <code>; wv)<\/code> Android WebView UI checks) and PDF print page-count checks across printable sheets.<\/li><li><strong>User Field Reports (Android, LineageOS default browser Jelly):<\/strong><\/li><\/ul>\n<ol><li>Opening <code>START-HERE.html<\/code> or cross-file links (<code>field-kit/*.html<\/code>) failed with <strong><code>ERR_FILE_NOT_FOUND<\/code><\/strong> because WebView blocks <code>file://<\/code> and Android <code>content://<\/code> URIs block sibling links. Resolved by embedding all 8 printable sheets &amp; guides directly inside <code>ipc-kit.html<\/code> plus single-file <code>field-kit/ALL-PRINTABLE-SHEETS.html<\/code>.<\/li><li>Opening the built-in Printable Kit inside <code>ipc-kit.html<\/code> succeeded in LineageOS Jelly, <strong>but tapping <code>Print / Save PDF<\/code> or <code>Download standalone HTML<\/code> did nothing<\/strong>: Android System WebView leaves JS <code>window.print()<\/code> disconnected and ignores <code>&lt;a download href=&quot;blob:...&quot;&gt;<\/code> without throwing. Updated <code>ipc-kit.html<\/code> to detect WebView (<code>; wv)<\/code>), report download/print accurately in <strong>Check this device<\/strong>, auto-open copyable text boxes with a <strong>Copy text<\/strong> button, and provide <strong>Clean print view<\/strong> + browser menu (<code>⋮ → Share or Print<\/code>) instructions.<\/li><\/ol>\n<ul><li><strong>Independent Human Second Reviewer:<\/strong> <strong>NOT YET COMPLETED<\/strong> for working desktop/Android browser setups (recommended during facility pilot using Section 3 below and <code>field-kit/ipc-lead-review-and-pilot-checklist.html<\/code> before real clinical rollout).<\/li><\/ul>\n<hr>\n<h2>2. How to Open <code>ipc-kit.html<\/code> by Platform<\/h2>\n<h3>A. Windows, macOS, and Linux (Recommended)<\/h3>\n<ol><li><strong>Extract (Unzip) first — never run inside a <code>.zip<\/code> preview:<\/strong><br>• <strong>Windows 10/11:<\/strong> Right-click <code>ipc-starter-kit-v1.0.0-offline.zip<\/code> → <strong>Extract All…<\/strong> into a fixed local folder such as <code>C:\\ipc-starter-kit\\<\/code> (not on a temporary Desktop copy or inside a cloud-synced OneDrive folder unless approved).<br>• <strong>macOS:<\/strong> Double-click the <code>.zip<\/code> archive in Finder and move the extracted <code>ipc-starter-kit<\/code> folder into a fixed location such as your Home folder (<code>~/ipc-starter-kit/<\/code>).<br>• <strong>Linux:<\/strong> Unzip into <code>~/ipc-starter-kit/<\/code> (<code>unzip ipc-starter-kit-v1.0.0-offline.zip<\/code>).<\/li><li><strong>Choose the right desktop browser:<\/strong><br>• <strong>Windows &amp; Linux:<\/strong> Double-click <code>ipc-kit.html<\/code>, or drag it into <strong>Firefox<\/strong>, <strong>Chrome<\/strong>, or <strong>Edge<\/strong>.<br>• <strong>macOS (Important Safari Note):<\/strong> Recent <strong>macOS Safari<\/strong> restricts <code>file://<\/code> storage or treats each local HTML load separately unless special developer settings are enabled. <strong>Use Chrome, Firefox, or Edge on macOS<\/strong> for reliable local saving, and confirm persistence by closing and reopening the browser (Section 3).<\/li><li><strong>Bookmark &amp; keep the file in ONE fixed folder:<\/strong> Press <code>Ctrl+D<\/code> (<code>Cmd+D<\/code> on macOS). Browsers link <code>localStorage<\/code> data to the exact file path and browser profile: moving, renaming, or switching browsers shows an empty dataset.<\/li><li><strong>Opening CSV reports in Microsoft Excel / LibreOffice:<\/strong> Downloaded CSV reports automatically include a <strong>UTF-8 BOM<\/strong> (<code>\\uFEFF<\/code>) so Windows Excel opens Arabic (<code>ar<\/code>), Chinese (<code>zh<\/code>), Russian (<code>ru<\/code>), French (<code>fr<\/code>), and Spanish (<code>es<\/code>) item names cleanly when double-clicked (macOS Numbers and LibreOffice Calc also open them in UTF-8).<\/li><li><strong>Optional desktop helper (<code>tools/ipc_tool.py<\/code>):<\/strong><br>• <strong>Windows:<\/strong> Open Command Prompt / PowerShell in the <code>ipc-starter-kit<\/code> folder and run <code>py -3 tools\\ipc_tool.py check-backup sample-data\\practice-backup.json<\/code> (or <code>python ...<\/code>).<br>• <strong>macOS / Linux:<\/strong> Open Terminal in the <code>ipc-starter-kit<\/code> folder and run <code>python3 tools/ipc_tool.py check-backup sample-data/practice-backup.json<\/code>.<\/li><\/ol>\n<h3>B. Android &amp; LineageOS Phones and Tablets (Fixing <code>ERR_FILE_NOT_FOUND<\/code> &amp; Jelly Print/Save Limits)<\/h3>\n<p>On Android 10+ and LineageOS, stock WebView browsers (including freshly installed <strong>LineageOS Browser / Jelly<\/strong>) and Android <strong><code>content://<\/code> / Scoped Storage<\/strong> have two separate OS limits:<\/p>\n<ol><li><strong>Unzip first &amp; check the folder name:<\/strong> Extract <code>ipc-starter-kit-v1.0.0-offline.zip<\/code> into internal storage (note the Android folder path is singular <strong><code>Download<\/code><\/strong>, not <code>Downloads<\/code>: e.g. <code>/storage/emulated/0/Download/ipc-starter-kit/<\/code>). Never open HTML files inside a <code>.zip<\/code> preview.<\/li><li><strong>Open <code>ipc-kit.html<\/code> directly (built-in Printable Kit avoids cross-file <code>ERR_FILE_NOT_FOUND<\/code>):<\/strong> When a file manager opens any HTML page via a <code>content://<\/code> URI, Android grants permission to only that single file—tapping relative links to sibling files (<code>START-HERE.html<\/code> or <code>field-kit/index.html<\/code>) triggers <code>ERR_FILE_NOT_FOUND<\/code>. Because <strong>all 8 printable field-kit sheets, the Evidence Register, and the Guides are built right inside <code>ipc-kit.html<\/code><\/strong>, they open offline without leaving the app (outside the app, you can also open <strong><code>field-kit/ALL-PRINTABLE-SHEETS.html<\/code><\/strong> directly from Files).<\/li><li><strong>If you use LineageOS Browser (Jelly) / Android WebView (<code>Print<\/code> or <code>Save<\/code> button does nothing):<\/strong> Stock Android System WebView does <strong>not<\/strong> wire web-page <code>window.print()<\/code> buttons or <code>blob:<\/code> file downloads to Android&#x27;s Print/Download services—so tapping <code>Print / Save PDF<\/code> or <code>Download<\/code> inside Jelly silently does nothing:<br>• <strong>To print / save PDF / screenshot from Jelly:<\/strong> Tap <strong>Clean print view<\/strong> (available in Printable Kit and Reports) so only the clean form appears, then open Jelly&#x27;s top-right menu (<strong><code>⋮<\/code><\/strong>) → <strong>Share<\/strong> (choose <strong>Print<\/strong> / PDF if listed by your Android print service) or take a screenshot.<br>• <strong>To copy HTML, CSV, or backups:<\/strong> Tap <strong>Show HTML text<\/strong>, <strong>Download<\/strong> (automatically opens the text box on WebView), or <strong>Show backup text<\/strong>, then tap <strong>Copy text<\/strong> and paste into a local note/editor.<br>• <strong>For full one-tap Print/PDF &amp; file downloads (Recommended):<\/strong> Open <code>ipc-kit.html<\/code> in <strong>Firefox for Android<\/strong> or <strong>Google Chrome<\/strong> instead of Jelly, and allow <strong>Files and media<\/strong> permission under <strong>Android Settings &gt; Apps &gt; [Browser]<\/strong> if prompted.<\/li><li><strong>If Chrome/Firefox show <code>ERR_FILE_NOT_FOUND<\/code> on <code>/storage/emulated/0/Download/...<\/code>:<\/strong> Android Scoped Storage blocks shared-storage <code>file:///<\/code> paths in many newer browsers. Use one of these options:<br>• <strong>Option 1 — Browser&#x27;s own folder (Chrome):<\/strong> Copy the extracted <code>ipc-starter-kit/<\/code> folder into Chrome&#x27;s own directory (<code>/storage/emulated/0/Android/data/com.android.chrome/files/Download/ipc-starter-kit/<\/code>) and open <code>file:///storage/emulated/0/Android/data/com.android.chrome/files/Download/ipc-starter-kit/ipc-kit.html<\/code> in Chrome.<br>• <strong>Option 2 — Localhost (100% offline, best storage reliability):<\/strong> If Termux or an offline local static HTTP server app is installed, run a read-only local server inside the extracted folder (for example in Termux: <code>python3 -m http.server 8000<\/code>) and open <code>http://127.0.0.1:8000/START-HERE.html<\/code> in Firefox or Chrome.<\/li><li><strong>Run Settings &gt; Check this device immediately:<\/strong> Even if <code>ipc-kit.html<\/code> opens via a <code>content://<\/code> URI from a file manager, browsers often block or erase <code>localStorage<\/code> when closed (<code>Saving in this browser: does NOT work<\/code>). On WebView, <code>File download<\/code> and <code>Printing<\/code> will also report <code>does NOT work<\/code> as a reminder to use fallbacks or Firefox/Chrome.<\/li><li><strong>Paper fallback:<\/strong> If <strong>Check this device<\/strong> reports saving failed or data disappears after closing the browser, <strong>print from a desktop computer (or use Clean print view / Chrome / Firefox on Android)<\/strong> and enter paper totals on a verified computer.<\/li><\/ol>\n<h3>C. iPhone and iPad (iOS / iPadOS)<\/h3>\n<ol><li>Tap-previewing <code>ipc-kit.html<\/code> inside the iOS <strong>Files<\/strong> app opens a read-only preview that <strong>does not<\/strong> run the app properly or keep saved data.<\/li><li><strong>Safari on iOS/iPadOS<\/strong> normally cannot open local <code>file://<\/code> HTML files with persistent storage.<\/li><li><strong>Recommendation:<\/strong> Treat iPhone and iPad as <strong>unsupported for direct offline browser use<\/strong> unless your local pilot verifies a working method on your specific devices. <strong>Use the printable paper forms in <code>field-kit/<\/code><\/strong> for ward observations and stock counts.<\/li><\/ol>\n<hr>\n<h2>3. 10-Minute Field Test Protocol (Run Before Real Use)<\/h2>\n<p>Any IPC focal person or tester can verify a device in <strong>10 minutes<\/strong> using this step-by-step protocol:<\/p>\n<ol><li><strong>Turn on Airplane Mode / disconnect from Wi-Fi and mobile data<\/strong> to confirm 100% offline operation.<\/li><li><strong>Open <code>ipc-kit.html<\/code><\/strong> from its permanent folder on the device.<\/li><li><strong>Run the built-in self-test:<\/strong> Go to <strong>Settings &gt; Check this device<\/strong>. Confirm that saving, downloading, and file reading pass, and copy the output line for the log below.<\/li><li><strong>Start the 5-minute practice run:<\/strong> On <strong>Home<\/strong>, click <strong>Try a 5-minute practice run<\/strong>. Verify the top header shows the yellow badge <code>PRACTICE – fictional data<\/code>.<\/li><li><strong>Tally hand hygiene:<\/strong> In <strong>Hand hygiene &gt; Tally<\/strong>, select a month and area code, click <strong>Start<\/strong>, and record 3 opportunities (including one where you tick two moments at the same time, such as Moment 4 and Moment 1). Click <strong>Finish session and add to totals<\/strong> and check that the result shows <code>X of Y opportunities, Z%<\/code>.<\/li><li><strong>Record a stock issue:<\/strong> In <strong>Stock &gt; Record<\/strong>, record one <strong>Issue<\/strong> and check <strong>Stock &gt; Status<\/strong> to confirm the earliest-expiring usable batch (<code>Use first<\/code>) was reduced and alerts update.<\/li><li><strong>Download a backup file:<\/strong> In <strong>Backup<\/strong>, click <strong>Download backup file<\/strong> (or <strong>Show backup text<\/strong> if downloads are blocked) and confirm <code>ipc-kit-backup_YYYY-MM-DD_HHMM_v1.json<\/code> (with <code>PRACTICE<\/code> in the filename) is saved.<\/li><li><strong>Close and reopen the browser:<\/strong> Completely quit the browser, reopen <code>ipc-kit.html<\/code> from the bookmark/folder, and confirm your practice session and stock entry are still there and the header shows <code>✔ Saved on this device HH:MM<\/code>.<\/li><li><strong>Test valid restore:<\/strong> In <strong>Backup &gt; Restore from backup<\/strong>, select the backup file you just downloaded. Confirm the check passes, data restores cleanly, and <strong>Undo restore<\/strong> is offered.<\/li><li><strong>Test invalid restore rejection:<\/strong> Try restoring a non-backup file (for example, <code>README.md<\/code> or a broken text file). Confirm the app reports an error and <strong>nothing in your current data is replaced<\/strong>.<\/li><li><strong>Test printing:<\/strong> Open <strong>Reports &gt; Print report<\/strong> (and open <code>field-kit/hand-hygiene-observation-sheet.html<\/code>) and press <code>Ctrl+P<\/code> / <code>Cmd+P<\/code> to verify clean layout on A4 or US Letter.<\/li><\/ol>\n<h3>Copyable Device Test Log Table<\/h3>\n<p>Copy or print this table into your facility&#x27;s IPC binder (<code>field-kit/ipc-lead-review-and-pilot-checklist.html<\/code>):<\/p>\n<table><thead><tr><th>Date (YYYY-MM-DD)<\/th><th>Device label (no personal names)<\/th><th>OS &amp; Browser version<\/th><th><code>Settings &gt; Check this device<\/code> output<\/th><th>Reload kept data? (Y/N)<\/th><th>Valid backup restored? (Y/N)<\/th><th>Invalid file rejected safely? (Y/N)<\/th><th>Print OK? (Y/N)<\/th><th>Approved for real use? (Y/N)<\/th><th>Checked by role<\/th><\/tr><\/thead><tbody><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table>\n<hr>\n<h2>4. Known Limits &amp; How to Avoid Data Loss<\/h2>\n<ul><li><strong>Clearing browser data deletes local records:<\/strong> Running <em>&quot;Clear browsing data / cookies and site data&quot;<\/em> in the browser erases <code>localStorage<\/code>. Always download a backup file every week and before any browser maintenance.<\/li><li><strong>Private / Incognito windows do not keep data:<\/strong> Never use Private or Incognito mode for real data—everything entered is erased as soon as the window closes.<\/li><li><strong>One browser per device:<\/strong> Data saved in Firefox is not visible in Chrome or Edge on the same computer. Pick one browser, bookmark <code>ipc-kit.html<\/code>, and always use that browser.<\/li><li><strong>Moving the file shows empty data:<\/strong> Many browsers tie <code>file://<\/code> storage to the exact folder path. If you move <code>ipc-kit.html<\/code> to a new folder or a new computer and see an empty dataset, use <strong>Backup &gt; Restore from backup<\/strong> to load your latest <code>.json<\/code> backup file.<\/li><li><strong>Optional desktop helper for checking backups and combining CSV reports:<\/strong> On computers with Python 3 installed, you can also verify backup files and combine multi-area/multi-month CSV exports from a terminal:<br>• <code>python3 tools/ipc_tool.py check-backup FILE<\/code><br>• <code>python3 tools/ipc_tool.py combine-reports A.csv B.csv --by area|period|all<\/code><\/li><\/ul><\/div>"},"docs/TRANSLATING.md":{"id":"docs/TRANSLATING.md","slug":"translating","label":"Translation guide","title":"Translation guide – IPC Starter Kit v1.0.0","kind":"md","inAllSheets":false,"scopeClass":"fk-sheet-md","scopedCss":"@page { size: auto; margin: 12mm; }\n.fk-sheet-md, .fk-sheet-md * { box-sizing: border-box; }\n.fk-sheet-md {\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n  color: #111;\n  background: #fff;\n  padding: 10px;\n  font-size: 13.5px;\n  line-height: 1.45;\n  max-width: 190mm;\n  margin: 0 auto;\n}\n.fk-sheet-md h1 { font-size: 19px; margin: 0 0 8px 0; border-bottom: 2px solid #000; padding-bottom: 4px; }\n.fk-sheet-md h2 { font-size: 15px; margin: 14px 0 6px 0; border-bottom: 1px solid #999; padding-bottom: 2px; }\n.fk-sheet-md h3 { font-size: 13.5px; margin: 10px 0 4px 0; }\n.fk-sheet-md p, .fk-sheet-md ul, .fk-sheet-md ol { margin: 6px 0; }\n.fk-sheet-md ul, .fk-sheet-md ol { padding-left: 20px; }\n.fk-sheet-md li { margin-bottom: 4px; }\n.fk-sheet-md hr { border: 0; border-top: 1px solid #bbb; margin: 12px 0; }\n.fk-sheet-md blockquote { margin: 8px 0; padding: 6px 10px; border-left: 3px solid #12324f; background: #f5f7fa; }\n.fk-sheet-md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: #eef1f5; padding: 1px 4px; border-radius: 3px; }\n.fk-sheet-md pre { background: #f4f6f8; border: 1px solid #ccc; padding: 8px 10px; overflow-x: auto; font-size: 12px; line-height: 1.35; }\n.fk-sheet-md pre code { background: transparent; padding: 0; }\n.fk-sheet-md table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12px; }\n.fk-sheet-md th, .fk-sheet-md td { border: 1px solid #000; padding: 4px 6px; text-align: left; vertical-align: top; }\n.fk-sheet-md th { background: #eee; }\n@media print {\n  .fk-sheet-md { padding: 0; font-size: 11px; max-width: 100%; }\n}","bodyHtml":"<div class=\"page\"><h1>Translation Guide (<code>docs/TRANSLATING.md<\/code>)<\/h1>\n<p>The IPC Starter Kit (<code>ipc-kit.html<\/code> and the printable sheets in <code>field-kit/<\/code>) is written in plain, short, idiom-free English (target reading age ~12) so that local teams can translate it accurately into other languages.<\/p>\n<blockquote><p><strong>Important clinical review notice:<\/strong> The kit includes all <strong>6 official UN languages<\/strong> (<code>en<\/code>, <code>ar<\/code>, <code>zh<\/code>, <code>fr<\/code>, <code>ru<\/code>, <code>es<\/code>). All non-English built-in translations (<strong>Arabic / العربية<\/strong>, <strong>Chinese / 中文<\/strong>, <strong>French / Français<\/strong>, <strong>Russian / Русский<\/strong>, and <strong>Spanish / Español<\/strong>) are draft reference translations and <strong>need review by a fluent local clinical reviewer<\/strong> before use in patient care areas. The same rule applies to any new language added locally.<\/p><\/blockquote>\n<hr>\n<h2>1. How Strings Are Organised in <code>ipc-kit.html<\/code><\/h2>\n<p>Inside <code>ipc-kit.html<\/code> (in <code>&lt;script id=&quot;ipc-strings&quot;&gt;<\/code>), all user-interface text is stored in a single JavaScript object named <code>window.IPC_STRINGS<\/code>, keyed by language code:<\/p>\n<ul><li><code>window.IPC_STRINGS.en<\/code> is the <strong>master English dictionary<\/strong> (<code>ltr<\/code>). Every screen label, button, alert, practice scenario, and report heading has a stable key in <code>en<\/code>.<\/li><li>Five built-in UN translation blocks match every key and placeholder in <code>en<\/code>:<br>• <code>fr<\/code>: <strong>Français<\/strong> (<code>_dir: &#x27;ltr&#x27;<\/code>)<br>• <code>ar<\/code>: <strong>العربية<\/strong> (<code>_dir: &#x27;rtl&#x27;<\/code> — automatically switches <code>&lt;html dir=&quot;rtl&quot;&gt;<\/code> and mirrors navigation, cards, tables, and moment rows while keeping JSON/CSV text boxes and English paper sheets LTR)<br>• <code>es<\/code>: <strong>Español<\/strong> (<code>_dir: &#x27;ltr&#x27;<\/code>)<br>• <code>ru<\/code>: <strong>Русский<\/strong> (<code>_dir: &#x27;ltr&#x27;<\/code>)<br>• <code>zh<\/code>: <strong>中文<\/strong> (<code>_dir: &#x27;ltr&#x27;<\/code>)<\/li><li>Each language block starts with <code>_name<\/code> (the display name shown in <strong>Settings &gt; Language<\/strong>) and <code>_dir<\/code> (<code>&#x27;ltr&#x27;<\/code> or <code>&#x27;rtl&#x27;<\/code>).<\/li><li><strong>Automatic fallback to English:<\/strong> When the app looks up a translation key in the active language, any key that is missing or empty automatically falls back to <code>window.IPC_STRINGS.en<\/code>. This guarantees the app will never show blank buttons or crash if a translation is only partly finished.<\/li><\/ul>\n<hr>\n<h2>2. How to Add or Edit a Language in <code>ipc-kit.html<\/code><\/h2>\n<ol><li>Open <code>ipc-kit.html<\/code> in any plain-text editor (Notepad, TextEdit, VS Code, or gedit — save using <strong>UTF-8<\/strong> encoding).<\/li><li>Find <code>window.IPC_STRINGS<\/code> (<code>&lt;script id=&quot;ipc-strings&quot;&gt;<\/code>) and locate the built-in language block you want to edit (<code>fr<\/code>, <code>ar<\/code>, <code>es<\/code>, <code>ru<\/code>, or <code>zh<\/code>).<\/li><li><strong>To refine a built-in language:<\/strong> Edit the translated strings inside its block directly and save the file. Remember that <code>set_erase_word<\/code> (<code>&#x27;ERASE&#x27;<\/code>) is kept as ASCII <code>ERASE<\/code> across languages so confirmation prompts work identically on any keyboard/IME unless your team explicitly updates both <code>set_erase_confirm<\/code> and <code>set_erase_word<\/code>.<\/li><li><strong>To add another language (for example, Swahili <code>sw<\/code> or Portuguese <code>pt<\/code>):<\/strong><br>• Copy an entire language block (such as <code>fr: { ... },<\/code> or <code>ar: { ... },<\/code>) and paste it before the closing <code>};<\/code> of <code>window.IPC_STRINGS<\/code> with your ISO language code (e.g., <code>sw<\/code> or <code>pt<\/code> — must match <code>/^[a-z]{2,3}(-[A-Za-z0-9]{2,8})?$/<\/code> so backups validate cleanly).<br>• Update <code>_name: &#x27;...&#x27;<\/code> (e.g., <code>&#x27;Kiswahili&#x27;<\/code> or <code>&#x27;Português&#x27;<\/code>) and <code>_dir: &#x27;ltr&#x27;<\/code> (or <code>&#x27;rtl&#x27;<\/code> for right-to-left languages such as Urdu or Pashto). <strong>Settings &gt; Language<\/strong> automatically lists every key present in <code>window.IPC_STRINGS<\/code>.<\/li><li><strong>Keep <code>{placeholders}<\/code> intact:<\/strong><br>• Many dynamic strings contain curly-brace placeholders such as <code>{a}<\/code> (actions), <code>{o}<\/code> (opportunities), <code>{p}<\/code> (percentage), <code>{n}<\/code> (number/count), <code>{q}<\/code> (quantity), <code>{u}<\/code> (unit), <code>{month}<\/code>, <code>{area}<\/code>, <code>{time}<\/code>, <code>{when}<\/code>, <code>{days}<\/code>, <code>{batch}<\/code>, <code>{date}<\/code>, <code>{plan}<\/code>, <code>{f}<\/code> (filename), <code>{t}<\/code> (threshold), <code>{d}<\/code> (date), or <code>{v}<\/code> (version).<br>• <strong>Do not translate, remove, or reorder letters inside <code>{...}<\/code>.<\/strong> Move the <code>{placeholder}<\/code> token to wherever it fits naturally in your language&#x27;s grammar.<br>• Example (<code>opp_result<\/code>):<br>• English: <code>&quot;{a} of {o} opportunities, {p}&quot;<\/code><br>• Arabic: <code>&quot;{a} من {o} فرص، {p}&quot;<\/code><br>• French: <code>&quot;{a} sur {o} opportunités, {p}&quot;<\/code><\/li><li><strong>Keep exact meaning for clinical and logistics terms:<\/strong><br>• <strong>Five moments <code>[HH-01]<\/code>:<\/strong> Make sure the 5 moment labels clearly distinguish <em>1 Before touching a patient<\/em>, <em>2 Before a clean/aseptic procedure<\/em>, <em>3 After body fluid exposure risk<\/em>, <em>4 After touching a patient<\/em>, and <em>5 After touching patient surroundings<\/em>.<br>• <strong>Opportunity vs. Indication <code>[HH-02]<\/code>:<\/strong> Keep the distinction clear that multiple moments (indications) happening at the same time count as <strong>one opportunity<\/strong>.<br>• <strong>Stock terms <code>[ST-01..ST-10]<\/code>:<\/strong> Keep clear distinctions between <em>Usable stock<\/em>, <em>Stockout (0 usable)<\/em>, <em>Reorder point<\/em>, <em>Use first (earliest expiry)<\/em>, <em>Physical count<\/em>, and <em>Adjustment<\/em> reason codes.<\/li><\/ol>\n<hr>\n<h2>3. How to Translate the Printable Field Kit (<code>field-kit/*.html<\/code>)<\/h2>\n<p>Each printable sheet in <code>field-kit/<\/code> is a standalone, self-contained HTML file with inline CSS and no external dependencies:<\/p>\n<ol><li><strong>Copy the file with a language suffix<\/strong> before translating so the English original remains available as a reference:<br>• <code>field-kit/quick-start.html<\/code> → <code>field-kit/quick-start.fr.html<\/code><br>• <code>field-kit/hand-hygiene-observation-sheet.html<\/code> → <code>field-kit/hand-hygiene-observation-sheet.fr.html<\/code><br>• <code>field-kit/stock-card-and-count-sheet.html<\/code> → <code>field-kit/stock-card-and-count-sheet.fr.html<\/code><br>• <code>field-kit/readiness-checklist.html<\/code> → <code>field-kit/readiness-checklist.fr.html<\/code><br>• <code>field-kit/review-routine-and-action-log.html<\/code> → <code>field-kit/review-routine-and-action-log.fr.html<\/code><br>• <code>field-kit/practice-scenarios.html<\/code> → <code>field-kit/practice-scenarios.fr.html<\/code><br>• <code>field-kit/data-handling-plan.html<\/code> → <code>field-kit/data-handling-plan.fr.html<\/code><br>• <code>field-kit/ipc-lead-review-and-pilot-checklist.html<\/code> → <code>field-kit/ipc-lead-review-and-pilot-checklist.fr.html<\/code><\/li><li>Update <code>&lt;html lang=&quot;en&quot;&gt;<\/code> at the top of the copied file to your language code (for example, <code>&lt;html lang=&quot;fr&quot;&gt;<\/code>).<\/li><li><strong>Preserve all hard rules on every translated sheet:<\/strong><br>• Keep the <code>&lt;meta http-equiv=&quot;Content-Security-Policy&quot; content=&quot;default-src &#x27;none&#x27;; style-src &#x27;unsafe-inline&#x27;; img-src data:&quot;&gt;<\/code> header tag and do not add external fonts, scripts, or images.<br>• Keep the privacy notice on every sheet: <em>&quot;Do not write names, ID numbers or clinical details on this sheet.&quot;<\/em><br>• Keep the evidence IDs in brackets (such as <code>[HH-02]<\/code>, <code>[ST-07]<\/code>, <code>[RC-01]<\/code>) and the CC BY-NC-SA 4.0 footer with @mostafase credit and the link to <code>evidence/evidence-register.html<\/code>.<br>• Test print (<code>Ctrl+P<\/code> / <code>Cmd+P<\/code>) on A4 and US Letter to make sure translated text still fits on <strong>one page<\/strong> for the one-page forms (<code>quick-start<\/code>, <code>hand-hygiene-observation-sheet<\/code>, and <code>readiness-checklist<\/code>).<\/li><\/ol>\n<hr>\n<h2>4. Mandatory Clinical &amp; Field Review Checklist<\/h2>\n<p>Before using a translated version in your facility (<code>Part A<\/code> of <code>field-kit/ipc-lead-review-and-pilot-checklist.html<\/code>):<\/p>\n<ol><li><strong>Fluent clinical reviewer check:<\/strong> Have a fluent local nurse, doctor, pharmacist, or IPC focal person read every screen and paper sheet against national IPC terminology.<\/li><li><strong>Role names check:<\/strong> Confirm that the translated responsible roles (<em>IPC focal person<\/em>, <em>Ward in-charge<\/em>, <em>Storekeeper<\/em>, <em>Facility manager<\/em>, <em>Maintenance lead<\/em>, <em>Cleaning supervisor<\/em>) match job titles used in your facility, while still referring to <strong>roles and never personal names<\/strong>.<\/li><li><strong>Practice run test:<\/strong> Have 2–3 staff members complete the 6 practice scenarios and a paper observation sheet in the translated language to confirm there is no ambiguity.<\/li><\/ol><\/div>"}},"csvs":{"evidence/evidence-register.csv":"ID,Used in,Claim (our original wording),Type,Source,Expected section/topic,Verification status,Notes\nHH-01,app rule / training claim,\"Hand hygiene observation uses five moments: (1) Before touching a patient, (2) Before a clean/aseptic procedure, (3) After body fluid exposure risk, (4) After touching a patient, and (5) After touching patient surroundings.\",Published guidance,WHO Hand Hygiene Technical Reference Manual 2009 [TRM],Five moments for hand hygiene concept & indications,Not yet verified against source text – check during local IPC lead review,Original wording only; no WHO graphics bundled.\nHH-02,app metric / app rule,\"When one or more hand hygiene indications (moments) occur together at the same time between care tasks, they are recorded as ONE single hand hygiene opportunity and counted once.\",Published guidance,WHO Hand Hygiene Technical Reference Manual 2009 [TRM],Definition of opportunity vs. indication during direct observation,Not yet verified against source text – check during local IPC lead review,Prevents double-counting transition between patients.\nHH-03,app metric,Hand hygiene adherence (compliance) percentage is calculated as 100 multiplied by total positive actions (hand rub + handwash) divided by total opportunities.,Published guidance,WHO Hand Hygiene Technical Reference Manual 2009 [TRM],Compliance calculation formula,Not yet verified against source text – check during local IPC lead review,\"Denominator is opportunities, not indications.\"\nHH-04,app rule,\"Each observed opportunity has exactly one recorded action outcome: alcohol-based hand rub, handwashing with soap and water, or missed (counted as not performed).\",Published guidance,WHO Hand Hygiene Technical Reference Manual 2009 [TRM],\"Recording hand hygiene actions (rub, wash, missed)\",Not yet verified against source text – check during local IPC lead review,One outcome per opportunity row.\nHH-05,app metric / app rule,\"Multiple observation sessions are combined by summing action counts and opportunity counts first before calculating adherence, never by averaging session percentages.\",Kit design choice,Follows mathematically from HH-03 (WHO TRM 2009),Aggregating observation sessions,Kit design choice (mathematical rule),Tested in Scenario 6 and enforced in app & CLI tool.\nHH-06,app metric / app rule,\"Adherence is always displayed with numerator and denominator counts ('X of Y opportunities, Z%'), shows 'No observations' when Y = 0, and avoids misleading 0% or 100% rounding on non-extreme values.\",Kit design choice,IPC Starter Kit design rule,Reporting display format,Kit design choice (verified in app UI),Prevents misinterpreting small denominators.\nHH-07,app metric / app rule,Hand hygiene results based on fewer than 200 opportunities (default; facility can change this threshold in Settings) are flagged 'Small sample – interpret with care'.,Facility choice,\"Facility choice, informed by WHO Hand Hygiene Technical Reference Manual 2009 [TRM]\",Sample size guidance for hand hygiene observation (~200 opportunities per unit/period),Not yet verified against source text – check during local IPC lead review,Configurable locally in Settings; default 200.\nHH-08,training claim,A standard direct hand hygiene observation session lasts about 20 minutes.,Published guidance,WHO Hand Hygiene Technical Reference Manual 2009 [TRM],Observation session duration guidance,Not yet verified against source text – check during local IPC lead review,Verify exact session length wording during local review.\nHH-09,training claim,Observers should be trained and practice with sample scenarios before collecting real observation data.,Published guidance,WHO Hand Hygiene Technical Reference Manual 2009 [TRM],Observer training and validation,Not yet verified against source text – check during local IPC lead review,Supported by 5-minute practice run & 6 scenarios.\nHH-10,app rule / training claim,\"Hand hygiene observation is used to improve systems and is not used to identify, blame, or judge individuals; the kit stores only grouped counts by month and area code with no names, staff categories, or timestamps.\",Published guidance,WHO Hand Hygiene Technical Reference Manual 2009 [TRM] + Kit design choice,\"Observation ethics, anonymity, and non-punitive feedback\",Not yet verified against source text – check during local IPC lead review,Omitting staff category is an intentional kit privacy choice.\nHH-11,training claim,Wearing medical gloves does not replace hand hygiene; hands must be cleaned when indicated before putting on gloves and after removing gloves.,Published guidance,WHO Hand Hygiene Technical Reference Manual 2009 [TRM]; WHO Guidelines on Hand Hygiene in Health Care 2009,Glove use and hand hygiene indications,Not yet verified against source text – check during local IPC lead review,Practiced in Scenarios 2 and 3.\nHH-12,training claim / checklist item,Observation results are fed back regularly to health workers and facility leadership to guide practical improvements.,Published guidance,WHO TRM 2009; WHO Minimum requirements for IPC programmes 2019,\"Performance feedback; Core Component 6 (Monitoring, audit and feedback)\",Not yet verified against source text – check during local IPC lead review,Used in 30-minute monthly review routine.\nHH-13,training claim,Cleaning hands with alcohol-based hand rub takes about 20–30 seconds; washing hands with soap and water takes about 40–60 seconds.,Published guidance,WHO Guidelines on Hand Hygiene in Health Care 2009,Duration of handrubbing and handwashing procedures,Not yet verified against source text – check during local IPC lead review,Verify exact duration range during local review.\nST-01,app rule / checklist item,\"Each tracked IPC supply item uses one consistent counting unit (such as bottle, box of 100, or bar), which is locked after the first entry so counts never mix units.\",Published guidance,\"USAID | DELIVER PROJECT, The Logistics Handbook (2nd ed., 2011) [LH]\",Standard unit of count on logistics records,Not yet verified against source text – check during local IPC lead review,App locks unit after first stock record.\nST-02,app metric / app rule,Stock on hand (balance) counts only usable stock available for use and excludes expired or damaged items.,Published guidance,\"USAID | DELIVER PROJECT, The Logistics Handbook 2011 [LH]\",Definition of usable stock on hand,Not yet verified against source text – check during local IPC lead review,Expired stock is separated in app & paper cards.\nST-03,app metric / app rule,A stockout occurs when usable stock on hand for an item reaches zero.,Published guidance,\"USAID | DELIVER PROJECT, The Logistics Handbook 2011 [LH]\",Stockout definition and monitoring,Not yet verified against source text – check during local IPC lead review,\"Even if expired batches exist on shelf, 0 usable = stockout.\"\nST-04,app rule / checklist item,Staff perform regular physical counts of visible stock on the shelf and adjust stock records to match actual usable quantities.,Published guidance,\"USAID | DELIVER PROJECT, The Logistics Handbook 2011 [LH]\",Physical inventory count and record reconciliation,Not yet verified against source text – check during local IPC lead review,Supported by Page 2 of stock sheet and app Count entry.\nST-05,app rule,\"All stock losses and adjustments are recorded separately from issues and require an explicit reason code (Expired – removed, Damaged, Lost, Transferred out, Found, Transferred in, Correction).\",Published guidance,\"USAID | DELIVER PROJECT, The Logistics Handbook 2011 [LH]\",Recording losses and adjustments on stock records,Not yet verified against source text – check during local IPC lead review,Distinguishes consumption (issues) from losses.\nST-06,app rule / checklist item,\"Stock cards and app records capture date, receipts, issues, physical counts, losses/adjustments, usable balance, batch number, and expiry date.\",Published guidance,\"USAID | DELIVER PROJECT, The Logistics Handbook 2011 [LH]\",Essential data elements on stockkeeping records / bin cards,Not yet verified against source text – check during local IPC lead review,Area code is optional on issues.\nST-07,app rule,\"Supplies that expire are managed by first-to-expire, first-out (FEFO): the earliest-expiring usable batch is displayed first as 'Use first' and automatically deducted first on issue.\",Published guidance,\"USAID | DELIVER PROJECT, The Logistics Handbook 2011 [LH]\",\"First-to-expire, first-out (FEFO) warehouse/storeroom rule\",Not yet verified against source text – check during local IPC lead review,Reduces wastage from expiry.\nST-08,app rule / checklist item,The expiry alert window defaults to 90 days before an item's expiry date and can be customized by the facility or per item.,Facility choice,Facility choice (local resupply lead-time setting),Configurable expiry warning lead time,Facility choice (configurable in Settings and per item),Set longer if resupply deliveries take >3 months.\nST-09,app rule / checklist item,Each supply item has a locally set reorder point that triggers an alert when usable stock is at or below that quantity.,Facility choice,\"Facility choice, informed by USAID | DELIVER Logistics Handbook 2011 [LH]\",Minimum/maximum stock levels and emergency order point concepts,Not yet verified against source text – check during local IPC lead review,Facility calculates based on monthly use and lead time.\nST-10,app rule / checklist item,Expired stock never counts toward usable stock totals and must be removed from usable storage; an expiry date is treated as usable up to and including that calendar date.,Published guidance,\"USAID | DELIVER PROJECT, The Logistics Handbook 2011 [LH]\",Handling expired products and usable stock calculation,Not yet verified against source text – check during local IPC lead review,Inclusive expiry date boundary is explicit in app logic.\nRC-01,checklist item,\"Safe water is available in patient care areas for handwashing and environmental cleaning, with covered backup water storage where piped supply is intermittent.\",Published guidance,\"WHO/UNICEF WASH FIT (2nd ed., 2022); WHO Minimum requirements for IPC programmes 2019\",\"Water domain indicators; Core Component 8 (Built environment, materials and equipment for IPC)\",Not yet verified against source text – check during local IPC lead review,Readiness checklist Section 1.\nRC-02,checklist item,Functional hand hygiene stations with soap and running water or alcohol-based hand rub are available at points of care and within 5 metres of toilets.,Published guidance,\"WHO/UNICEF WASH FIT (2nd ed., 2022); WHO Minimum requirements for IPC programmes 2019\",Hand hygiene domain indicators; Core Component 8,Not yet verified against source text – check during local IPC lead review,Readiness checklist Sections 2 and 3.\nRC-03,checklist item,\"Environmental cleaning supplies (detergent, disinfectant, mops/buckets, utility gloves) and a clear cleaning routine are available and followed.\",Published guidance,\"WHO/UNICEF WASH FIT (2nd ed., 2022); WHO Minimum requirements for IPC programmes 2019\",Environmental cleanliness domain; Core Component 8,Not yet verified against source text – check during local IPC lead review,Readiness checklist Section 4.\nRC-04,checklist item,\"Health care waste is segregated at the point of generation (such as a three-bin system for general, infectious, and sharps waste) and safely stored/treated.\",Published guidance,\"WHO/UNICEF WASH FIT (2nd ed., 2022); WHO Minimum requirements for IPC programmes 2019\",Health care waste management domain; Core Component 8,Not yet verified against source text – check during local IPC lead review,Readiness checklist Section 5.\nRC-05,checklist item,Sharps are placed immediately into puncture-resistant sharps containers located within arm's reach and replaced before passing the three-quarters fill line.,Published guidance,\"WHO/UNICEF WASH FIT (2nd ed., 2022)\",Sharps waste safety indicators,Not yet verified against source text – check during local IPC lead review,Readiness checklist item 5.2.\nRC-06,checklist item / app rule,Improvement action plans assign each corrective action to a responsible role with a due date and review completion at the next review meeting.,Published guidance,\"WHO/UNICEF WASH FIT (2nd ed., 2022)\",Incremental improvement plan & review cycle,Not yet verified against source text – check during local IPC lead review,Kit uses roles (never personal names) for accountability.\nIPC-01,app rule / checklist item,\"Regular IPC monitoring, audit of practices and supplies, and timely feedback to staff and leadership are core requirements of an IPC programme.\",Published guidance,WHO Minimum requirements for IPC programmes 2019,Core Component 6: Monitoring/audit of IPC practices and feedback,Not yet verified against source text – check during local IPC lead review,Basis for monthly review routine.\nIPC-02,checklist item / training claim,\"Each facility should have a designated, trained IPC focal person (or lead) responsible for coordinating IPC activities and local reviews.\",Published guidance,WHO Minimum requirements for IPC programmes 2019,Core Component 1: IPC programmes (primary care & facility level),Not yet verified against source text – check during local IPC lead review,Role responsible for Part A review and monthly routine.\nIPC-03,training claim,\"Effective IPC improvement combines multiple elements (supplies at point of care, training, observation and feedback, reminders, and supportive culture).\",Published guidance,WHO Minimum requirements for IPC programmes 2019,Core Component 5: Multimodal strategies for IPC interventions,Not yet verified against source text – check during local IPC lead review,\"Explains why stock, readiness, and hand hygiene are paired.\"\nPR-01,checklist item,\"The Facility Data-Handling Plan organizes local device, backup, access, and retention rules around administrative, physical, and technical safeguard categories as a reference model, not a claim of legal HIPAA compliance.\",Published guidance,US Department of Health and Human Services (HHS) – HIPAA Security Rule,\"Administrative, Physical, and Technical Safeguards (45 CFR Part 164 Subpart C)\",Not yet verified against source text – check during local IPC lead review,Reference model only; kit stores no ePHI.\nPR-02,app rule / checklist item,\"Personal identifiers listed in the HIPAA Safe Harbor de-identification standard (names, ID numbers, exact timestamps, photos, clinical details) are excluded from all app fields and paper sheets.\",Published guidance,US Department of Health and Human Services (HHS) – HIPAA Privacy Rule,Safe Harbor de-identification method (45 CFR 164.514(b)(2)),Not yet verified against source text – check during local IPC lead review,Used to verify that no identifying fields exist.\nPR-03,app rule,The IPC Starter Kit stores no personal health information (PHI) or staff identifiers; any future workflow that collects PHI requires a separate deployment-specific privacy and security review.,Kit design choice,IPC Starter Kit architecture & scope boundary,Data minimization and zero-PHI scope,Kit design choice (verified in schema & forms),Enforced across all HTML forms and JSON/CSV exports.\n"}};

<script id="ipc-ui">
/* ==========================================================================
   IPC UI — offline browser interface for Hand Hygiene & IPC Stock Monitoring.
   Uses only IPCCore and IPC_STRINGS. Zero network requests.
   ========================================================================== */
(function () {
  'use strict';
  var C = window.IPCCore;
  var STRINGS = window.IPC_STRINGS;

  var KEY_MODE = 'ipc_kit_v1_mode';
  var KEY_REAL = 'ipc_kit_v1_real';
  var KEY_PRACTICE = 'ipc_kit_v1_practice';
  var KEY_PROG = 'ipc_kit_v1_practice_progress';
  var KEY_SAFETY = 'ipc_kit_v1_safety_';

  var state = {
    mode: null,            // 'practice' | 'real' | null (welcome screen)
    data: null,
    lang: 'en',
    storageOk: true,
    corruptNotice: false,
    tab: 'home',           // 'home' | 'hh' | 'stock' | 'reports' | 'backup' | 'settings'
    kitDoc: null,          // null | embedded document ID when viewing built-in field kit / guides
    kitFallbackText: '',
    kitFallbackName: '',
    kitCleanView: false,
    repCleanView: false,
    printWebViewWarn: false,
    hhSub: 'tally',        // 'tally' | 'paper' | 'results' | 'practice'
    stockSub: 'status',    // 'status' | 'record' | 'items'
    selectedMoments: [],   // [1..5] on tally screen
    paperShowMoments: false,
    filterFrom: '',
    filterTo: '',
    filterArea: '',
    txnType: 'issue',
    txnItemId: '',
    expandedItemId: '',
    editingItemId: null,
    pendingRestore: null,  // parsed backup object awaiting confirmation
    showBackupText: false,
    lastBackupJson: '',
    lastBackupFilename: '',
    lastCsvText: '',
    lastCsvFilename: '',
    deviceCheckReport: '',
    pqAnswers: {},         // {1: {moments:[1,4], outcome:'rub', checked:true, ok:true}, ...}
    practiceProgress: { quizDone: false, tallyDone: false, sessionFinished: false, stockIssued: false, backupDone: false }
  };

  /* ---------- date & translation helpers ---------- */
  function today() {
    if (window.__IPC_TEST_TODAY && C.isValidDate(window.__IPC_TEST_TODAY)) return window.__IPC_TEST_TODAY;
    return C.isoDate(new Date());
  }
  function nowTimeStr() {
    var d = new Date();
    return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
  }
  function t(key, vars) {
    var pack = STRINGS[state.lang] || STRINGS.en;
    var s = (pack && pack[key] !== undefined) ? pack[key] : (STRINGS.en[key] !== undefined ? STRINGS.en[key] : key);
    if (vars) {
      Object.keys(vars).forEach(function (k) {
        s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), String(vars[k]));
      });
    }
    return s;
  }
  function esc(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function fmtOppResult(actions, opp) {
    if (!(opp > 0)) return t('no_observations');
    var p = C.fmtPct(actions, opp);
    return t(opp === 1 ? 'opp_result_one' : 'opp_result', { a: actions, o: opp, p: p });
  }
  function fmtBackupWhen(iso) {
    if (!iso) return t('never');
    var d = iso.slice(0, 10);
    if (!C.isValidDate(d)) return iso.slice(0, 16).replace('T', ' ');
    var diff = C.daysBetween(d, today());
    if (diff <= 0) return t('today_word') + ' (' + d + ')';
    return t('days_ago', { n: diff }) + ' (' + d + ')';
  }

  /* ---------- localStorage wrapper & save indicator ---------- */
  function probeStorage() {
    try {
      var k = '__ipc_probe__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }
  function updateSaveIndicator(savedJustNow) {
    var el = document.getElementById('saveStatus');
    if (!el) return;
    if (!state.storageOk) {
      el.className = 'bad';
      el.textContent = t('no_storage_short');
      return;
    }
    el.className = 'ok';
    el.textContent = savedJustNow ? t('saved_at', { time: nowTimeStr() }) : t('saved_loaded');
  }
  function saveKey(mode) { return mode === 'practice' ? KEY_PRACTICE : KEY_REAL; }
  function saveCurrentData() {
    if (!state.mode || !state.data) return false;
    if (!state.storageOk) { updateSaveIndicator(false); return false; }
    try {
      window.localStorage.setItem(KEY_MODE, state.mode);
      window.localStorage.setItem(saveKey(state.mode), JSON.stringify(state.data));
      window.localStorage.setItem(KEY_PROG, JSON.stringify(state.practiceProgress));
      updateSaveIndicator(true);
      return true;
    } catch (e) {
      state.storageOk = false;
      updateSaveIndicator(false);
      return false;
    }
  }
  function loadStoredData(mode) {
    var key = saveKey(mode);
    if (!state.storageOk) {
      return mode === 'practice' ? C.demoData(today()) : C.emptyData();
    }
    var raw = null;
    try { raw = window.localStorage.getItem(key); } catch (e) { state.storageOk = false; }
    if (!raw) {
      var fresh = mode === 'practice' ? C.demoData(today()) : C.emptyData();
      try { window.localStorage.setItem(key, JSON.stringify(fresh)); } catch (e) { state.storageOk = false; }
      return fresh;
    }
    try {
      var parsed = JSON.parse(raw);
      var errs = C.validateData(parsed);
      if (errs.length === 0) return parsed;
    } catch (e) { /* fall through to corrupt handling */ }
    // Preserve unreadable data so nothing is silently lost, then start clean.
    state.corruptNotice = true;
    try { window.localStorage.setItem(key + '_corrupt_' + Date.now(), raw); } catch (e) { /* ignore */ }
    var fallback = mode === 'practice' ? C.demoData(today()) : C.emptyData();
    try { window.localStorage.setItem(key, JSON.stringify(fallback)); } catch (e) { /* ignore */ }
    return fallback;
  }
  function loadPracticeProgress() {
    if (!state.storageOk) return;
    try {
      var raw = window.localStorage.getItem(KEY_PROG);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && typeof p === 'object') {
          ['quizDone', 'tallyDone', 'sessionFinished', 'stockIssued', 'backupDone'].forEach(function (k) {
            if (typeof p[k] === 'boolean') state.practiceProgress[k] = p[k];
          });
        }
      }
    } catch (e) { /* ignore */ }
  }
  function setMode(mode, initFresh) {
    state.mode = mode;
    if (initFresh) {
      state.data = mode === 'practice' ? C.demoData(today()) : C.emptyData();
      state.data.settings.language = state.lang;
      saveCurrentData();
    } else {
      state.data = loadStoredData(mode);
      if (state.data && state.data.settings && state.data.settings.language) {
        state.lang = state.data.settings.language;
      }
      saveCurrentData();
    }
    state.selectedMoments = [];
    state.pendingRestore = null;
    if (mode === 'real' && state.data.settings.areaCodes.length === 0) {
      state.tab = 'settings';
    } else {
      state.tab = 'home';
    }
    render();
  }

  /* ---------- toast & modal helpers ---------- */
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.innerHTML = '<div>' + esc(msg) + '</div>';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.innerHTML = ''; }, 4000);
  }
  function closeModal() {
    var root = document.getElementById('modalRoot');
    if (root) root.innerHTML = '';
  }
  function confirmModal(message, onYes, requireWord) {
    var root = document.getElementById('modalRoot');
    if (!root) return;
    var wordHtml = requireWord
      ? '<input type="text" id="modalWordInput" autocomplete="off" placeholder="' + esc(requireWord) + '" style="margin-top:.6rem">'
      : '';
    var yesClass = requireWord ? 'danger solid' : 'primary';
    root.innerHTML =
      '<div class="modal-back" role="dialog" aria-modal="true">' +
        '<div class="modal">' +
          '<p style="font-weight:600;font-size:1.05rem">' + esc(message) + '</p>' +
          wordHtml +
          '<div class="row" style="margin-top:1rem;justify-content:flex-end">' +
            '<button type="button" id="modalCancel">' + esc(t('btn_cancel')) + '</button>' +
            '<button type="button" class="' + yesClass + '" id="modalYes"' + (requireWord ? ' disabled' : '') + '>' + esc(t('btn_yes')) + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('modalCancel').onclick = closeModal;
    var yesBtn = document.getElementById('modalYes');
    if (requireWord) {
      var wordIn = document.getElementById('modalWordInput');
      wordIn.oninput = function () { yesBtn.disabled = wordIn.value.trim() !== requireWord; };
      wordIn.focus();
    }
    yesBtn.onclick = function () {
      if (requireWord) {
        var cur = document.getElementById('modalWordInput');
        if (!cur || cur.value.trim() !== requireWord) return;
      }
      closeModal();
      onYes();
    };
  }

  /* ---------- WebView, download, copy & print helpers ---------- */
  function isAndroidWebView() {
    try {
      var ua = (navigator && navigator.userAgent) ? String(navigator.userAgent) : '';
      return /Android/i.test(ua) && /(?:;\s*wv\b|\bwv\)|Build\/.*\bVersion\/4\.0\b)/i.test(ua);
    } catch (e) {
      return false;
    }
  }

  function syncCleanPrintMode() {
    if (!document.body || !document.body.classList) return;
    var isClean = !!((state.kitDoc && state.kitCleanView) || (state.mode && !state.kitDoc && state.tab === 'reports' && state.repCleanView));
    if (isClean) document.body.classList.add('clean-print-mode');
    else document.body.classList.remove('clean-print-mode');
  }

  function copyTextValue(text, textareaId) {
    var el = textareaId ? document.getElementById(textareaId) : null;
    if (el) {
      el.focus();
      el.select();
      try { el.setSelectionRange(0, el.value.length); } catch (e) { /* ignore */ }
    }
    var copied = false;
    try {
      if (document.execCommand && document.execCommand('copy')) copied = true;
    } catch (e) { /* ignore */ }
    if (copied) {
      toast(t('copied_ok'));
      return;
    }
    if (navigator && navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      navigator.clipboard.writeText(String(text || '')).then(function () {
        toast(t('copied_ok'));
      }, function () {
        toast(t('copy_manual'));
      });
      return;
    }
    toast(t('copy_manual'));
  }

  function triggerPrint(scope) {
    var wv = isAndroidWebView();
    var noPrintFn = (typeof window.print !== 'function');
    if (!noPrintFn) {
      try { window.print(); } catch (e) { noPrintFn = true; }
    }
    if (wv || noPrintFn) {
      state.printWebViewWarn = true;
      if (scope === 'kit') renderKitViewer();
      else if (scope === 'reports') renderReports();
    }
  }

  function triggerDownload(filename, content, mime) {
    if (isAndroidWebView()) return false;
    try {
      var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      return true;
    } catch (e) {
      return false;
    }
  }

  /* ---------- header & tabs ---------- */
  function renderHeader() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = t('_dir');
    var brand = document.getElementById('brand');
    if (brand) {
      var fl = state.data && state.data.settings && state.data.settings.facilityLabel;
      brand.textContent = t('app_name') + (fl ? ' · ' + fl : '');
    }
    var badge = document.getElementById('modeBadge');
    if (badge) {
      if (!state.mode) {
        badge.style.display = 'none';
      } else {
        badge.style.display = 'inline-block';
        badge.className = 'badge ' + (state.mode === 'practice' ? 'practice' : 'real');
        badge.textContent = state.mode === 'practice' ? t('mode_practice') : t('mode_real');
      }
    }
    var nav = document.getElementById('tabs');
    if (!nav) return;
    if (!state.mode) { nav.innerHTML = ''; return; }
    var tabs = [
      ['home', t('tab_home')],
      ['hh', t('tab_hh')],
      ['stock', t('tab_stock')],
      ['reports', t('tab_reports')],
      ['backup', t('tab_backup')],
      ['settings', t('tab_settings')]
    ];
    nav.innerHTML = tabs.map(function (pair) {
      var cur = state.tab === pair[0] ? ' aria-current="page"' : '';
      return '<button type="button" data-tab="' + pair[0] + '"' + cur + '>' + esc(pair[1]) + '</button>';
    }).join('');
    Array.prototype.forEach.call(nav.querySelectorAll('button[data-tab]'), function (btn) {
      btn.onclick = function () {
        state.kitDoc = null;
        state.kitFallbackText = '';
        state.kitCleanView = false;
        state.repCleanView = false;
        state.printWebViewWarn = false;
        state.tab = btn.getAttribute('data-tab');
        render();
      };
    });
  }

  /* ---------- Welcome screen (first launch) ---------- */
  function renderWelcome() {
    var v = document.getElementById('view');
    var langOpts = Object.keys(STRINGS).map(function (code) {
      var sel = code === state.lang ? ' selected' : '';
      return '<option value="' + esc(code) + '"' + sel + '>' + esc(STRINGS[code]._name || code) + '</option>';
    }).join('');
    v.innerHTML =
      '<div class="card">' +
        '<h1>' + esc(t('welcome_title')) + '</h1>' +
        '<p>' + esc(t('welcome_text')) + '</p>' +
        '<p class="msg info">' + esc(t('privacy_rule')) + '</p>' +
        '<label for="welcomeLang">' + esc(t('language')) + '</label>' +
        '<select id="welcomeLang">' + langOpts + '</select>' +
        '<div class="grid2" style="margin-top:1rem">' +
          '<div class="card" style="border:2px solid #12324f">' +
            '<h2>' + esc(t('welcome_practice')) + '</h2>' +
            '<p class="muted">' + esc(t('welcome_practice_sub')) + '</p>' +
            '<button type="button" class="primary wide" id="btnStartPractice">' + esc(t('welcome_practice')) + '</button>' +
          '</div>' +
          '<div class="card">' +
            '<h2>' + esc(t('welcome_real')) + '</h2>' +
            '<p class="muted">' + esc(t('welcome_real_sub')) + '</p>' +
            '<button type="button" class="wide" id="btnStartReal">' + esc(t('welcome_real')) + '</button>' +
          '</div>' +
        '</div>' +
        '<div style="margin-top:.8rem">' +
          '<button type="button" id="btnWelcomeKit">' + esc(t('welcome_kit')) + '</button>' +
        '</div>' +
      '</div>';
    document.getElementById('welcomeLang').onchange = function (e) {
      state.lang = e.target.value;
      render();
    };
    document.getElementById('btnStartPractice').onclick = function () { state.kitDoc = null; setMode('practice', true); };
    document.getElementById('btnStartReal').onclick = function () { state.kitDoc = null; setMode('real', true); };
    document.getElementById('btnWelcomeKit').onclick = function () { openKitDoc('field-kit/quick-start.html', 'welcome'); };
  }

  /* ---------- Home screen ---------- */
  function renderHome() {
    var d = state.data;
    var curMonth = C.periodOf(today());
    var hhMonth = C.hhGroup(d.hh.entries, { from: curMonth, to: curMonth }, d.settings.smallSampleThreshold);
    var statuses = C.allStockStatus(d, today());
    var nOut = statuses.filter(function (s) { return s.stockout; }).length;
    var nLow = statuses.filter(function (s) { return s.low; }).length;
    var nExp = statuses.filter(function (s) { return s.expiringSoon; }).length;
    var nExpired = statuses.filter(function (s) { return s.hasExpired; }).length;

    var html = '';
    if (d.settings.areaCodes.length === 0) {
      html += '<div class="msg warn">' + esc(t('setup_needed')) +
        ' <button type="button" id="btnHomeGoSettings">' + esc(t('go_settings')) + '</button></div>';
    }
    if (state.mode === 'practice') {
      var p = state.practiceProgress;
      var steps = [
        { done: p.quizDone, label: t('practice_step1'), act: 'step1' },
        { done: p.tallyDone, label: t('practice_step2'), act: 'step2' },
        { done: p.sessionFinished, label: t('practice_step3'), act: 'step3' },

      '<div class="card">' +

        '<p class="muted">' + esc(t('home_kit_desc')) + '</p>' +
        '<div class="row">' +
          '<button type="button" id="btnHomeGoKit">' + esc(t('home_kit_btn')) + '</button>' +

        '</div>' +

    if (document.getElementById('btnSwitchModeHome')) {
      document.getElementById('btnSwitchModeHome').onclick = function () { setMode('real', false); };

    document.getElementById('btnHomeGoHH').onclick = function () { state.tab = 'hh'; render(); };

    { id: 2, type: 'tally', textKey: 'pq_2', explKey: 'pq_2_expl', moments: [2], outcome: 'missed' },
    { id: 3, type: 'tally', textKey: 'pq_3', explKey: 'pq_3_expl', moments: [3], outcome: 'wash' },
    { id: 4, type: 'tally', textKey: 'pq_4', explKey: 'pq_4_expl', moments: [5], outcome: 'missed' },
