  function renderHH() {
    var d = state.data;
    var v = document.getElementById('view');
    var subs = [
      ['tally', t('hh_sub_tally')],
      ['paper', t('hh_sub_paper')],
      ['results', t('hh_sub_results')],
      ['practice', t('hh_sub_practice')]
    ];
    var navHtml = '<h1>' + esc(t('hh_title')) + '</h1>' +
      '<p class="card privacy muted">' + esc(t('privacy_rule')) + '</p>' +
      '<div class="subnav">' +
      subs.map(function (p) {
        var cur = state.hhSub === p[0] ? ' aria-current="page"' : '';
        return '<button type="button" data-hhsub="' + p[0] + '"' + cur + '>' + esc(p[1]) + '</button>';
      }).join('') +
      '</div><div id="hhBody"></div>';
    v.innerHTML = navHtml;
    Array.prototype.forEach.call(v.querySelectorAll('button[data-hhsub]'), function (b) {
      b.onclick = function () { state.hhSub = b.getAttribute('data-hhsub'); renderHH(); };
    });

    var body = document.getElementById('hhBody');
    if (state.hhSub !== 'practice' && d.settings.areaCodes.length === 0) {
      body.innerHTML = '<div class="msg warn">' + esc(t('setup_needed')) +
        ' <button type="button" id="btnHHGoSettings">' + esc(t('go_settings')) + '</button></div>';
      document.getElementById('btnHHGoSettings').onclick = function () { state.tab = 'settings'; render(); };
      return;
    }
    if (state.hhSub === 'tally') renderHHTally(body);
    else if (state.hhSub === 'paper') renderHHPaper(body);
    else if (state.hhSub === 'results') renderHHResults(body);
    else renderHHPractice(body);
  }

  function renderHHTally(body) {
    var d = state.data;
    var dr = d.hh.draft;
    if (!dr) {
      var curMonth = C.periodOf(today());
      var areaOpts = d.settings.areaCodes.map(function (c) {
        return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
      }).join('');
      body.innerHTML =
        '<div class="card">' +
          '<h2>' + esc(t('tally_start_title')) + '</h2>' +
          '<div class="grid2">' +
            '<div><label for="tallyPeriod">' + esc(t('month')) + '</label>' +
              '<input type="month" id="tallyPeriod" placeholder="YYYY-MM" value="' + esc(curMonth) + '"></div>' +
            '<div><label for="tallyArea">' + esc(t('area')) + '</label>' +
              '<select id="tallyArea">' + areaOpts + '</select></div>' +
          '</div>' +
          '<div id="tallyStartErr" class="field-error" style="margin-top:.4rem"></div>' +
          '<button type="button" class="primary wide" id="btnStartTally" style="margin-top:.7rem">' + esc(t('tally_start')) + '</button>' +
        '</div>';
      document.getElementById('btnStartTally').onclick = function () {
        var per = document.getElementById('tallyPeriod').value.trim();
        var ar = document.getElementById('tallyArea').value;
        if (!C.isValidPeriod(per)) {
          document.getElementById('tallyStartErr').textContent = t('err_hh_period');
          return;
        }
        if (d.settings.areaCodes.indexOf(ar) < 0) {
          document.getElementById('tallyStartErr').textContent = t('err_hh_area');
          return;
        }
        d.hh.draft = C.newDraft(per, ar);
        state.selectedMoments = [];
        saveCurrentData();
        renderHH();
      };
      return;
    }

    var opp = C.hhOpp(dr);
    var actions = dr.rub + dr.wash;
    var resStr = fmtOppResult(actions, opp);
    var lastStr = '';
    if (dr.last) {
      var mLabels = dr.last.moments.map(function (m) { return 'M' + m; }).join('+');
      var oLabel = dr.last.outcome === 'rub' ? t('out_rub') : dr.last.outcome === 'wash' ? t('out_wash') : t('out_missed');
      lastStr = t('tally_last', { m: mLabels, o: oLabel });
    }

    var momentBtns = [1, 2, 3, 4, 5].map(function (m) {
      var pressed = state.selectedMoments.indexOf(m) >= 0 ? 'true' : 'false';
      return '<button type="button" class="moment" data-moment="' + m + '" aria-pressed="' + pressed + '">' +
        '<span class="num">' + m + '</span><span>' + esc(t('moment_' + m)) + '</span></button>';
    }).join('');

    body.innerHTML =
      '<div class="card">' +
        '<h2>' + esc(t('tally_observing', { area: dr.area, month: dr.period })) + '</h2>' +
        '<p class="muted">' + esc(t('tally_note')) + '</p>' +
        '<h3>' + esc(t('tally_step1')) + '</h3>' +
        '<div class="moments" id="tallyMoments">' + momentBtns + '</div>' +
        '<h3>' + esc(t('tally_step2')) + '</h3>' +
        '<div class="outcomes">' +
          '<button type="button" class="outcome rub" data-outcome="rub">' + esc(t('out_rub')) + '</button>' +
          '<button type="button" class="outcome wash" data-outcome="wash">' + esc(t('out_wash')) + '</button>' +
          '<button type="button" class="outcome missed" data-outcome="missed">' + esc(t('out_missed')) + '</button>' +
        '</div>' +
        '<div id="tallyMsg" class="field-error" style="margin-top:.5rem"></div>' +
      '</div>' +
      '<div class="card">' +
        '<h3>' + esc(t('tally_so_far')) + '</h3>' +
        '<p class="result" id="tallyRunningResult">' + esc(resStr) + '</p>' +
        '<p id="tallyRunningCounts">' + esc(t('tally_counts', { r: dr.rub, w: dr.wash, x: dr.missed })) + '</p>' +
        (lastStr ? '<p class="muted" id="tallyLastOp">' + esc(lastStr) + '</p>' : '') +
        '<div class="row" style="margin-top:.6rem">' +
          '<button type="button" id="btnUndoTally"' + (dr.last ? '' : ' disabled') + '>' + esc(t('tally_undo')) + '</button>' +
          '<button type="button" class="primary" id="btnFinishTally"' + (opp > 0 ? '' : ' disabled') + '>' + esc(t('tally_finish')) + '</button>' +
          '<button type="button" class="danger" id="btnDiscardTally">' + esc(t('tally_discard')) + '</button>' +
        '</div>' +
      '</div>';

    Array.prototype.forEach.call(body.querySelectorAll('button.moment'), function (btn) {
      btn.onclick = function () {
        var m = +btn.getAttribute('data-moment');
        var idx = state.selectedMoments.indexOf(m);
        if (idx >= 0) state.selectedMoments.splice(idx, 1);
        else state.selectedMoments.push(m);
        state.selectedMoments.sort();
        renderHHTally(body);
      };
    });

    Array.prototype.forEach.call(body.querySelectorAll('button.outcome'), function (btn) {
      btn.onclick = function () {
        var outcome = btn.getAttribute('data-outcome');
        if (state.selectedMoments.length === 0) {
          document.getElementById('tallyMsg').textContent = t('tally_need_moment');
          return;
        }
        var hadOverlap = state.selectedMoments.length > 1;
        d.hh.draft = C.draftRecord(d.hh.draft, state.selectedMoments, outcome);
        var newOpp = C.hhOpp(d.hh.draft);
        var mStr = state.selectedMoments.map(function (m) { return 'M' + m; }).join('+');
        var oStr = outcome === 'rub' ? t('out_rub') : outcome === 'wash' ? t('out_wash') : t('out_missed');
        state.selectedMoments = [];
        if (newOpp >= 3 || hadOverlap) {
          var sumInd = d.hh.draft.ind.reduce(function (a, b) { return a + b; }, 0);
          if (newOpp >= 3 && sumInd > newOpp) state.practiceProgress.tallyDone = true;
        }
        saveCurrentData();
        toast(t('tally_recorded', { n: newOpp, m: mStr, o: oStr }));
        renderHHTally(body);
      };
    });

    document.getElementById('btnUndoTally').onclick = function () {
      d.hh.draft = C.draftUndo(d.hh.draft);
      saveCurrentData();
      toast(t('tally_undone'));
      renderHHTally(body);
    };
    document.getElementById('btnFinishTally').onclick = function () {
      var entry = C.entryFromDraft(d.hh.draft, C.newId(d, 'h'));
      var errs = C.validateHHEntry(entry, d.settings);
      if (errs.length) {
        document.getElementById('tallyMsg').textContent = t('err_' + errs[0].code);
        return;
      }
      d.hh.entries.push(entry);
      d.hh.draft = null;
      state.selectedMoments = [];
      state.practiceProgress.sessionFinished = true;
      saveCurrentData();
      var res = fmtOppResult(entry.rub + entry.wash, C.hhOpp(entry));
      toast(t('tally_added', { result: res }));
      state.hhSub = 'results';
      renderHH();
    };
    document.getElementById('btnDiscardTally').onclick = function () {
      confirmModal(t('tally_discard_confirm'), function () {
        d.hh.draft = null;
        state.selectedMoments = [];
        saveCurrentData();
        toast(t('tally_discarded'));
        renderHHTally(body);
      });
    };
  }

  function renderHHPaper(body) {
    var d = state.data;
    var curMonth = C.periodOf(today());
    var areaOpts = d.settings.areaCodes.map(function (c) {
      return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
    }).join('');
    var mRows = [1, 2, 3, 4, 5].map(function (m) {
      return '<tr>' +
        '<td>M' + m + ' · ' + esc(t('moment_' + m)) + '</td>' +

    }).join('');

    body.innerHTML =
      '<div class="card">' +
        '<h2>' + esc(t('paper_title')) + '</h2>' +

          '<div><label for="paperPeriod">' + esc(t('month')) + '</label>' +
            '<input type="month" id="paperPeriod" placeholder="YYYY-MM" value="' + esc(curMonth) + '"></div>' +
          '<div><label for="paperArea">' + esc(t('area')) + '</label>' +
            '<select id="paperArea">' + areaOpts + '</select></div>' +

        '<div class="grid2">' +
          '<div><label for="paperRub">' + esc(t('paper_rub')) + '</label>' +
            '<input type="number" min="0" max="100000" step="1" id="paperRub" value="0"></div>' +
          '<div><label for="paperWash">' + esc(t('paper_wash')) + '</label>' +
            '<input type="number" min="0" max="100000" step="1" id="paperWash" value="0"></div>' +
          '<div><label for="paperMissed">' + esc(t('paper_missed')) + '</label>' +
            '<input type="number" min="0" max="100000" step="1" id="paperMissed" value="0"></div>' +
        '</div>' +
        '<p class="result" id="paperOppCalc">' + esc(t('paper_opp', { n: 0 })) + '</p>' +
        '<label class="inline"><input type="checkbox" id="paperToggleMoments"' + (state.paperShowMoments ? ' checked' : '') + '> ' +
          esc(t('paper_moments')) + '</label>' +
        '<div id="paperMomentsBox" style="display:' + (state.paperShowMoments ? 'block' : 'none') + ';margin-top:.5rem">' +
          '<div class="table-wrap"><table><thead><tr><th>' + esc(t('moment_word')) + '</th><th>' + esc(t('paper_ind')) + '</th><th>' + esc(t('paper_act')) + '</th></tr></thead>' +
          '<tbody>' + mRows + '</tbody></table></div>' +
        '</div>' +
        '<div id="paperErr" class="field-error" style="margin-top:.5rem"></div>' +
        '<button type="button" class="primary wide" id="btnSavePaper" style="margin-top:.7rem">' + esc(t('btn_save')) + '</button>' +
      '</div>';

    function updateOppPreview() {
      var r = +document.getElementById('paperRub').value || 0;
      var w = +document.getElementById('paperWash').value || 0;
      var m = +document.getElementById('paperMissed').value || 0;
      document.getElementById('paperOppCalc').textContent = t('paper_opp', { n: r + w + m });
    }
    ['paperRub', 'paperWash', 'paperMissed'].forEach(function (id) {
      document.getElementById(id).oninput = updateOppPreview;
    });
    document.getElementById('paperToggleMoments').onchange = function (e) {
      state.paperShowMoments = e.target.checked;
      document.getElementById('paperMomentsBox').style.display = state.paperShowMoments ? 'block' : 'none';
    };
    document.getElementById('btnSavePaper').onclick = function () {
      var per = document.getElementById('paperPeriod').value.trim();
      var ar = document.getElementById('paperArea').value;
      var rub = Number(document.getElementById('paperRub').value);
      var wash = Number(document.getElementById('paperWash').value);
      var missed = Number(document.getElementById('paperMissed').value);
      var ind = null, act = null;
      if (state.paperShowMoments) {
        ind = []; act = [];
        for (var i = 1; i <= 5; i++) {
          ind.push(Number(document.getElementById('paperInd' + i).value));
          act.push(Number(document.getElementById('paperAct' + i).value));
        }
      }
      var temp = { period: per, area: ar, source: 'paper', rub: rub, wash: wash, missed: missed, ind: ind, act: act };

      state.hhSub = 'results';
      renderHH();

            esc(t('btn_delete')) + '</button></li>';

          '<div><label for="fltTo">' + esc(t('to_month')) + '</label>' +
            '<input type="month" id="fltTo" placeholder="YYYY-MM" value="' + esc(state.filterTo) + '"></div>' +
          '<div><label for="fltArea">' + esc(t('area')) + '</label>' +

  function renderHHPractice(body) {
    var checkedCount = 0, scoreCount = 0;
    PRACTICE_QUESTIONS.forEach(function (q) {
      var ans = state.pqAnswers[q.id];
      if (ans && ans.checked) {
        checkedCount += 1;
        if (ans.ok) scoreCount += 1;
      }
    });
    var scoreHtml = checkedCount > 0
      ? '<p class="msg ' + (checkedCount === PRACTICE_QUESTIONS.length ? 'ok' : 'info') + '" id="pqScoreBar"><strong>' +
          esc(t('pq_score', { s: scoreCount, n: PRACTICE_QUESTIONS.length })) + '</strong>' +
          (checkedCount === PRACTICE_QUESTIONS.length ? ' · ' + esc(t('pq_done')) : '') + '</p>'
      : '';
    var html = '<div class="card"><h2>' + esc(t('pq_title')) + '</h2><p>' + esc(t('pq_intro')) + '</p>' + scoreHtml + '</div>';
    PRACTICE_QUESTIONS.forEach(function (q, idx) {
      var ans = state.pqAnswers[q.id] || { moments: [], outcome: '', choice: '', checked: false, ok: false };
      html += '<div class="card" id="pqCard' + q.id + '">' +
        '<h3>' + esc(t('pq_of', { i: idx + 1, n: PRACTICE_QUESTIONS.length })) + '</h3>' +
        '<p>' + esc(t(q.textKey)) + '</p>';
      if (q.type === 'tally') {
        html += '<p><strong>' + esc(t('pq_moments')) + '</strong></p><div class="moments">';
        [1, 2, 3, 4, 5].forEach(function (m) {
          var chk = ans.moments.indexOf(m) >= 0 ? ' checked' : '';
          html += '<label class="quiz-opt"><input type="checkbox" class="pq-m" data-qid="' + q.id + '" value="' + m + '"' + chk + '> ' +
            '<span>M' + m + ' · ' + esc(t('moment_' + m)) + '</span></label>';
        });
        html += '</div><p><strong>' + esc(t('pq_outcome')) + '</strong></p><div class="grid2">';
        [['rub', t('out_rub')], ['wash', t('out_wash')], ['missed', t('out_missed')]].forEach(function (pair) {
          var chk = ans.outcome === pair[0] ? ' checked' : '';
          html += '<label class="quiz-opt"><input type="radio" name="pqOut' + q.id + '" class="pq-out" data-qid="' + q.id + '" value="' + pair[0] + '"' + chk + '> ' +
            '<span>' + esc(pair[1]) + '</span></label>';
        });
        html += '</div>';
      } else {
        html += '<div>';
        q.opts.forEach(function (opt) {
          var chk = ans.choice === opt ? ' checked' : '';
          html += '<label class="quiz-opt"><input type="radio" name="pqMc' + q.id + '" class="pq-mc" data-qid="' + q.id + '" value="' + opt + '"' + chk + '> ' +
            '<span>' + esc(t(q.textKey + '_' + opt)) + '</span></label>';
        });
        html += '</div>';
      }
      html += '<button type="button" class="primary btn-pq-check" data-qid="' + q.id + '" style="margin-top:.5rem">' + esc(t('pq_check')) + '</button>' +
        '<div id="pqErr' + q.id + '" class="field-error" style="margin-top:.35rem"></div>';
      if (ans.checked) {
        html += '<div class="msg ' + (ans.ok ? 'ok' : 'warn') + '" style="margin-top:.5rem">' +
          '<strong>' + esc(ans.ok ? t('pq_correct') : t('pq_wrong')) + '</strong> ' + esc(t(q.explKey)) + '</div>';
      }
      html += '</div>';
    });
    body.innerHTML = html;

    function ensureAns(qid) {
      if (!state.pqAnswers[qid]) state.pqAnswers[qid] = { moments: [], outcome: '', choice: '', checked: false, ok: false };
      return state.pqAnswers[qid];
    }
    Array.prototype.forEach.call(body.querySelectorAll('.pq-m'), function (cb) {
      cb.onchange = function () {
        var qid = +cb.getAttribute('data-qid');
        var m = +cb.value;
        var a = ensureAns(qid);
        var idx = a.moments.indexOf(m);
        if (cb.checked && idx < 0) a.moments.push(m);
        if (!cb.checked && idx >= 0) a.moments.splice(idx, 1);
        a.moments.sort();
      };
    });
    Array.prototype.forEach.call(body.querySelectorAll('.pq-out'), function (rb) {
      rb.onchange = function () { ensureAns(+rb.getAttribute('data-qid')).outcome = rb.value; };
    });
    Array.prototype.forEach.call(body.querySelectorAll('.pq-mc'), function (rb) {
      rb.onchange = function () { ensureAns(+rb.getAttribute('data-qid')).choice = rb.value; };
    });
    Array.prototype.forEach.call(body.querySelectorAll('.btn-pq-check'), function (btn) {
      btn.onclick = function () {
        var qid = +btn.getAttribute('data-qid');
        var q = PRACTICE_QUESTIONS.filter(function (x) { return x.id === qid; })[0];
        var a = ensureAns(qid);
        var incomplete = q.type === 'tally' ? (!a.moments.length || !a.outcome) : !a.choice;
        if (incomplete) {
          var er = document.getElementById('pqErr' + qid);
          if (er) er.textContent = t('pq_need');
          toast(t('pq_need'));
          return;
        }
        a.checked = true;
        if (q.type === 'tally') {
          a.ok = a.outcome === q.outcome && a.moments.join(',') === q.moments.join(',');
        } else {
          a.ok = a.choice === q.answer;
        }
        var allChecked = PRACTICE_QUESTIONS.every(function (x) { return state.pqAnswers[x.id] && state.pqAnswers[x.id].checked; });
        if (allChecked) {
          state.practiceProgress.quizDone = true;
          saveCurrentData();
        }
        renderHHPractice(body);
      };
    });
  }

  function renderStock() {

  function renderStockStatus(body) {
    var d = state.data;

    var nOut = statuses.filter(function (s) { return s.stockout; }).length;
    var nLow = statuses.filter(function (s) { return s.low; }).length;

    var nExpired = statuses.filter(function (s) { return s.hasExpired; }).length;

      '<span class="chip ' + (nOut ? 'red' : 'grey') + '" id="chipStockout">' + esc(t('st_chip_out', { n: nOut })) + '</span>' +
      '<span class="chip ' + (nLow ? 'amber' : 'grey') + '" id="chipLow">' + esc(t('st_chip_low', { n: nLow })) + '</span>' +
      '<span class="chip ' + (nExp ? 'amber' : 'grey') + '" id="chipExpiring">' + esc(t('st_chip_exp', { n: nExp })) + '</span>' +
      '<span class="chip ' + (nExpired ? 'red' : 'grey') + '" id="chipExpired">' + esc(t('st_chip_expired', { n: nExpired })) + '</span>' +
    '</div>';

    statuses.forEach(function (s) {
      var it = s.item;
      var cls = s.stockout ? 'st-out' : (s.low || s.expiringSoon) ? 'st-low' : '';
      var chipCls = s.stockout ? 'red' : (s.low || s.expiringSoon) ? 'amber' : 'green';
      var stLabel = t('st_status_' + s.code);
      var firstLine = '';
      if (s.earliest && it.tracksExpiry) {
        var dLeft = C.daysBetween(td, s.earliest.expiry);
        var dStr = dLeft === 0 ? t('st_expires_today') : t('st_days_left', { n: dLeft });
        firstLine = '<p class="muted">' + esc(t('st_use_first', {
          batch: s.earliest.batch || t('st_no_batch'),
          date: s.earliest.expiry,
          days: dStr,
          q: s.earliest.qty,
          u: it.unit
        })) + '</p>';
      }
      var expWarn = s.hasExpired
        ? '<p class="msg bad">' + esc(t('st_has_expired', { q: s.expired, u: it.unit })) + '</p>'
        : '';

      var expanded = state.expandedItemId === it.id;
      var detailsHtml = '';
      if (expanded) {
        var bRows = s.usableBatches.map(function (b) {
          return '<li><strong>' + esc(b.batch || t('st_no_batch')) + '</strong> · ' +
            esc(b.expiry || t('st_no_expiry')) + ' — ' + b.qty + ' ' + esc(it.unit) + '</li>';
        }).concat(s.expiredBatches.map(function (b) {
          return '<li style="color:var(--red)"><strong>' + esc(b.batch || t('st_no_batch')) + '</strong> · ' +
            esc(b.expiry) + ' — ' + b.qty + ' ' + esc(it.unit) + ' (' + esc(t('st_expired_label')) + ')</li>';
        })).join('');
        var txList = C.itemTxns(d.stock.txns, it.id).slice().reverse();
        var txRows = txList.slice(0, 10).map(function (tx) {
          return '<li>' + esc(tx.date) + ' · <strong>' + esc(t('st_type_' + tx.type)) + '</strong> · ' +
            tx.qty + ' ' + esc(it.unit) +
            (tx.batch ? ' · ' + esc(tx.batch) : '') +
            (tx.expiry ? ' (' + esc(tx.expiry) + ')' : '') +
            (tx.reason ? ' [' + esc(t('reason_' + tx.reason)) + ']' : '') +
            (tx.area ? ' → ' + esc(tx.area) : '') + '</li>';
        }).join('');
        detailsHtml = '<div style="margin-top:.6rem;border-top:1px solid var(--line);padding-top:.5rem">' +
          '<h3>' + esc(t('st_batches')) + '</h3>' +
          (bRows ? '<ul class="plain">' + bRows + '</ul>' : '<p class="muted">' + esc(t('st_none')) + '</p>') +
          '<h3>' + esc(t('st_history')) + '</h3>' +
          (txRows ? '<ul class="plain">' + txRows + '</ul>' : '<p class="muted">' + esc(t('st_none')) + '</p>') +
          (txList.length ? '<button type="button" class="danger btn-undo-txn" data-itemid="' + esc(it.id) + '" style="margin-top:.5rem">' +
            esc(t('st_undo_last')) + '</button>' : '') +
        '</div>';
      }

      html += '<div class="card item-card ' + cls + '" data-itemcard="' + esc(it.id) + '">' +
        '<div class="row" style="justify-content:space-between">' +
          '<div><h2 style="margin:.1rem 0">' + esc(it.name) + '</h2>' +
            '<p class="result">' + esc(t('st_usable', { q: s.usable, u: it.unit })) + '</p>' +
            '<p class="muted">' + esc(t('st_reorder_point', { n: it.reorderPoint })) +
              (it.tracksExpiry ? ' · ' + esc(t('st_window', { n: s.windowDays })) : '') + '</p>' +
          '</div>' +
          '<div class="row">' +

          '</div>' +
        '</div>' +
        firstLine + expWarn + detailsHtml +
      '</div>';
    });

    body.innerHTML = html;
    Array.prototype.forEach.call(body.querySelectorAll('.btn-item-details'), function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute('data-itemid');
        state.expandedItemId = state.expandedItemId === id ? '' : id;
        renderStockStatus(body);
      };
    });
    Array.prototype.forEach.call(body.querySelectorAll('.btn-undo-txn'), function (btn) {
      btn.onclick = function () {
        var itemId = btn.getAttribute('data-itemid');
        var list = C.itemTxns(d.stock.txns, itemId);
        if (!list.length) return;
        var lastTx = list[list.length - 1];
        confirmModal(t('st_undo_confirm'), function () {
          var remaining = d.stock.txns.filter(function (x) { return x.id !== lastTx.id; });
          if (C.itemBatches(remaining, itemId).negative) {
            toast(t('err_txn_insufficient'));
            return;
          }
          d.stock.txns = remaining;
          saveCurrentData();
          toast(t('deleted'));
          renderStockStatus(body);
        });
      };
    });
  }

          box.textContent = t('st_issue_short', { n: plan.available });
        } else {
          box.className = 'msg info';
          var pStr = plan.allocations.map(function (a) {
            return (a.batch || t('st_no_batch')) + (a.expiry ? ' (' + a.expiry + ')' : '') + ': ' + a.qty;

      };
      document.getElementById('txnQty').oninput = updateIssuePreview;
      document.getElementById('txnDate').onchange = updateIssuePreview;
      document.getElementById('txnDate').oninput = updateIssuePreview;
      updateIssuePreview();
    }

    if (state.txnType === 'adjust') {
      var reasonEl = document.getElementById('txnReason');
      var dirEl = document.getElementById('txnDirection');
      var syncAdjustDir = function () {
        if (!reasonEl || !dirEl) return;
        var sign = C.ADJUST_REASONS[reasonEl.value];
        if (sign < 0) { dirEl.value = 'remove'; dirEl.disabled = true; }
        else if (sign > 0) { dirEl.value = 'add'; dirEl.disabled = true; }
        else { dirEl.disabled = false; }
      };
      if (reasonEl) reasonEl.onchange = syncAdjustDir;
      syncAdjustDir();
    }

    var pickEl = document.getElementById('txnBatchPick');
    if (pickEl) {
      var posForPick = status.batches.filter(function (b) { return b.qty > 0; });
      pickEl.onchange = function () {
        var nb = document.getElementById('countNewBatchBox') || document.getElementById('adjNewBatchBox');
        if (nb) nb.style.display = pickEl.value === 'new' ? 'grid' : 'none';
        if (state.txnType === 'count' && pickEl.value !== 'new' && posForPick[+pickEl.value]) {
          var qEl = document.getElementById('txnQty');
          if (qEl) qEl.value = posForPick[+pickEl.value].qty;
        }
      };
    }

    document.getElementById('btnSaveTxn').onclick = function () {
      var dt = document.getElementById('txnDate').value.trim();
      var rawQtyStr = document.getElementById('txnQty').value.trim();
      var errEl = document.getElementById('txnErr');
      errEl.textContent = '';
      if (rawQtyStr === '') { errEl.textContent = t('err_txn_qty'); return; }
      var qRaw = Number(rawQtyStr);

      if (state.txnType === 'issue') {
        if (!C.isValidDate(dt)) { errEl.textContent = t('err_txn_date'); return; }
        if (dt > td) { errEl.textContent = t('err_txn_future'); return; }
        if (!C.isNonNegInt(qRaw, 1000000) || qRaw <= 0) { errEl.textContent = t('err_txn_qty'); return; }
        var ar = document.getElementById('txnArea').value;
        var plan = C.planIssue(C.itemBatches(d.stock.txns, item.id, dt), qRaw, dt);
        if (!plan.ok) {
          errEl.textContent = t('err_txn_insufficient');
          return;
        }
        var created = [];
        for (var i = 0; i < plan.allocations.length; i++) {
          var al = plan.allocations[i];
          var tx = {
            id: C.newId(d, 't'), itemId: item.id, date: dt, type: 'issue',
            qty: al.qty, batch: al.batch, expiry: al.expiry, reason: '', area: ar
          };
          var vErrs = C.validateTxn(tx, { settings: d.settings, stock: { items: d.stock.items, txns: d.stock.txns.concat(created) } }, td);
          if (vErrs.length) { errEl.textContent = t('err_' + vErrs[0].code); return; }
          created.push(tx);
        }
        d.stock.txns = d.stock.txns.concat(created);
        state.practiceProgress.stockIssued = true;
        saveCurrentData();
        toast(t('st_saved', { entry: item.name + ' -' + qRaw }));
        state.stockSub = 'status';
        renderStock();
        return;
      }

      var batch = '', expiry = '', reason = '';
      if (item.tracksExpiry) {
        var pick = document.getElementById('txnBatchPick');
        var posList = status.batches.filter(function (b) { return b.qty > 0; });
        if (pick && pick.value !== 'new' && posList[+pick.value]) {
          batch = posList[+pick.value].batch;
          expiry = posList[+pick.value].expiry;
        } else {
          batch = (document.getElementById('txnBatch') ? document.getElementById('txnBatch').value.trim() : '');
          expiry = (document.getElementById('txnExpiry') ? document.getElementById('txnExpiry').value.trim() : '');
        }
      }
      var qty = qRaw;
      if (state.txnType === 'adjust') {
        reason = document.getElementById('txnReason').value;
        var sign = C.ADJUST_REASONS[reason];
        var adjDirEl = document.getElementById('txnDirection');
        if (sign < 0 && qty > 0) qty = -qty;
        else if (sign > 0 && qty < 0) qty = Math.abs(qty);
        else if (sign === 0 && qty > 0 && adjDirEl && adjDirEl.value === 'remove') qty = -qty;
      }
      var singleTx = {
        id: C.newId(d, 't'), itemId: item.id, date: dt, type: state.txnType,
        qty: qty, batch: batch, expiry: expiry, reason: reason, area: ''
      };
      var errs = C.validateTxn(singleTx, d, td);
      if (errs.length) {
        errEl.textContent = t('err_' + errs[0].code);
        return;
      }
      d.stock.txns.push(singleTx);
      saveCurrentData();
      toast(t('st_saved', { entry: item.name + ' (' + t('st_type_' + state.txnType) + ')' }));
      state.stockSub = 'status';
      renderStock();
    };
  }

  /* ---------- Backup and restore screen ---------- */
  function humanBackupError(code) {
    var map = {
      empty: 'bk_err_empty', too_large: 'bk_err_too_large', not_json: 'bk_err_not_json',
      not_backup: 'bk_err_not_backup', newer_version: 'bk_err_newer_version',
      checksum: 'bk_err_checksum', bad_mode: 'bk_err_bad_mode', bad_date: 'bk_err_bad_date', no_data: 'bk_err_no_data'
    };
    return map[code] ? t(map[code]) : code;
  }

  function renderBackup() {
    var d = state.data;
    var hasSafety = false;
    try { hasSafety = !!window.localStorage.getItem(KEY_SAFETY + state.mode); } catch (e) { /* ignore */ }

    var pendingHtml = '';
    if (state.pendingRestore) {
      var r = state.pendingRestore;
      if (!r.ok) {
        pendingHtml = '<div class="msg bad" id="restoreErrorBox">' +
          '<strong>' + esc(t('bk_invalid')) + '</strong>' +
          '<ul>' + r.errors.map(function (e) { return '<li>' + esc(humanBackupError(e)) + '</li>'; }).join('') + '</ul>' +
        '</div>';
      } else {
        var sm = r.summary;
        pendingHtml = '<div class="msg ok" id="restoreValidBox">' +
          '<p><strong>' + esc(t('bk_valid')) + '</strong></p>' +
          '<p>' + esc(t('bk_summary', {
            created: sm.createdAt.slice(0, 16).replace('T', ' '),
            mode: t('mode_word_' + sm.mode),
            entries: sm.entries, opp: sm.opp, items: sm.items, txns: sm.txns
          })) + '</p>' +
          (sm.mode !== state.mode ? '<p class="msg warn">' + esc(t('bk_mode_mismatch', {
            bmode: t('mode_word_' + sm.mode)
          })) + '</p>' :
            '<button type="button" class="danger solid wide" id="btnConfirmRestore">' + esc(t('bk_replace')) + '</button>') +
        '</div>';
      }
    }

    var v = document.getElementById('view');
    v.innerHTML =
      '<h1>' + esc(t('bk_title')) + '</h1>' +
      '<div class="card">' +
        '<p><strong>' + esc(t('bk_last', { when: fmtBackupWhen(d.meta.lastBackupAt) })) + '</strong></p>' +
        '<p class="muted">' + esc(t('bk_where')) + '</p>' +
        '<div class="row">' +
          '<button type="button" class="primary" id="btnDownloadBackup">' + esc(t('bk_download')) + '</button>' +
          '<button type="button" id="btnShowBackupText">' + esc(t('bk_show_text')) + '</button>' +
        '</div>' +
        (state.showBackupText
          ? '<div style="margin-top:.6rem"><p class="muted">' + esc(t('bk_text_help')) + '</p>' +
              '<div style="margin:.4rem 0"><button type="button" id="btnBackupCopy">' + esc(t('btn_copy')) + '</button></div>' +
              '<textarea id="backupTextOut" readonly dir="ltr" autocomplete="off" spellcheck="false">' + esc(state.lastBackupJson) + '</textarea></div>'
          : '') +
      '</div>' +
      '<div class="card">' +
        '<h2>' + esc(t('bk_restore_title')) + '</h2>' +
        '<label for="backupFileInput">' + esc(t('bk_choose_file')) + '</label>' +
        '<input type="file" id="backupFileInput" accept=".json,application/json">' +
        '<label for="backupTextIn">' + esc(t('bk_paste')) + '</label>' +
        '<textarea id="backupTextIn" dir="ltr" autocomplete="off" spellcheck="false" placeholder="{ &quot;format&quot;: &quot;ipc-starter-kit-backup&quot;, ... }"></textarea>' +
        '<div class="row" style="margin-top:.5rem">' +
          '<button type="button" class="primary" id="btnCheckBackup">' + esc(t('bk_check')) + '</button>' +
          (hasSafety ? '<button type="button" id="btnUndoRestore">' + esc(t('bk_undo')) + '</button>' : '') +
        '</div>' +
        pendingHtml +
      '</div>';

    if (document.getElementById('btnBackupCopy')) {
      document.getElementById('btnBackupCopy').onclick = function () { copyTextValue(state.lastBackupJson, 'backupTextOut'); };
    }
    document.getElementById('btnDownloadBackup').onclick = function () {
      var now = new Date();
      d.meta.lastBackupAt = now.toISOString();
      state.practiceProgress.backupDone = true;
      saveCurrentData();
      var bk = C.makeBackup(d, state.mode, now.toISOString());
      var json = JSON.stringify(bk, null, 2) + '\n';
      var fn = C.backupFileName(now, state.mode);
      state.lastBackupJson = json;
      state.lastBackupFilename = fn;
      var dlOk = triggerDownload(fn, json, 'application/json;charset=utf-8');
      if (!dlOk) state.showBackupText = true;
      toast(dlOk ? t('bk_done', { f: fn }) : t('bk_text_help'));
      renderBackup();
    };
    document.getElementById('btnShowBackupText').onclick = function () {
      var now = new Date();
      d.meta.lastBackupAt = now.toISOString();
      state.practiceProgress.backupDone = true;
      saveCurrentData();
      var bk = C.makeBackup(d, state.mode, now.toISOString());
      state.lastBackupJson = JSON.stringify(bk, null, 2) + '\n';
      state.showBackupText = !state.showBackupText;
      renderBackup();
    };
    document.getElementById('backupFileInput').onchange = function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        var txt = String(reader.result || '');
        state.pendingRestore = C.parseBackup(txt);
        renderBackup();
      };
      reader.readAsText(f);
    };
    document.getElementById('btnCheckBackup').onclick = function () {
      var txt = document.getElementById('backupTextIn').value;
      state.pendingRestore = C.parseBackup(txt);
      renderBackup();
    };
    if (document.getElementById('btnConfirmRestore')) {
      document.getElementById('btnConfirmRestore').onclick = function () {

  /* ---------- Built-in Printable Field Kit & Guides Viewer ---------- */
  var ALL_SHEETS_ID = 'field-kit/ALL-PRINTABLE-SHEETS.html';

  function kitPayload() {
    return window.IPC_EMBEDDED_KIT || { order: [], docs: {}, csvs: {} };
  }

  function resolveKitDocId(href, baseDocId) {
    if (!href) return 'field-kit/index.html';
    var clean = String(href).split('#')[0].split('?')[0].trim();
    if (!clean) return baseDocId || 'field-kit/index.html';
    if (/^[a-z]+:/i.test(clean)) return null;
    var kit = kitPayload();
    if (clean === ALL_SHEETS_ID || kit.docs[clean] || (kit.csvs && kit.csvs[clean])) return clean;

    var baseDirParts = (baseDocId || 'field-kit/index.html').split('/');
    baseDirParts.pop();
    var parts = baseDirParts.concat(clean.split('/'));
    var norm = [];
    for (var i = 0; i < parts.length; i++) {
      var seg = parts[i];
      if (!seg || seg === '.') continue;
      if (seg === '..') { if (norm.length) norm.pop(); }
      else norm.push(seg);
    }
    var joined = norm.join('/');
    if (joined === 'ipc-kit.html') return '__APP__';
    if (joined === ALL_SHEETS_ID || kit.docs[joined] || (kit.csvs && kit.csvs[joined])) return joined;
    return null;
  }

  function openKitDoc(docId, fromTab) {
    if (fromTab) state.kitReturnTab = fromTab;
    else if (!state.kitReturnTab) state.kitReturnTab = state.mode ? state.tab : 'welcome';
    state.kitFallbackText = '';
    state.kitFallbackName = '';
    state.kitCleanView = false;
    state.printWebViewWarn = false;
    var resolved = resolveKitDocId(docId, state.kitDoc || 'field-kit/index.html');
    if (!resolved || resolved === '__APP__') {
      state.kitDoc = null;
      render();
      return;
    }
    state.kitDoc = resolved;
    render();
    try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
  }

  function getKitDocView(docId) {
    var kit = kitPayload();
    if (docId === ALL_SHEETS_ID) {
      var cssParts = ['@page { size: auto; margin: 12mm; }'];
      var bodyParts = [];
      var sheetCount = 0;
      (kit.order || []).forEach(function (id) {
        var d = kit.docs[id];
        if (!d || !d.inAllSheets) return;
        cssParts.push(String(d.scopedCss || '').replace(/@page\s*\{[^}]*\}/g, ''));
        var cls = (sheetCount > 0 ? 'fk-pack-sep ' : '') + 'fk-doc ' + d.scopeClass;
        bodyParts.push('<section id="sheet-' + esc(d.slug) + '" class="' + cls + '">' + d.bodyHtml + '</section>');
        sheetCount += 1;
      });
      if (!sheetCount) return null;
      return {
        id: ALL_SHEETS_ID,
        title: 'All 8 Printable Sheets Combined – IPC Starter Kit v1.0.0',
        downloadName: 'ALL-PRINTABLE-SHEETS.html',
        css: cssParts.join('\n'),
        html: bodyParts.join('\n')
      };
    }
    var doc = kit.docs && kit.docs[docId];
    if (!doc) return null;
    var fname = (doc.id.split('/').pop() || 'sheet.html').replace(/\.md$/i, '.html');
    return {
      id: doc.id,
      title: doc.title,
      downloadName: fname,
      css: doc.scopedCss || '',
      html: '<div class="fk-doc ' + doc.scopeClass + '">' + doc.bodyHtml + '</div>'
    };
  }

  function buildStandaloneDocHtml(view) {
    var safeCss = String(view.css || '').replace(/<\/style/gi, '<\\/style');
    return '<!DOCTYPE html>\n<html lang="en">\n<head>\n' +
      '<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:">\n' +
      '<title>' + esc(view.title) + '</title>\n' +
      '<style>\n' + safeCss + '\n.nav-bar { display: none !important; }\n</style>\n' +
      '</head>\n<body>\n' + view.html + '\n</body>\n</html>\n';
  }

  function clearKitPrintState() {
    var styleEl = document.getElementById('kitDocStyle');
    if (styleEl) styleEl.textContent = '';
    var pa = document.getElementById('printArea');
    if (pa && state.tab !== 'reports') {
      pa.className = '';
      pa.innerHTML = '';

    syncCleanPrintMode();

    var kit = kitPayload();
    var view = getKitDocView(state.kitDoc) || getKitDocView('field-kit/index.html');

          '<h1 style="margin:0;font-size:1.15rem">' + esc(t('kit_title')) + '</h1>' +
        '</div>' +
        '<p class="muted" style="margin:.45rem 0">' + esc(t('kit_embedded_note')) + '</p>' +
        (isAndroidWebView() ? '<p class="msg warn" id="kitWvBanner">' + esc(t('wv_banner')) + '</p>' : '') +
        '<label for="kitDocSelect">' + esc(t('kit_choose')) + '</label>' +

        (state.printWebViewWarn ? '<p class="msg warn" id="kitPrintWarn">' + esc(t('wv_print_warn')) + '</p>' : '') +

              '<textarea id="kitFallbackOut" readonly dir="ltr" autocomplete="off" spellcheck="false">' + esc(state.kitFallbackText) + '</textarea></div>'
          : '') +
      '</div>' +
      '<div class="kit-preview-wrap"><div id="kitDocRender"></div></div>';

    var styleEl = document.getElementById('kitDocStyle');
    if (styleEl) styleEl.textContent = view.css;

    renderHost.innerHTML = view.html;

    if (printArea) {
      printArea.className = 'fk-print-mode';
      printArea.innerHTML = view.html;
    }

    document.getElementById('btnKitBack').onclick = function () {
      state.kitDoc = null;
      state.kitFallbackText = '';
      state.kitCleanView = false;
      state.printWebViewWarn = false;
      clearKitPrintState();
      render();
    };
    document.getElementById('kitDocSelect').onchange = function (e) {
      openKitDoc(e.target.value, state.kitReturnTab);
    };
    document.getElementById('btnKitPrint').onclick = function () {
      triggerPrint('kit');
    };
    document.getElementById('btnKitCleanView').onclick = function () {
      state.kitCleanView = true;
      state.printWebViewWarn = false;
      renderKitViewer();
    };
    if (document.getElementById('btnExitCleanView')) {
      document.getElementById('btnExitCleanView').onclick = function () {
        state.kitCleanView = false;
        renderKitViewer();
      };
    }
    document.getElementById('btnKitShowHtml').onclick = function () {
      state.kitFallbackText = buildStandaloneDocHtml(view);
      renderKitViewer();
    };
    if (document.getElementById('btnKitCopy')) {
      document.getElementById('btnKitCopy').onclick = function () { copyTextValue(state.kitFallbackText, 'kitFallbackOut'); };
    }
    document.getElementById('btnKitDownload').onclick = function () {
      var standalone = buildStandaloneDocHtml(view);
      if (triggerDownload(view.downloadName, standalone, 'text/html;charset=utf-8')) {
        state.kitFallbackText = '';
        toast(t('kit_download_ok', { f: view.downloadName }));
      } else {
        state.kitFallbackText = standalone;
        toast(t('rep_download_fail'));
      }
      renderKitViewer();
    };

    renderHost.onclick = function (e) {
      var target = e.target;
      while (target && target !== renderHost && target.tagName !== 'A') {
        target = target.parentNode;
      }
      if (!target || target.tagName !== 'A') return;
      var href = target.getAttribute('href') || '';
      if (href.charAt(0) === '#') {
        e.preventDefault();
        var fragEl = document.getElementById(href.slice(1));
        if (fragEl && typeof fragEl.scrollIntoView === 'function') fragEl.scrollIntoView();
        return;
      }
      e.preventDefault();
      var res = resolveKitDocId(href, view.id);
      if (res === '__APP__') {
        state.kitDoc = null;
        state.kitFallbackText = '';
        state.kitCleanView = false;
        state.printWebViewWarn = false;
        clearKitPrintState();
        render();
        return;
      }
      if (res && kit.csvs && kit.csvs[res]) {
        var csvName = res.split('/').pop() || 'evidence-register.csv';
        if (triggerDownload(csvName, kit.csvs[res], 'text/csv;charset=utf-8')) {
          state.kitFallbackText = '';
          toast(t('rep_downloaded', { f: csvName }));
        } else {
          state.kitFallbackText = kit.csvs[res];
          toast(t('rep_download_fail'));
          renderKitViewer();
        }
        return;
      }
      if (res) {
        openKitDoc(res, state.kitReturnTab);
      } else {
        toast(t('kit_not_found'));
      }
    };
  }

  /* ---------- top-level render & startup ---------- */
  function render() {
    if (!state.kitDoc) state.kitCleanView = false;
    if (!state.mode || state.kitDoc || state.tab !== 'reports') state.repCleanView = false;
    if (!state.kitDoc && state.tab !== 'reports') state.printWebViewWarn = false;
    syncCleanPrintMode();
    renderHeader();
    var v = document.getElementById('view');
    if (state.kitDoc) {
      renderKitViewer();
      if (!state.storageOk) {
        var kwarn = document.createElement('div');
        kwarn.className = 'msg bad';
        kwarn.textContent = t('memory_only');
        v.insertBefore(kwarn, v.firstChild);
      }
      return;
    }
    clearKitPrintState();
    if (!state.mode) {
      renderWelcome();
      return;
    }
    if (state.tab === 'home') renderHome();
    else if (state.tab === 'hh') renderHH();
    else if (state.tab === 'stock') renderStock();
    else if (state.tab === 'reports') renderReports();
    else if (state.tab === 'backup') renderBackup();
    else renderSettings();

    if (!state.storageOk) {
      var warn = document.createElement('div');
      warn.className = 'msg bad';
      warn.textContent = t('memory_only');
      v.insertBefore(warn, v.firstChild);
    } else if (state.corruptNotice) {
      var cwarn = document.createElement('div');
      cwarn.className = 'msg bad';
      cwarn.textContent = t('corrupt_kept');
      v.insertBefore(cwarn, v.firstChild);
    }
  }

  function init() {
    state.storageOk = probeStorage();
    loadPracticeProgress();
    var savedMode = null;
    if (state.storageOk) {
      try { savedMode = window.localStorage.getItem(KEY_MODE); } catch (e) { state.storageOk = false; }
    }
    if (savedMode === 'practice' || savedMode === 'real') {
      state.mode = savedMode;
      state.data = loadStoredData(savedMode);
      if (state.data && state.data.settings && state.data.settings.language) {
        state.lang = state.data.settings.language;
      }
      updateSaveIndicator(false);
    } else {
      updateSaveIndicator(false);
    }
    window.addEventListener('storage', function (e) {
      if (e.key === saveKey(state.mode) && state.mode) {
        state.data = loadStoredData(state.mode);
        toast(t('other_window'));
        render();
      }
    });
    render();
  }

  // Expose minimal test handle for offline browser verification.
  window.__IPCApp = { state: state, render: render, setMode: setMode };
  init();
})();
</script>
</body>
</html>
