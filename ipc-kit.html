dth: 100%;\n      border-collapse: collapse;\n      margin-bottom: 4px; }\n.fk-sheet-readiness-checklist th, .fk-sheet-readiness-checklist td { border: 1px solid #000;\n      padding: 2.5px 4px;\n      vertical-align: middle;\n      font-size: 10.5px; }\n.fk-sheet-readiness-checklist th { background: #eee;\n      text-align: center; }\n.fk-sheet-readiness-checklist tr.sec-hdr td { background: #ddd;\n      font-weight: bold;\n      font-size: 11px;\n      padding: 2px 5px; }\n.fk-sheet-readiness-checklist td.center { text-align: center; white-space: nowrap; }\n.fk-sheet-readiness-checklist .cb { display: inline-block;\n      width: 5.2mm;\n      height: 5.2mm;\n      border: 1.5px solid #000;\n      vertical-align: middle;\n      background: #fff; }\n.fk-sheet-readiness-checklist .ev { font-size: 9.5px; font-weight: normal; color: #222; }\n.fk-sheet-readiness-checklist .fc { font-size: 9.5px;\n      font-weight: bold;\n      border: 1px solid #000;\n      padding: 0 3px;\n      background: #fff; }\n.fk-sheet-readiness-checklist footer { margin-top: 4px;\n      padding-top: 3px;\n      border-top: 1px solid #000;\n      font-size: 10px;\n      text-align: center; }\n.fk-sheet-readiness-checklist footer a { color: #000; }\n@media print {\n  .fk-sheet-readiness-checklist { padding: 0; font-size: 10.8px; }\n  .fk-sheet-readiness-checklist .nav-bar { display: none; }\n  .fk-sheet-readiness-checklist .page { max-width: 100%; }\n}","bodyHtml":"<div class=\"page\">\n    <div class=\"nav-bar\">\n      <a href=\"index.html\">← Field Kit Index<\/a>\n      <a href=\"../ipc-kit.html\">Open App (ipc-kit.html)<\/a>\n      <a href=\"../evidence/evidence-register.html\">Evidence Register<\/a>\n    <\/div>\n\n    <div class=\"top-header\">\n      <h1>IPC Area Readiness Checklist (One Page per Area)<\/h1>\n      <span>Walk the area once a month · Copy priority actions to the Monthly Action Log <span class=\"ev\">[RC-06]<\/span><\/span>\n    <\/div>\n\n    <div class=\"privacy-banner\">\n      Do not write names, ID numbers or clinical details on this sheet. <span class=\"ev\">[PR-02, PR-03]<\/span>\n    <\/div>\n\n    <div class=\"meta-row\">\n      <div class=\"meta-box\">Month (YYYY-MM): __________________<span>Example: 2026-11<\/span><\/div>\n      <div class=\"meta-box\">Area code: __________________<span>Facility code, e.g. OPD, MAT, WARD-A<\/span><\/div>\n      <div class=\"meta-box\">Checked by role: ___________________________<span>Role only (e.g. IPC focal person, Ward in-charge) – no name<\/span><\/div>\n    <\/div>\n\n    <div class=\"roles-box\">\n      <strong>Responsible role choices (write a ROLE, never a person's name) <span class=\"ev\">[RC-06, IPC-02]<\/span>:<\/strong>\n      <code>IPC focal person<\/code> · <code>Ward in-charge<\/code> · <code>Storekeeper<\/code> · <code>Facility manager<\/code> · <code>Maintenance lead<\/code> · <code>Cleaning supervisor<\/code>.<br>\n      Items marked <span class=\"fc\">Facility choice<\/span> include local buffer quantities or schedules set by your facility.\n    <\/div>\n\n    <table>\n      <thead>\n        <tr>\n          <th style=\"width: 40%;\">Readiness check item<\/th>\n          <th style=\"width: 7%;\">Yes<\/th>\n          <th style=\"width: 7%;\">Partly<\/th>\n          <th style=\"width: 7%;\">No<\/th>\n          <th style=\"width: 27%;\">Action needed &amp; Responsible role<br><span class=\"ev\">(if Partly or No) [RC-06]<\/span><\/th>\n          <th style=\"width: 12%;\">Due date<br><span class=\"ev\">(YYYY-MM-DD)<\/span><\/th>\n        <\/tr>\n      <\/thead>\n      <tbody>\n        <!-- 1. WATER -->\n        <tr class=\"sec-hdr\"><td colspan=\"6\">1. Water <span class=\"ev\">[RC-01]<\/span><\/td><\/tr>\n        <tr>\n          <td>1.1 Safe water is available in this care area today for handwashing and cleaning <span class=\"ev\">[RC-01]<\/span><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td>Role:<\/td><td><\/td>\n        <\/tr>\n        <tr>\n          <td>1.2 Backup water container (covered, clean, with tap) holds at least one day's buffer when pipes fail <span class=\"ev\">[RC-01]<\/span> <span class=\"fc\">Facility choice<\/span><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td>Role:<\/td><td><\/td>\n        <\/tr>\n\n        <!-- 2. SOAP AND HANDWASHING -->\n        <tr class=\"sec-hdr\"><td colspan=\"6\">2. Soap and Handwashing <span class=\"ev\">[RC-02]<\/span><\/td><\/tr>\n        <tr>\n          <td>2.1 Working handwashing station with running water and soap at care points and within 5 m of toilets <span class=\"ev\">[RC-02]<\/span><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td>Role:<\/td><td><\/td>\n        <\/tr>\n        <tr>\n          <td>2.2 Clean single-use towels (or clean dry method approved by facility) available; no shared cloth towels <span class=\"ev\">[RC-02]<\/span> <span class=\"fc\">Facility choice<\/span><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td>Role:<\/td><td><\/td>\n        <\/tr>\n\n        <!-- 3. HAND RUB -->\n        <tr class=\"sec-hdr\"><td colspan=\"6\">3. Alcohol-Based Hand Rub <span class=\"ev\">[RC-02]<\/span><\/td><\/tr>\n        <tr>\n          <td>3.1 Working, non-expired alcohol-based hand rub dispensers or bottles at points of care <span class=\"ev\">[RC-02, ST-10]<\/span><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td>Role:<\/td><td><\/td>\n        <\/tr>\n        <tr>\n          <td>3.2 At least one spare bottle/refill kept in the area cupboard for immediate replacement <span class=\"ev\">[RC-02, ST-09]<\/span> <span class=\"fc\">Facility choice<\/span><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td>Role:<\/td><td><\/td>\n        <\/tr>\n\n        <!-- 4. CLEANING SUPPLIES -->\n        <tr class=\"sec-hdr\"><td colspan=\"6\">4. Cleaning Supplies and Routine <span class=\"ev\">[RC-03]<\/span><\/td><\/tr>\n        <tr>\n          <td>4.1 Detergent, disinfectant (in-date), buckets, mops/cloths, and utility gloves available and stored cleanly <span class=\"ev\">[RC-03, ST-10]<\/span><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td>Role:<\/td><td><\/td>\n        <\/tr>\n        <tr>\n          <td>4.2 Daily cleaning schedule for patient areas, high-touch surfaces, and toilets is posted and followed <span class=\"ev\">[RC-03]<\/span> <span class=\"fc\">Facility choice<\/span><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td>Role:<\/td><td><\/td>\n        <\/tr>\n\n        <!-- 5. WASTE HANDLING (+ SHARPS) -->\n        <tr class=\"sec-hdr\"><td colspan=\"6\">5. Waste Handling and Sharps Safety <span class=\"ev\">[RC-04, RC-05]<\/span><\/td><\/tr>\n        <tr>\n          <td>5.1 Labelled/colour-coded waste bins (e.g. three-bin system: general, infectious, sharps) at point of generation <span class=\"ev\">[RC-04]<\/span> <span class=\"fc\">Facility choice<\/span><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td>Role:<\/td><td><\/td>\n        <\/tr>\n        <tr>\n          <td>5.2 Puncture-resistant sharps boxes are within arm's reach where sharps are used and are below the 3/4 fill line <span class=\"ev\">[RC-05]<\/span><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td>Role:<\/td><td><\/td>\n        <\/tr>\n        <tr>\n          <td>5.3 Waste bags/bins are removed before overflowing and kept in a locked or fenced storage/treatment area <span class=\"ev\">[RC-04]<\/span><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td><td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td>Role:<\/td><td><\/td>\n        <\/tr>\n      <\/tbody>\n    <\/table>\n\n    <div style=\"font-size: 10.5px; border: 1px solid #000; padding: 3px 6px;\">\n      <strong>Next step <span class=\"ev\">[RC-06]<\/span>:<\/strong> Pick up to 3 top actions from <em>Partly<\/em> or <em>No<\/em> items above and copy them into the <strong>Monthly Review Routine &amp; Corrective Action Log<\/strong> (<code>review-routine-and-action-log.html<\/code>) with a responsible role and due date.\n    <\/div>\n\n    <footer>\n      IPC Starter Kit v1.0.0 · Original text © 2026 @mostafase · <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\">CC BY-NC-SA 4.0<\/a> · Sources: see evidence register (<a href=\"../evidence/evidence-register.html\">evidence/evidence-register.html<\/a>)\n    <\/footer>\n  <\/div>"},"field-kit/review-routine-and-action-log.html":{"id":"field-kit/review-routine-and-action-log.html","slug":"review-routine-and-action-log","label":"5. Monthly review & action log","title":"Monthly Review Routine and Corrective Action Log – IPC Starter Kit v1.0.0","kind":"html","inAllSheets":true,"scopeClass":"fk-sheet-review-routine-and-action-log","scopedCss":"@page { size: auto; margin: 12mm; }\n.fk-sheet-review-routine-and-action-log, .fk-sheet-review-routine-and-action-log * { box-sizing: border-box; }\n.fk-sheet-review-routine-and-action-log { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n      color: #000;\n      background: #fff;\n      margin: 0;\n      padding: 8px;\n      font-size: 11.5px;\n      line-height: 1.3; }\n.fk-sheet-review-routine-and-action-log .page { max-width: 190mm;\n      margin: 0 auto; }\n.fk-sheet-review-routine-and-action-log .nav-bar { margin-bottom: 6px;\n      padding-bottom: 4px;\n      border-bottom: 1px solid #444;\n      font-size: 11px; }\n.fk-sheet-review-routine-and-action-log .nav-bar a { color: #000; text-decoration: underline; margin-right: 12px; }\n.fk-sheet-review-routine-and-action-log .top-header { display: flex;\n      justify-content: space-between;\n      align-items: baseline;\n      border-bottom: 2px solid #000;\n      padding-bottom: 2px;\n      margin-bottom: 4px; }\n.fk-sheet-review-routine-and-action-log h1 { font-size: 16px; margin: 0; }\n.fk-sheet-review-routine-and-action-log h2 { font-size: 13px;\n      margin: 6px 0 3px 0;\n      text-transform: uppercase; }\n.fk-sheet-review-routine-and-action-log .privacy-banner { border: 1.5px solid #000;\n      padding: 3px 6px;\n      font-weight: bold;\n      text-align: center;\n      background: #f4f4f4;\n      margin-bottom: 5px;\n      font-size: 11.5px; }\n.fk-sheet-review-routine-and-action-log .meta-row { display: flex;\n      gap: 8px;\n      margin-bottom: 5px;\n      flex-wrap: wrap; }\n.fk-sheet-review-routine-and-action-log .meta-box { border: 1px solid #000;\n      padding: 3px 6px;\n      flex: 1 1 140px;\n      font-weight: bold; }\n.fk-sheet-review-routine-and-action-log .routine-box { border: 1px solid #000;\n      padding: 5px 8px;\n      margin-bottom: 6px;\n      background: #fafafa;\n      page-break-inside: avoid;\n      break-inside: avoid; }\n.fk-sheet-review-routine-and-action-log .routine-box ol { margin: 3px 0;\n      padding-left: 18px; }\n.fk-sheet-review-routine-and-action-log .routine-box li { margin-bottom: 2.5px; }\n.fk-sheet-review-routine-and-action-log table { width: 100%;\n      border-collapse: collapse;\n      margin-bottom: 5px; }\n.fk-sheet-review-routine-and-action-log th, .fk-sheet-review-routine-and-action-log td { border: 1px solid #000;\n      padding: 3px 4px;\n      vertical-align: middle;\n      font-size: 10.5px; }\n.fk-sheet-review-routine-and-action-log th { background: #eee;\n      text-align: center; }\n.fk-sheet-review-routine-and-action-log td.tall { height: 9.5mm; }\n.fk-sheet-review-routine-and-action-log td.center { text-align: center; white-space: nowrap; }\n.fk-sheet-review-routine-and-action-log .cb { display: inline-block;\n      width: 5.2mm;\n      height: 5.2mm;\n      border: 1.5px solid #000;\n      vertical-align: middle;\n      margin-right: 1px;\n      background: #fff; }\n.fk-sheet-review-routine-and-action-log .ev { font-size: 9.5px; font-weight: normal; color: #222; }\n.fk-sheet-review-routine-and-action-log footer { margin-top: 6px;\n      padding-top: 3px;\n      border-top: 1px solid #000;\n      font-size: 10px;\n      text-align: center; }\n.fk-sheet-review-routine-and-action-log footer a { color: #000; }\n@media print {\n  .fk-sheet-review-routine-and-action-log { padding: 0; font-size: 11px; }\n  .fk-sheet-review-routine-and-action-log .nav-bar { display: none; }\n  .fk-sheet-review-routine-and-action-log .page { max-width: 100%; }\n}","bodyHtml":"<div class=\"page\">\n    <div class=\"nav-bar\">\n      <a href=\"index.html\">← Field Kit Index<\/a>\n      <a href=\"../ipc-kit.html\">Open App (ipc-kit.html)<\/a>\n      <a href=\"../evidence/evidence-register.html\">Evidence Register<\/a>\n    <\/div>\n\n    <div class=\"top-header\">\n      <h1>30-Minute Monthly Review Routine &amp; Corrective Action Log<\/h1>\n      <span>Monitoring, audit &amp; feedback <span class=\"ev\">[HH-12, RC-06, IPC-01]<\/span><\/span>\n    <\/div>\n\n    <div class=\"privacy-banner\">\n      Do not write names, ID numbers or clinical details on this sheet. <span class=\"ev\">[HH-10, PR-02, PR-03]<\/span>\n    <\/div>\n\n    <div class=\"meta-row\">\n      <div class=\"meta-box\">Review Month (YYYY-MM): __________________<\/div>\n      <div class=\"meta-box\">Areas covered: ___________________________<\/div>\n      <div class=\"meta-box\">Chaired by role: <em>IPC focal person<\/em> <span class=\"ev\">[IPC-02]<\/span><\/div>\n    <\/div>\n\n    <div class=\"routine-box\">\n      <h2>30-Minute Monthly Review Routine (for the IPC Focal Person) <span class=\"ev\">[HH-12, RC-06, IPC-01]<\/span><\/h2>\n      <ol>\n        <li><span class=\"cb\"><\/span> <strong>Prepare report before the meeting:<\/strong> In <code>Reports<\/code>, select the month and area codes, print the summary or download the CSV reports, and bring completed <code>readiness-checklist.html<\/code> sheets and stock alerts <span class=\"ev\">[IPC-01]<\/span>.<\/li>\n        <li><span class=\"cb\"><\/span> <strong>Check last month's actions (5 min):<\/strong> Fill in <em>Checked on<\/em>, <em>Done? (Yes/Partly/No)<\/em>, and <em>Result seen next review<\/em> on last month's log rows <span class=\"ev\">[RC-06]<\/span>.<\/li>\n        <li><span class=\"cb\"><\/span> <strong>Share results with counts, not just percentages (10 min):<\/strong> Always present both numbers, e.g. <em>160 of 200 opportunities, 80%<\/em> <span class=\"ev\">[HH-03, HH-06]<\/span>. Combine sessions by adding counts first, never by averaging percentages <span class=\"ev\">[HH-05]<\/span>.<\/li>\n        <li><span class=\"cb\"><\/span> <strong>Flag small samples:<\/strong> Any group with fewer than 200 opportunities (or your facility's threshold) is flagged <em>Small sample – interpret with care<\/em> <span class=\"ev\">[HH-07]<\/span>. Review small groups before sharing reports outside the team.<\/li>\n        <li><span class=\"cb\"><\/span> <strong>Discuss without blaming individuals (5 min):<\/strong> Observation is for improving supplies, placement, and workflow—never for naming or punishing staff <span class=\"ev\">[HH-10, HH-12, IPC-03]<\/span>.<\/li>\n        <li><span class=\"cb\"><\/span> <strong>Pick at most 3 actions &amp; assign to a ROLE with due date (10 min):<\/strong> Choose up to 3 realistic fixes. Assign each to a <strong>ROLE<\/strong> (<code>IPC focal person<\/code>, <code>Ward in-charge<\/code>, <code>Storekeeper<\/code>, <code>Facility manager<\/code>, <code>Maintenance lead<\/code>, or <code>Cleaning supervisor<\/code>—never a name) with a clear due date. Next month, check completion and record the result <span class=\"ev\">[RC-06]<\/span>.<\/li>\n      <\/ol>\n    <\/div>\n\n    <h2>Corrective Action Log <span class=\"ev\">[RC-06, IPC-01]<\/span><\/h2>\n    <table>\n      <thead>\n        <tr>\n          <th style=\"width: 4%;\">#<\/th>\n          <th style=\"width: 20%;\">Finding<br><span class=\"ev\">(short, no names, include area code)<\/span><\/th>\n          <th style=\"width: 22%;\">Action to take<br><span class=\"ev\">(pick max 3 new actions per month)<\/span><\/th>\n          <th style=\"width: 13%;\">Responsible role<br><span class=\"ev\">(ROLE only, no name)<\/span><\/th>\n          <th style=\"width: 9%;\">Due date<br><span class=\"ev\">(YYYY-MM-DD)<\/span><\/th>\n          <th style=\"width: 9%;\">Checked on<br><span class=\"ev\">(YYYY-MM-DD)<\/span><\/th>\n          <th style=\"width: 11%;\">Done?<br><span class=\"ev\">(tick one)<\/span><\/th>\n          <th style=\"width: 12%;\">Result seen next review<\/th>\n        <\/tr>\n      <\/thead>\n      <tbody>\n        <tr style=\"background: #f9f9f9; font-style: italic;\">\n          <td class=\"center\">Ex<\/td>\n          <td>OPD: Hand rub empty at triage desk; 12 of 25 opp. (48%, small sample)<\/td>\n          <td>Mount wall bracket at triage and add daily morning refill check<\/td>\n          <td>Ward in-charge<\/td>\n          <td class=\"center\">2026-11-15<\/td>\n          <td class=\"center\">2026-12-01<\/td>\n          <td class=\"center\">☑Y ☐P ☐N<\/td>\n          <td>Dispenser full all month; 38 of 45 (84%)<\/td>\n        <\/tr>\n        <tr>\n          <td class=\"tall center\">1<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>P <span class=\"cb\"><\/span>N<\/td><td><\/td>\n        <\/tr>\n        <tr>\n          <td class=\"tall center\">2<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>P <span class=\"cb\"><\/span>N<\/td><td><\/td>\n        <\/tr>\n        <tr>\n          <td class=\"tall center\">3<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>P <span class=\"cb\"><\/span>N<\/td><td><\/td>\n        <\/tr>\n        <tr>\n          <td class=\"tall center\">4<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>P <span class=\"cb\"><\/span>N<\/td><td><\/td>\n        <\/tr>\n        <tr>\n          <td class=\"tall center\">5<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>P <span class=\"cb\"><\/span>N<\/td><td><\/td>\n        <\/tr>\n        <tr>\n          <td class=\"tall center\">6<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>P <span class=\"cb\"><\/span>N<\/td><td><\/td>\n        <\/tr>\n        <tr>\n          <td class=\"tall center\">7<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>P <span class=\"cb\"><\/span>N<\/td><td><\/td>\n        <\/tr>\n        <tr>\n          <td class=\"tall center\">8<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>P <span class=\"cb\"><\/span>N<\/td><td><\/td>\n        <\/tr>\n        <tr>\n          <td class=\"tall center\">9<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td>\n          <td class=\"center\"><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>P <span class=\"cb\"><\/span>N<\/td><td><\/td>\n        <\/tr>\n      <\/tbody>\n    <\/table>\n\n    <footer>\n      IPC Starter Kit v1.0.0 · Original text © 2026 @mostafase · <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\">CC BY-NC-SA 4.0<\/a> · Sources: see evidence register (<a href=\"../evidence/evidence-register.html\">evidence/evidence-register.html<\/a>)\n    <\/footer>\n  <\/div>"},"field-kit/practice-scenarios.html":{"id":"field-kit/practice-scenarios.html","slug":"practice-scenarios","label":"6. Practice scenarios & answer key","title":"Hand Hygiene Practice Scenarios – IPC Starter Kit v1.0.0","kind":"html","inAllSheets":true,"scopeClass":"fk-sheet-practice-scenarios","scopedCss":"@page { size: auto; margin: 12mm; }\n.fk-sheet-practice-scenarios, .fk-sheet-practice-scenarios * { box-sizing: border-box; }\n.fk-sheet-practice-scenarios { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n      color: #000;\n      background: #fff;\n      margin: 0;\n      padding: 8px;\n      font-size: 12px;\n      line-height: 1.35; }\n.fk-sheet-practice-scenarios .page { max-width: 190mm;\n      margin: 0 auto; }\n.fk-sheet-practice-scenarios .page-break { page-break-before: always;\n      break-before: page; }\n.fk-sheet-practice-scenarios .nav-bar { margin-bottom: 6px;\n      padding-bottom: 4px;\n      border-bottom: 1px solid #444;\n      font-size: 11px; }\n.fk-sheet-practice-scenarios .nav-bar a { color: #000; text-decoration: underline; margin-right: 12px; }\n.fk-sheet-practice-scenarios .top-header { display: flex;\n      justify-content: space-between;\n      align-items: baseline;\n      border-bottom: 2px solid #000;\n      padding-bottom: 2px;\n      margin-bottom: 5px; }\n.fk-sheet-practice-scenarios h1 { font-size: 16.5px; margin: 0; }\n.fk-sheet-practice-scenarios h2 { font-size: 13.5px; margin: 8px 0 4px 0; }\n.fk-sheet-practice-scenarios .privacy-banner { border: 1.5px solid #000;\n      padding: 3px 6px;\n      font-weight: bold;\n      text-align: center;\n      background: #f4f4f4;\n      margin-bottom: 6px;\n      font-size: 11.5px; }\n.fk-sheet-practice-scenarios .legend-box { border: 1px solid #000;\n      padding: 5px 8px;\n      margin-bottom: 6px;\n      background: #fafafa; }\n.fk-sheet-practice-scenarios .legend-box ol { margin: 3px 0;\n      padding-left: 18px;\n      columns: 2; }\n.fk-sheet-practice-scenarios .scenario-card { border: 1px solid #000;\n      padding: 6px 8px;\n      margin-bottom: 6px;\n      page-break-inside: avoid;\n      break-inside: avoid; }\n.fk-sheet-practice-scenarios .scenario-card p { margin: 2px 0 5px 0; }\n.fk-sheet-practice-scenarios .cb { display: inline-block;\n      width: 5.2mm;\n      height: 5.2mm;\n      border: 1.5px solid #000;\n      vertical-align: middle;\n      margin-right: 3px;\n      background: #fff; }\n.fk-sheet-practice-scenarios .tick-row { display: flex;\n      gap: 12px;\n      flex-wrap: wrap;\n      font-size: 11.5px;\n      margin-top: 3px; }\n.fk-sheet-practice-scenarios .ev { font-size: 9.5px; font-weight: normal; color: #222; }\n.fk-sheet-practice-scenarios .ans-card { border: 1px solid #000;\n      padding: 7px 9px;\n      margin-bottom: 7px;\n      page-break-inside: avoid;\n      break-inside: avoid; }\n.fk-sheet-practice-scenarios footer { margin-top: 8px;\n      padding-top: 4px;\n      border-top: 1px solid #000;\n      font-size: 10px;\n      text-align: center; }\n.fk-sheet-practice-scenarios footer a { color: #000; }\n@media print {\n  .fk-sheet-practice-scenarios { padding: 0; font-size: 11.5px; }\n  .fk-sheet-practice-scenarios .nav-bar { display: none; }\n  .fk-sheet-practice-scenarios .page { max-width: 100%; }\n}","bodyHtml":"<!-- PAGE 1: WORKSHEET -->\n  <div class=\"page\">\n    <div class=\"nav-bar\">\n      <a href=\"index.html\">← Field Kit Index<\/a>\n      <a href=\"../ipc-kit.html\">Open App (ipc-kit.html)<\/a>\n      <a href=\"../evidence/evidence-register.html\">Evidence Register<\/a>\n    <\/div>\n\n    <div class=\"top-header\">\n      <h1>Hand Hygiene Practice Scenarios – Group Training Worksheet<\/h1>\n      <span>Observer training before data collection <span class=\"ev\">[HH-09]<\/span><\/span>\n    <\/div>\n\n    <div class=\"privacy-banner\">\n      Do not write names, ID numbers or clinical details on this sheet. <span class=\"ev\">[HH-10, PR-02, PR-03]<\/span>\n    <\/div>\n\n    <div class=\"legend-box\">\n      <strong>Moment Legend (use these 5 moments for Scenarios 1–4) <span class=\"ev\">[HH-01]<\/span>:<\/strong>\n      <ol>\n        <li><strong>Before touching a patient<\/strong><\/li>\n        <li><strong>Before a clean/aseptic procedure<\/strong><\/li>\n        <li><strong>After body fluid exposure risk<\/strong><\/li>\n        <li><strong>After touching a patient<\/strong><\/li>\n        <li><strong>After touching patient surroundings<\/strong><\/li>\n      <\/ol>\n      <div style=\"font-size: 11px; margin-top: 2px;\">\n        <strong>Key rules:<\/strong> Tick all moments that happen together in the same opportunity (counted once) <span class=\"ev\">[HH-02]<\/span>. Then choose ONE outcome: <em>Hand rub<\/em>, <em>Handwash<\/em>, or <em>Missed<\/em> <span class=\"ev\">[HH-04]<\/span>.\n      <\/div>\n    <\/div>\n\n    <div class=\"scenario-card\">\n      <strong>Scenario 1:<\/strong> A nurse finishes checking one patient's blood pressure and goes straight to help the next patient sit up. Between the two patients, the nurse uses alcohol-based hand rub.\n      <div class=\"tick-row\">\n        <span><strong>Moments:<\/strong> <span class=\"cb\"><\/span>M1 &nbsp; <span class=\"cb\"><\/span>M2 &nbsp; <span class=\"cb\"><\/span>M3 &nbsp; <span class=\"cb\"><\/span>M4 &nbsp; <span class=\"cb\"><\/span>M5<\/span>\n        <span><strong>Outcome:<\/strong> <span class=\"cb\"><\/span>Hand rub &nbsp; <span class=\"cb\"><\/span>Handwash &nbsp; <span class=\"cb\"><\/span>Missed<\/span>\n        <span><strong>How many opportunities?<\/strong> <span class=\"cb\"><\/span>1 &nbsp; <span class=\"cb\"><\/span>2<\/span>\n      <\/div>\n    <\/div>\n\n    <div class=\"scenario-card\">\n      <strong>Scenario 2:<\/strong> A health worker is about to dress a wound. They put on gloves without cleaning their hands first.\n      <div class=\"tick-row\">\n        <span><strong>Moments:<\/strong> <span class=\"cb\"><\/span>M1 &nbsp; <span class=\"cb\"><\/span>M2 &nbsp; <span class=\"cb\"><\/span>M3 &nbsp; <span class=\"cb\"><\/span>M4 &nbsp; <span class=\"cb\"><\/span>M5<\/span>\n        <span><strong>Outcome:<\/strong> <span class=\"cb\"><\/span>Hand rub &nbsp; <span class=\"cb\"><\/span>Handwash &nbsp; <span class=\"cb\"><\/span>Missed<\/span>\n      <\/div>\n    <\/div>\n\n    <div class=\"scenario-card\">\n      <strong>Scenario 3:<\/strong> After emptying a urine drainage bag, a health worker removes their gloves and washes hands with soap and water.\n      <div class=\"tick-row\">\n        <span><strong>Moments:<\/strong> <span class=\"cb\"><\/span>M1 &nbsp; <span class=\"cb\"><\/span>M2 &nbsp; <span class=\"cb\"><\/span>M3 &nbsp; <span class=\"cb\"><\/span>M4 &nbsp; <span class=\"cb\"><\/span>M5<\/span>\n        <span><strong>Outcome:<\/strong> <span class=\"cb\"><\/span>Hand rub &nbsp; <span class=\"cb\"><\/span>Handwash &nbsp; <span class=\"cb\"><\/span>Missed<\/span>\n      <\/div>\n    <\/div>\n\n    <div class=\"scenario-card\">\n      <strong>Scenario 4:<\/strong> A nurse straightens the bed sheets of a patient who is sitting in a chair across the room, then walks to the nurses' station without cleaning hands.\n      <div class=\"tick-row\">\n        <span><strong>Moments:<\/strong> <span class=\"cb\"><\/span>M1 &nbsp; <span class=\"cb\"><\/span>M2 &nbsp; <span class=\"cb\"><\/span>M3 &nbsp; <span class=\"cb\"><\/span>M4 &nbsp; <span class=\"cb\"><\/span>M5<\/span>\n        <span><strong>Outcome:<\/strong> <span class=\"cb\"><\/span>Hand rub &nbsp; <span class=\"cb\"><\/span>Handwash &nbsp; <span class=\"cb\"><\/span>Missed<\/span>\n      <\/div>\n    <\/div>\n\n    <div class=\"scenario-card\">\n      <strong>Scenario 5:<\/strong> Area A: 4 of 5 opportunities, 80%. Area B: 150 of 200 opportunities, 75%. Best conclusion?\n      <div style=\"margin-top: 3px;\">\n        <div><span class=\"cb\"><\/span> a) Area A has better hand hygiene than Area B.<\/div>\n        <div><span class=\"cb\"><\/span> b) Area A has too few observations to compare; observe more before drawing conclusions.<\/div>\n        <div><span class=\"cb\"><\/span> c) Both areas are the same.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"scenario-card\">\n      <strong>Scenario 6:<\/strong> Session 1: 9 of 10 (90%). Session 2: 10 of 30 (33%). Combined result?\n      <div style=\"margin-top: 3px;\">\n        <div><span class=\"cb\"><\/span> a) 62% (average of the two percentages)<\/div>\n        <div><span class=\"cb\"><\/span> b) 19 of 40 opportunities, 48%<\/div>\n        <div><span class=\"cb\"><\/span> c) 90%<\/div>\n      <\/div>\n    <\/div>\n\n    <footer>\n      IPC Starter Kit v1.0.0 · Original text © 2026 @mostafase · <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\">CC BY-NC-SA 4.0<\/a> · Sources: see evidence register (<a href=\"../evidence/evidence-register.html\">evidence/evidence-register.html<\/a>)\n    <\/footer>\n  <\/div>\n\n  <!-- PAGE 2: ANSWER KEY -->\n  <div class=\"page page-break\">\n    <div class=\"top-header\">\n      <h1>Hand Hygiene Practice Scenarios – Trainer Answer Key<\/h1>\n      <span>Keep separate during group quiz · Discuss each rule <span class=\"ev\">[HH-01..HH-11]<\/span><\/span>\n    <\/div>\n\n    <div class=\"privacy-banner\">\n      Do not write names, ID numbers or clinical details on this sheet. <span class=\"ev\">[HH-10, PR-02, PR-03]<\/span>\n    <\/div>\n\n    <div class=\"ans-card\">\n      <strong>Scenario 1 Answer:<\/strong> <strong>Moments 4 and 1<\/strong> (4 After touching a patient + 1 Before touching a patient), Outcome: <strong>Hand rub<\/strong>, counted as <strong>ONE opportunity<\/strong> <span class=\"ev\">[HH-01, HH-02, HH-04]<\/span>.<br>\n      <em>Why:<\/em> Moving directly from touching one patient to touching the next creates two indications at the same time. Two moments at the same time count once as a single hand hygiene opportunity (one row on the observation sheet).\n    <\/div>\n\n    <div class=\"ans-card\">\n      <strong>Scenario 2 Answer:<\/strong> <strong>Moment 2<\/strong> (Before a clean/aseptic procedure), Outcome: <strong>Missed<\/strong> <span class=\"ev\">[HH-01, HH-04, HH-11]<\/span>.<br>\n      <em>Why:<\/em> Dressing a wound is a clean/aseptic procedure. Putting on gloves does not replace hand hygiene; hands must be cleaned before putting on gloves.\n    <\/div>\n\n    <div class=\"ans-card\">\n      <strong>Scenario 3 Answer:<\/strong> <strong>Moment 3<\/strong> (After body fluid exposure risk), Outcome: <strong>Handwash<\/strong> <span class=\"ev\">[HH-01, HH-04, HH-11]<\/span>.<br>\n      <em>Why:<\/em> Emptying a urine drainage bag carries a body fluid exposure risk. Hands must be cleaned immediately after removing gloves; washing with soap and water is recorded as <em>Handwash<\/em>.\n    <\/div>\n\n    <div class=\"ans-card\">\n      <strong>Scenario 4 Answer:<\/strong> <strong>Moment 5<\/strong> (After touching patient surroundings), Outcome: <strong>Missed<\/strong> <span class=\"ev\">[HH-01, HH-04]<\/span>.<br>\n      <em>Why:<\/em> Touching the patient's bed sheets without touching the patient is Moment 5. Leaving the patient zone without cleaning hands is a missed opportunity.\n    <\/div>\n\n    <div class=\"ans-card\">\n      <strong>Scenario 5 Answer:<\/strong> <strong>b) Area A has too few observations to compare; observe more before drawing conclusions.<\/strong> <span class=\"ev\">[HH-06, HH-07]<\/span><br>\n      <em>Why:<\/em> Always read the counts alongside the percentage. Five opportunities is a very small sample (one missed action changes the result by 20 percentage points). Results with fewer than 200 opportunities are flagged <em>Small sample – interpret with care<\/em>.\n    <\/div>\n\n    <div class=\"ans-card\">\n      <strong>Scenario 6 Answer:<\/strong> <strong>b) 19 of 40 opportunities, 48%<\/strong> <span class=\"ev\">[HH-03, HH-05, HH-06]<\/span>.<br>\n      <em>Why:<\/em> Sessions are combined by adding the counts first (9 + 10 = 19 actions; 10 + 30 = 40 opportunities; 100 × 19 / 40 = 47.5%, rounded to 48%), never by averaging the session percentages.\n    <\/div>\n\n    <div class=\"legend-box\">\n      <strong>Exact Moment Labels Used in App and Paper Forms <span class=\"ev\">[HH-01]<\/span>:<\/strong>\n      <ol>\n        <li>1 Before touching a patient<\/li>\n        <li>2 Before a clean/aseptic procedure<\/li>\n        <li>3 After body fluid exposure risk<\/li>\n        <li>4 After touching a patient<\/li>\n        <li>5 After touching patient surroundings<\/li>\n      <\/ol>\n    <\/div>\n\n    <footer>\n      IPC Starter Kit v1.0.0 · Original text © 2026 @mostafase · <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\">CC BY-NC-SA 4.0<\/a> · Sources: see evidence register (<a href=\"../evidence/evidence-register.html\">evidence/evidence-register.html<\/a>)\n    <\/footer>\n  <\/div>"},"field-kit/data-handling-plan.html":{"id":"field-kit/data-handling-plan.html","slug":"data-handling-plan","label":"7. Facility data-handling plan","title":"Facility Data-Handling Plan – IPC Starter Kit v1.0.0","kind":"html","inAllSheets":true,"scopeClass":"fk-sheet-data-handling-plan","scopedCss":"@page { size: auto; margin: 12mm; }\n.fk-sheet-data-handling-plan, .fk-sheet-data-handling-plan * { box-sizing: border-box; }\n.fk-sheet-data-handling-plan { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n      color: #000;\n      background: #fff;\n      margin: 0;\n      padding: 8px;\n      font-size: 11.5px;\n      line-height: 1.32; }\n.fk-sheet-data-handling-plan .page { max-width: 190mm;\n      margin: 0 auto; }\n.fk-sheet-data-handling-plan .nav-bar { margin-bottom: 6px;\n      padding-bottom: 4px;\n      border-bottom: 1px solid #444;\n      font-size: 11px; }\n.fk-sheet-data-handling-plan .nav-bar a { color: #000; text-decoration: underline; margin-right: 12px; }\n.fk-sheet-data-handling-plan .top-header { display: flex;\n      justify-content: space-between;\n      align-items: baseline;\n      border-bottom: 2px solid #000;\n      padding-bottom: 2px;\n      margin-bottom: 4px; }\n.fk-sheet-data-handling-plan h1 { font-size: 16px; margin: 0; }\n.fk-sheet-data-handling-plan .privacy-banner { border: 1.5px solid #000;\n      padding: 4px 6px;\n      font-weight: bold;\n      text-align: center;\n      background: #f4f4f4;\n      margin-bottom: 5px;\n      font-size: 11.5px; }\n.fk-sheet-data-handling-plan .note-box { border: 1px solid #000;\n      padding: 4px 7px;\n      margin-bottom: 6px;\n      font-size: 10.5px;\n      background: #fafafa; }\n.fk-sheet-data-handling-plan table { width: 100%;\n      border-collapse: collapse;\n      margin-bottom: 6px; }\n.fk-sheet-data-handling-plan th, .fk-sheet-data-handling-plan td { border: 1px solid #000;\n      padding: 4px 6px;\n      vertical-align: top;\n      font-size: 10.8px; }\n.fk-sheet-data-handling-plan th { background: #eee;\n      text-align: left;\n      width: 34%; }\n.fk-sheet-data-handling-plan .cb { display: inline-block;\n      width: 5.2mm;\n      height: 5.2mm;\n      border: 1.5px solid #000;\n      vertical-align: middle;\n      margin-right: 3px;\n      background: #fff; }\n.fk-sheet-data-handling-plan .ev { font-size: 9.5px; font-weight: normal; color: #222; }\n.fk-sheet-data-handling-plan .sign-box { border: 1px solid #000;\n      padding: 6px 8px;\n      page-break-inside: avoid;\n      break-inside: avoid;\n      font-size: 11px; }\n.fk-sheet-data-handling-plan footer { margin-top: 6px;\n      padding-top: 3px;\n      border-top: 1px solid #000;\n      font-size: 10px;\n      text-align: center; }\n.fk-sheet-data-handling-plan footer a { color: #000; }\n@media print {\n  .fk-sheet-data-handling-plan { padding: 0; font-size: 11px; }\n  .fk-sheet-data-handling-plan .nav-bar { display: none; }\n  .fk-sheet-data-handling-plan .page { max-width: 100%; }\n}","bodyHtml":"<div class=\"page\">\n    <div class=\"nav-bar\">\n      <a href=\"index.html\">← Field Kit Index<\/a>\n      <a href=\"../ipc-kit.html\">Open App (ipc-kit.html)<\/a>\n      <a href=\"../evidence/evidence-register.html\">Evidence Register<\/a>\n    <\/div>\n\n    <div class=\"top-header\">\n      <h1>Facility Data-Handling Plan (Fill-In Form)<\/h1>\n      <span>Complete using ROLES, never personal names <span class=\"ev\">[PR-01, PR-02, PR-03]<\/span><\/span>\n    <\/div>\n\n    <div class=\"privacy-banner\">\n      Do not write names, ID numbers or clinical details on this sheet. <span class=\"ev\">[HH-10, PR-02, PR-03]<\/span>\n    <\/div>\n\n    <div class=\"note-box\">\n      <strong>Scope &amp; Reference Model Note <span class=\"ev\">[PR-01, PR-02, PR-03]<\/span>:<\/strong>\n      The IPC Starter Kit collects <strong>no<\/strong> patient or staff identifiers and stores only grouped monthly counts by area code and supply stock balances <span class=\"ev\">[HH-10, PR-02, PR-03]<\/span>. This plan uses administrative, physical, and technical safeguard categories from the HIPAA Security Rule strictly as a practical reference model for local device and backup stewardship—<strong>it is not a legal claim of HIPAA compliance<\/strong> <span class=\"ev\">[PR-01]<\/span>. Any future workflow that handles personal health information (PHI) requires a separate deployment-specific privacy and security review <span class=\"ev\">[PR-03]<\/span>.\n    <\/div>\n\n    <table>\n      <tbody>\n        <tr>\n          <th>1. Facility code / label &amp; approved area codes<\/th>\n          <td>\n            Facility label: ______________________________ &nbsp; Effective date: _______________<br>\n            Approved area codes (capital letters/numbers/dash, max 12 chars, e.g. <code>OPD<\/code>, <code>MAT<\/code>, <code>WARD-A<\/code>):<br>\n            ____________________________________________________________________________________\n          <\/td>\n        <\/tr>\n        <tr>\n          <th>2. Approved device(s) &amp; browser<\/th>\n          <td>\n            Device label(s) &amp; room/location (no personal names): ________________________________________<br>\n            Approved browser on device (use ONE browser consistently): ___________________________________\n          <\/td>\n        <\/tr>\n        <tr>\n          <th>3. Where the app file lives<\/th>\n          <td>\n            Fixed folder path on the device (e.g. <code>C:\\ipc-starter-kit\\ipc-kit.html<\/code>):<br>\n            ____________________________________________________________________________________<br>\n            <em>Rule:<\/em> Keep the file in this exact folder; moving the file causes the browser to show an empty dataset.\n          <\/td>\n        <\/tr>\n        <tr>\n          <th>4. Approved backup location(s) &amp; access roles<\/th>\n          <td>\n            <span class=\"cb\"><\/span> Encrypted USB drive kept in locked cabinet (location: ___________________________)<br>\n            <span class=\"cb\"><\/span> Facility computer / local server folder (path: __________________________________)<br>\n            Roles permitted to access backups (e.g. <em>IPC focal person<\/em>, <em>Facility manager<\/em>): ____________________\n          <\/td>\n        <\/tr>\n        <tr>\n          <th>5. Backup schedule<\/th>\n          <td>\n            <span class=\"cb\"><\/span> Weekly (every _______________) &nbsp; <span class=\"cb\"><\/span> After monthly review &nbsp; <span class=\"cb\"><\/span> Before/after any restore test<br>\n            Responsible role for making backups: ____________________________________________________\n          <\/td>\n        <\/tr>\n        <tr>\n          <th>6. Device screen lock / PIN<\/th>\n          <td>\n            <span class=\"cb\"><\/span> Screen lock / PIN enabled on all approved devices (auto-lock after ____ minutes).<br>\n            Responsible role for checking device lock: _________________________________________________\n          <\/td>\n        <\/tr>\n        <tr>\n          <th>7. Cloud sync of Downloads / backup folder<\/th>\n          <td>\n            <span class=\"cb\"><\/span> Automatic cloud sync (OneDrive/Google Drive/iCloud) is <strong>disabled<\/strong> for the browser Downloads and backup folders &nbsp; OR &nbsp; <span class=\"cb\"><\/span> Explicitly approved by facility leadership (role: ____________________).\n          <\/td>\n        <\/tr>\n        <tr>\n          <th>8. Browser 'Clear data' warning<\/th>\n          <td>\n            <span class=\"cb\"><\/span> Staff briefed: clearing browser site data, using private/incognito windows, or uninstalling the browser deletes local app records. Always download and verify a backup before browser maintenance.\n          <\/td>\n        <\/tr>\n        <tr>\n          <th>9. Retention period for backups &amp; paper sheets<\/th>\n          <td>\n            Keep verified backup files (<code>ipc-kit-backup_YYYY-MM-DD_HHMM_v1.json<\/code>) for ______ months (facility decides; delete backups older than ______ months after confirming newer backups work).<br>\n            Keep paper observation/count sheets in a closed folder for ______ months, then shred/destroy.\n          <\/td>\n        <\/tr>\n        <tr>\n          <th>10. Small-group review before sharing <span class=\"ev\">[HH-07, HH-10]<\/span><\/th>\n          <td>\n            Small-sample threshold in app: ______ opportunities (default 200).<br>\n            The sample-size alert is for interpreting results. Check all reports for identification risk before sharing.<br>\n            Reviewing role: ____________________________________\n          <\/td>\n        <\/tr>\n        <tr>\n          <th>11. What may be shared outside the facility<\/th>\n          <td>\n            <span class=\"cb\"><\/span> Aggregate monthly summary reports only, after review by the role in item 10.<br>\n            <em>Never share unreviewed backup files or attempt to link observations to individual staff <span class=\"ev\">[HH-10]<\/span>.<\/em>\n          <\/td>\n        <\/tr>\n        <tr>\n          <th>12. Quarterly restore test (every 3 months)<\/th>\n          <td>\n            Test restoring the latest backup every 3 months (using <code>Backup &gt; Restore from backup<\/code> or <code>python3 tools/ipc_tool.py check-backup FILE<\/code>).<br>\n            Next restore test dates: Q1 __________ · Q2 __________ · Q3 __________ · Q4 __________\n          <\/td>\n        <\/tr>\n        <tr>\n          <th>13. If a device or backup drive is lost/damaged<\/th>\n          <td>\n            Notify role immediately: _________________________. Replace locked USB/PIN if needed, place <code>ipc-kit.html<\/code> on the replacement device, and restore the latest verified backup file.\n          <\/td>\n        <\/tr>\n      <\/tbody>\n    <\/table>\n\n    <div class=\"sign-box\">\n      <strong>Sign-off by Roles (write ROLES, not personal names):<\/strong><br><br>\n      Prepared by role (e.g. <em>IPC focal person<\/em>): _________________________ &nbsp; Date (YYYY-MM-DD): _______________<br><br>\n      Approved by role (e.g. <em>Facility manager<\/em>): _________________________ &nbsp; Date (YYYY-MM-DD): _______________\n    <\/div>\n\n    <footer>\n      IPC Starter Kit v1.0.0 · Original text © 2026 @mostafase · <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\">CC BY-NC-SA 4.0<\/a> · Sources: see evidence register (<a href=\"../evidence/evidence-register.html\">evidence/evidence-register.html<\/a>)\n    <\/footer>\n  <\/div>"},"field-kit/ipc-lead-review-and-pilot-checklist.html":{"id":"field-kit/ipc-lead-review-and-pilot-checklist.html","slug":"ipc-lead-review-and-pilot-checklist","label":"8. IPC lead review & pilot checklist","title":"IPC Lead Review and Pilot Checklist – IPC Starter Kit v1.0.0","kind":"html","inAllSheets":true,"scopeClass":"fk-sheet-ipc-lead-review-and-pilot-checklist","scopedCss":"@page { size: auto; margin: 12mm; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist, .fk-sheet-ipc-lead-review-and-pilot-checklist * { box-sizing: border-box; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n      color: #000;\n      background: #fff;\n      margin: 0;\n      padding: 8px;\n      font-size: 11.5px;\n      line-height: 1.3; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist .page { max-width: 190mm;\n      margin: 0 auto; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist .nav-bar { margin-bottom: 6px;\n      padding-bottom: 4px;\n      border-bottom: 1px solid #444;\n      font-size: 11px; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist .nav-bar a { color: #000; text-decoration: underline; margin-right: 12px; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist .top-header { display: flex;\n      justify-content: space-between;\n      align-items: baseline;\n      border-bottom: 2px solid #000;\n      padding-bottom: 2px;\n      margin-bottom: 4px; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist h1 { font-size: 16px; margin: 0; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist h2 { font-size: 13px;\n      margin: 7px 0 3px 0;\n      background: #eee;\n      padding: 3px 6px;\n      border: 1px solid #000; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist .privacy-banner { border: 1.5px solid #000;\n      padding: 3px 6px;\n      font-weight: bold;\n      text-align: center;\n      background: #f4f4f4;\n      margin-bottom: 5px;\n      font-size: 11.5px; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist table { width: 100%;\n      border-collapse: collapse;\n      margin-bottom: 5px; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist th, .fk-sheet-ipc-lead-review-and-pilot-checklist td { border: 1px solid #000;\n      padding: 3.5px 5px;\n      vertical-align: middle;\n      font-size: 10.8px; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist th { background: #f2f2f2;\n      text-align: center; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist td.center { text-align: center; white-space: nowrap; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist .cb { display: inline-block;\n      width: 5.2mm;\n      height: 5.2mm;\n      border: 1.5px solid #000;\n      vertical-align: middle;\n      margin-right: 3px;\n      background: #fff; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist .ev { font-size: 9.5px; font-weight: normal; color: #222; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist .box { border: 1px solid #000;\n      padding: 5px 8px;\n      margin-bottom: 5px;\n      page-break-inside: avoid;\n      break-inside: avoid; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist footer { margin-top: 6px;\n      padding-top: 3px;\n      border-top: 1px solid #000;\n      font-size: 10px;\n      text-align: center; }\n.fk-sheet-ipc-lead-review-and-pilot-checklist footer a { color: #000; }\n@media print {\n  .fk-sheet-ipc-lead-review-and-pilot-checklist { padding: 0; font-size: 10.8px; }\n  .fk-sheet-ipc-lead-review-and-pilot-checklist .nav-bar { display: none; }\n  .fk-sheet-ipc-lead-review-and-pilot-checklist .page { max-width: 100%; }\n}","bodyHtml":"<div class=\"page\">\n    <div class=\"nav-bar\">\n      <a href=\"index.html\">← Field Kit Index<\/a>\n      <a href=\"../ipc-kit.html\">Open App (ipc-kit.html)<\/a>\n      <a href=\"../evidence/evidence-register.html\">Evidence Register<\/a>\n    <\/div>\n\n    <div class=\"top-header\">\n      <h1>Local IPC Lead Review &amp; 2–4 Week Pilot Checklist<\/h1>\n      <span>Complete Part A before real data entry, then run Part B <span class=\"ev\">[IPC-01, IPC-02]<\/span><\/span>\n    <\/div>\n\n    <div class=\"privacy-banner\">\n      Do not write names, ID numbers or clinical details on this sheet. <span class=\"ev\">[HH-10, PR-02, PR-03]<\/span>\n    <\/div>\n\n    <h2>Part A: Local IPC Lead Review Before Use <span class=\"ev\">[IPC-02]<\/span><\/h2>\n    <table>\n      <thead>\n        <tr>\n          <th style=\"width: 8%;\">Done<\/th>\n          <th style=\"width: 64%;\">Required review step<\/th>\n          <th style=\"width: 28%;\">Notes / Date (YYYY-MM-DD)<\/th>\n        <\/tr>\n      <\/thead>\n      <tbody>\n        <tr>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td><strong>1. Local policy alignment:<\/strong> Hand hygiene moments, stock rules, and readiness checklist items match national/facility IPC guidelines <span class=\"ev\">[HH-01, RC-01..RC-06, IPC-01]<\/span>.<\/td>\n          <td><\/td>\n        <\/tr>\n        <tr>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td><strong>2. Area codes approved:<\/strong> Facility area codes defined (capital letters, numbers, or dash, max 12 chars, e.g. <code>OPD<\/code>, <code>MAT<\/code>, <code>WARD-A<\/code>) and entered in <code>Settings<\/code>.<\/td>\n          <td><\/td>\n        <\/tr>\n        <tr>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td><strong>3. Stock items configured:<\/strong> Items, ONE consistent unit per item (locked after first entry) <span class=\"ev\">[ST-01]<\/span>, local reorder points <span class=\"ev\">[ST-09]<\/span>, and expiry alert window (default 90 days) <span class=\"ev\">[ST-08]<\/span> set.<\/td>\n          <td><\/td>\n        <\/tr>\n        <tr>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td><strong>4. Translation reviewed:<\/strong> If using Français or another translation, a fluent local clinical reviewer has checked all UI and field-kit terms (see <code>docs/TRANSLATING.md<\/code>).<\/td>\n          <td><\/td>\n        <\/tr>\n        <tr>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td><strong>5. Evidence register verified against source documents (REQUIRED):<\/strong> Every published-guidance row in <code>evidence/evidence-register.html<\/code> is currently marked <em>Not yet verified against source text – check during local IPC lead review<\/em> because source PDFs were not fetched during build. Check claims against your copy of the WHO / USAID documents.<\/td>\n          <td><\/td>\n        <\/tr>\n        <tr>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td><strong>6. Data-Handling Plan signed:<\/strong> <code>data-handling-plan.html<\/code> completed (approved devices, fixed folder, backup location, retention, small-group review) and signed by roles <span class=\"ev\">[PR-01]<\/span>.<\/td>\n          <td><\/td>\n        <\/tr>\n        <tr>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td><strong>7. Paper fallback printed:<\/strong> Copies of observation sheets, stock cards, count sheets, and readiness checklists printed and placed in pilot areas.<\/td>\n          <td><\/td>\n        <\/tr>\n      <\/tbody>\n    <\/table>\n\n    <h2>Part B: 2–4 Week Pilot in 1–2 Areas<\/h2>\n    <div style=\"margin-bottom: 4px; font-size: 10.8px;\">\n      <strong>Pilot area code(s):<\/strong> _______________________ &nbsp; <strong>Start date:<\/strong> _______________ &nbsp; <strong>End date:<\/strong> _______________\n    <\/div>\n    <table>\n      <thead>\n        <tr>\n          <th style=\"width: 8%;\">Pass<\/th>\n          <th style=\"width: 64%;\">Pilot activity &amp; verification target<\/th>\n          <th style=\"width: 28%;\">Result / Measured value<\/th>\n        <\/tr>\n      <\/thead>\n      <tbody>\n        <tr>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td><strong>1. Device check on each pilot device:<\/strong> Run <code>Settings &gt; Check this device<\/code> (tests saving, downloads, file reading) and copy result into the device test log (<code>docs/DEVICE-TESTING.md<\/code>).<\/td>\n          <td>Device(s) passed: ____ / ____<\/td>\n        <\/tr>\n        <tr>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td><strong>2. Timed 5-minute practice run by each user <span class=\"ev\">[HH-09]<\/span>:<\/strong> Each observer/storekeeper completes the 5-step practice run on <code>Home<\/code> (6 questions, 3 tally opportunities incl. one with two simultaneous moments, finish session, 1 stock issue, 1 backup). <strong>Target: ≤ 5 minutes.<\/strong><\/td>\n          <td>Users trained (count): ____<br>Longest time: ____ min<\/td>\n        <\/tr>\n        <tr>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td><strong>3. Paper vs. app double-entry for 1 week:<\/strong> Record hand hygiene sessions and stock movements on paper AND in the app for one full week; confirm session totals and usable balances match 100%.<\/td>\n          <td>Match? <span class=\"cb\"><\/span> Yes &nbsp; <span class=\"cb\"><\/span> No<\/td>\n        <\/tr>\n        <tr>\n          <td class=\"center\"><span class=\"cb\"><\/span><\/td>\n          <td><strong>4. Backup &amp; restore test after reopening:<\/strong> Download backup file, close browser, reopen, confirm data persists; run <code>Backup &gt; Restore from backup<\/code> (and confirm an invalid file is rejected without replacing data).<\/td>\n          <td>Restore OK? <span class=\"cb\"><\/span> Yes &nbsp; <span class=\"cb\"><\/span> No<\/td>\n        <\/tr>\n      <\/tbody>\n    <\/table>\n\n    <div class=\"box\">\n      <strong>Pilot Team Feedback Questions (summarize without staff names):<\/strong>\n      <ol style=\"margin: 3px 0; padding-left: 18px;\">\n        <li>Were any moment labels, stock reason codes, or readiness questions unclear? _________________________________________<\/li>\n        <li>Did observers correctly record simultaneous moments as ONE opportunity? ______________________________________________<\/li>\n        <li>Were any stock units or expiry dates confusing during physical count? ________________________________________________<\/li>\n      <\/ol>\n    <\/div>\n\n    <div class=\"box\">\n      <strong>Go / No-Go Decision &amp; Criteria:<\/strong><br>\n      <em>Criteria for GO (App + Paper):<\/em> All Part A checks complete; practice run ≤ 5 min; 1-week paper vs. app double-entry matches; backup/restore test passes.<br>\n      <div style=\"margin-top: 4px;\">\n        <span class=\"cb\"><\/span> <strong>GO (App + Paper fallback)<\/strong> &nbsp;&nbsp;\n        <span class=\"cb\"><\/span> <strong>GO – PAPER FORMS ONLY<\/strong> (if local devices do not pass storage/backup checks) &nbsp;&nbsp;\n        <span class=\"cb\"><\/span> <strong>HOLD / REVISE<\/strong> (fix issues first)\n      <\/div>\n      <div style=\"margin-top: 5px;\">\n        Signed by role (<em>IPC focal person<\/em>): _______________________ &nbsp; Approved by role (<em>Facility manager<\/em>): _______________________ &nbsp; Date: _____________\n      <\/div>\n    <\/div>\n\n    <footer>\n      IPC Starter Kit v1.0.0 · Original text © 2026 @mostafase · <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\">CC BY-NC-SA 4.0<\/a> · Sources: see evidence register (<a href=\"../evidence/evidence-register.html\">evidence/evidence-register.html<\/a>)\n    <\/footer>\n  <\/div>"},"evidence/evidence-register.html":{"id":"evidence/evidence-register.html","slug":"evidence-register","label":"Evidence register","title":"Evidence Register – IPC Starter Kit v1.0.0","kind":"html","inAllSheets":false,"scopeClass":"fk-sheet-evidence-register","scopedCss":"@page { size: auto; margin: 12mm; }\n.fk-sheet-evidence-register, .fk-sheet-evidence-register * { box-sizing: border-box; }\n.fk-sheet-evidence-register { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n      color: #000;\n      background: #fff;\n      margin: 0;\n      padding: 12px;\n      font-size: 12px;\n      line-height: 1.38; }\n.fk-sheet-evidence-register .page { max-width: 240mm;\n      margin: 0 auto; }\n.fk-sheet-evidence-register .nav-bar { margin-bottom: 8px;\n      padding-bottom: 5px;\n      border-bottom: 1px solid #444;\n      font-size: 11.5px; }\n.fk-sheet-evidence-register .nav-bar a { color: #000; text-decoration: underline; margin-right: 14px; }\n.fk-sheet-evidence-register h1 { font-size: 19px;\n      margin: 0 0 6px 0;\n      border-bottom: 2px solid #000;\n      padding-bottom: 4px; }\n.fk-sheet-evidence-register h2 { font-size: 14px;\n      margin: 12px 0 5px 0;\n      border-bottom: 1px solid #000;\n      padding-bottom: 2px;\n      text-transform: uppercase; }\n.fk-sheet-evidence-register .callout { border: 1.5px solid #000;\n      padding: 6px 9px;\n      margin-bottom: 10px;\n      background: #f6f6f6; }\n.fk-sheet-evidence-register table { width: 100%;\n      border-collapse: collapse;\n      margin-bottom: 12px; }\n.fk-sheet-evidence-register th, .fk-sheet-evidence-register td { border: 1px solid #000;\n      padding: 4px 5px;\n      text-align: left;\n      vertical-align: top;\n      font-size: 11px; }\n.fk-sheet-evidence-register th { background: #e9e9e9;\n      font-weight: bold; }\n.fk-sheet-evidence-register tr.facility-choice { background: #f0f0f0;\n      border-left: 4px solid #000;\n      border-right: 4px solid #000; }\n.fk-sheet-evidence-register .type-badge { display: inline-block;\n      border: 1px solid #000;\n      padding: 1px 4px;\n      font-size: 10px;\n      font-weight: bold;\n      background: #fff; }\n.fk-sheet-evidence-register .type-fc { border: 2px solid #000;\n      background: #000;\n      color: #fff; }\n.fk-sheet-evidence-register code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;\n      font-size: 10.5px;\n      word-break: break-all; }\n.fk-sheet-evidence-register footer { margin-top: 12px;\n      padding-top: 6px;\n      border-top: 1px solid #000;\n      font-size: 11px;\n      text-align: center; }\n.fk-sheet-evidence-register footer a { color: #000; }\n@media print {\n  .fk-sheet-evidence-register { padding: 0; font-size: 10px; }\n  .fk-sheet-evidence-register .nav-bar { display: none; }\n  .fk-sheet-evidence-register .page { max-width: 100%; }\n  .fk-sheet-evidence-register .type-fc { background: #fff; color: #000; border: 2px dashed #000; }\n}","bodyHtml":"<div class=\"page\">\n    <div class=\"nav-bar\">\n      <a href=\"../ipc-kit.html\">Open App (ipc-kit.html)<\/a>\n      <a href=\"../field-kit/index.html\">Field Kit Index<\/a>\n      <a href=\"evidence-register.csv\">Download CSV (evidence-register.csv)<\/a>\n    <\/div>\n\n    <h1>IPC Starter Kit v1.0.0 – Evidence &amp; Design Register<\/h1>\n\n    <div class=\"callout\">\n      <strong>How to Verify This Register Before Local Use:<\/strong><br>\n      During the offline build of this starter kit, the external source PDFs (WHO IRIS, USAID, and US HHS) could not be fetched over the network. To maintain strict citation honesty, <strong>no page numbers have been invented<\/strong>, expected topics/sections are listed only where confident, and every row resting on published guidance is marked <em>\"Not yet verified against source text – check during local IPC lead review\"<\/em>. Before using the kit for real facility data, the local IPC focal person must check these claims against the facility's official copies of the source documents and sign off Part A of <a href=\"../field-kit/ipc-lead-review-and-pilot-checklist.html\">field-kit/ipc-lead-review-and-pilot-checklist.html<\/a>.\n    <\/div>\n\n    <h2>1. Published Guidance &amp; Kit Design Choice Claims<\/h2>\n    <p>Note: Locally configurable <strong>Facility choice<\/strong> rows are separated into Table 2 below and also highlighted with a bold badge.<\/p>\n\n    <table>\n      <thead>\n        <tr>\n          <th style=\"width: 6%;\">ID<\/th>\n          <th style=\"width: 11%;\">Used in<\/th>\n          <th style=\"width: 25%;\">Claim (our original wording)<\/th>\n          <th style=\"width: 11%;\">Type<\/th>\n          <th style=\"width: 14%;\">Source<\/th>\n          <th style=\"width: 12%;\">Expected section/topic<\/th>\n          <th style=\"width: 12%;\">Verification status<\/th>\n          <th style=\"width: 9%;\">Notes<\/th>\n        <\/tr>\n      <\/thead>\n      <tbody>\n        <tr>\n          <td><strong>HH-01<\/strong><\/td>\n          <td>app rule / training claim<\/td>\n          <td>Hand hygiene observation uses five moments: (1) Before touching a patient, (2) Before a clean/aseptic procedure, (3) After body fluid exposure risk, (4) After touching a patient, and (5) After touching patient surroundings.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO Hand Hygiene Technical Reference Manual 2009 [TRM]<\/td>\n          <td>Five moments for hand hygiene concept &amp; indications<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Original wording only; no WHO graphics bundled.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>HH-02<\/strong><\/td>\n          <td>app metric / app rule<\/td>\n          <td>When one or more hand hygiene indications (moments) occur together at the same time between care tasks, they are recorded as ONE single hand hygiene opportunity and counted once.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO Hand Hygiene Technical Reference Manual 2009 [TRM]<\/td>\n          <td>Definition of opportunity vs. indication during direct observation<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Prevents double-counting transition between patients.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>HH-03<\/strong><\/td>\n          <td>app metric<\/td>\n          <td>Hand hygiene adherence (compliance) percentage is calculated as 100 multiplied by total positive actions (hand rub + handwash) divided by total opportunities.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO Hand Hygiene Technical Reference Manual 2009 [TRM]<\/td>\n          <td>Compliance calculation formula<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Denominator is opportunities, not indications.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>HH-04<\/strong><\/td>\n          <td>app rule<\/td>\n          <td>Each observed opportunity has exactly one recorded action outcome: alcohol-based hand rub, handwashing with soap and water, or missed (counted as not performed).<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO Hand Hygiene Technical Reference Manual 2009 [TRM]<\/td>\n          <td>Recording hand hygiene actions (rub, wash, missed)<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>One outcome per opportunity row.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>HH-05<\/strong><\/td>\n          <td>app metric / app rule<\/td>\n          <td>Multiple observation sessions are combined by summing action counts and opportunity counts first before calculating adherence, never by averaging session percentages.<\/td>\n          <td><span class=\"type-badge\">Kit design choice<\/span><\/td>\n          <td>Follows mathematically from HH-03 (WHO TRM 2009)<\/td>\n          <td>Aggregating observation sessions<\/td>\n          <td>Kit design choice (mathematical rule)<\/td>\n          <td>Tested in Scenario 6 and enforced in app &amp; CLI tool.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>HH-06<\/strong><\/td>\n          <td>app metric / app rule<\/td>\n          <td>Adherence is always displayed with numerator and denominator counts ('X of Y opportunities, Z%'), shows 'No observations' when Y = 0, and avoids misleading 0% or 100% rounding on non-extreme values.<\/td>\n          <td><span class=\"type-badge\">Kit design choice<\/span><\/td>\n          <td>IPC Starter Kit design rule<\/td>\n          <td>Reporting display format<\/td>\n          <td>Kit design choice (verified in app UI)<\/td>\n          <td>Prevents misinterpreting small denominators.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>HH-08<\/strong><\/td>\n          <td>training claim<\/td>\n          <td>A standard direct hand hygiene observation session lasts about 20 minutes.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO Hand Hygiene Technical Reference Manual 2009 [TRM]<\/td>\n          <td>Observation session duration guidance<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Verify exact session length wording during local review.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>HH-09<\/strong><\/td>\n          <td>training claim<\/td>\n          <td>Observers should be trained and practice with sample scenarios before collecting real observation data.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO Hand Hygiene Technical Reference Manual 2009 [TRM]<\/td>\n          <td>Observer training and validation<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Supported by 5-minute practice run &amp; 6 scenarios.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>HH-10<\/strong><\/td>\n          <td>app rule / training claim<\/td>\n          <td>Hand hygiene observation is used to improve systems and is not used to identify, blame, or judge individuals; the kit stores only grouped counts by month and area code with no names, staff categories, or timestamps.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO Hand Hygiene Technical Reference Manual 2009 [TRM] + Kit design choice<\/td>\n          <td>Observation ethics, anonymity, and non-punitive feedback<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Omitting staff category is an intentional kit privacy choice.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>HH-11<\/strong><\/td>\n          <td>training claim<\/td>\n          <td>Wearing medical gloves does not replace hand hygiene; hands must be cleaned when indicated before putting on gloves and after removing gloves.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO Hand Hygiene Technical Reference Manual 2009 [TRM]; WHO Guidelines on Hand Hygiene in Health Care 2009<\/td>\n          <td>Glove use and hand hygiene indications<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Practiced in Scenarios 2 and 3.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>HH-12<\/strong><\/td>\n          <td>training claim / checklist item<\/td>\n          <td>Observation results are fed back regularly to health workers and facility leadership to guide practical improvements.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO TRM 2009; WHO Minimum requirements for IPC programmes 2019<\/td>\n          <td>Performance feedback; Core Component 6 (Monitoring, audit and feedback)<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Used in 30-minute monthly review routine.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>HH-13<\/strong><\/td>\n          <td>training claim<\/td>\n          <td>Cleaning hands with alcohol-based hand rub takes about 20–30 seconds; washing hands with soap and water takes about 40–60 seconds.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO Guidelines on Hand Hygiene in Health Care 2009<\/td>\n          <td>Duration of handrubbing and handwashing procedures<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Verify exact duration range during local review.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>ST-01<\/strong><\/td>\n          <td>app rule / checklist item<\/td>\n          <td>Each tracked IPC supply item uses one consistent counting unit (such as bottle, box of 100, or bar), which is locked after the first entry so counts never mix units.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>USAID | DELIVER PROJECT, The Logistics Handbook (2nd ed., 2011) [LH]<\/td>\n          <td>Standard unit of count on logistics records<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>App locks unit after first stock record.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>ST-02<\/strong><\/td>\n          <td>app metric / app rule<\/td>\n          <td>Stock on hand (balance) counts only usable stock available for use and excludes expired or damaged items.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>USAID | DELIVER PROJECT, The Logistics Handbook 2011 [LH]<\/td>\n          <td>Definition of usable stock on hand<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Expired stock is separated in app &amp; paper cards.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>ST-03<\/strong><\/td>\n          <td>app metric / app rule<\/td>\n          <td>A stockout occurs when usable stock on hand for an item reaches zero.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>USAID | DELIVER PROJECT, The Logistics Handbook 2011 [LH]<\/td>\n          <td>Stockout definition and monitoring<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Even if expired batches exist on shelf, 0 usable = stockout.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>ST-04<\/strong><\/td>\n          <td>app rule / checklist item<\/td>\n          <td>Staff perform regular physical counts of visible stock on the shelf and adjust stock records to match actual usable quantities.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>USAID | DELIVER PROJECT, The Logistics Handbook 2011 [LH]<\/td>\n          <td>Physical inventory count and record reconciliation<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Supported by Page 2 of stock sheet and app Count entry.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>ST-05<\/strong><\/td>\n          <td>app rule<\/td>\n          <td>All stock losses and adjustments are recorded separately from issues and require an explicit reason code (Expired – removed, Damaged, Lost, Transferred out, Found, Transferred in, Correction).<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>USAID | DELIVER PROJECT, The Logistics Handbook 2011 [LH]<\/td>\n          <td>Recording losses and adjustments on stock records<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Distinguishes consumption (issues) from losses.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>ST-06<\/strong><\/td>\n          <td>app rule / checklist item<\/td>\n          <td>Stock cards and app records capture date, receipts, issues, physical counts, losses/adjustments, usable balance, batch number, and expiry date.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>USAID | DELIVER PROJECT, The Logistics Handbook 2011 [LH]<\/td>\n          <td>Essential data elements on stockkeeping records / bin cards<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Area code is optional on issues.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>ST-07<\/strong><\/td>\n          <td>app rule<\/td>\n          <td>Supplies that expire are managed by first-to-expire, first-out (FEFO): the earliest-expiring usable batch is displayed first as 'Use first' and automatically deducted first on issue.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>USAID | DELIVER PROJECT, The Logistics Handbook 2011 [LH]<\/td>\n          <td>First-to-expire, first-out (FEFO) warehouse/storeroom rule<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Reduces wastage from expiry.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>ST-10<\/strong><\/td>\n          <td>app rule / checklist item<\/td>\n          <td>Expired stock never counts toward usable stock totals and must be removed from usable storage; an expiry date is treated as usable up to and including that calendar date.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>USAID | DELIVER PROJECT, The Logistics Handbook 2011 [LH]<\/td>\n          <td>Handling expired products and usable stock calculation<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Inclusive expiry date boundary is explicit in app logic.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>RC-01<\/strong><\/td>\n          <td>checklist item<\/td>\n          <td>Safe water is available in patient care areas for handwashing and environmental cleaning, with covered backup water storage where piped supply is intermittent.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO/UNICEF WASH FIT (2nd ed., 2022); WHO Minimum requirements for IPC programmes 2019<\/td>\n          <td>Water domain indicators; Core Component 8 (Built environment, materials and equipment for IPC)<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Readiness checklist Section 1.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>RC-02<\/strong><\/td>\n          <td>checklist item<\/td>\n          <td>Functional hand hygiene stations with soap and running water or alcohol-based hand rub are available at points of care and within 5 metres of toilets.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO/UNICEF WASH FIT (2nd ed., 2022); WHO Minimum requirements for IPC programmes 2019<\/td>\n          <td>Hand hygiene domain indicators; Core Component 8<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Readiness checklist Sections 2 and 3.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>RC-03<\/strong><\/td>\n          <td>checklist item<\/td>\n          <td>Environmental cleaning supplies (detergent, disinfectant, mops/buckets, utility gloves) and a clear cleaning routine are available and followed.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO/UNICEF WASH FIT (2nd ed., 2022); WHO Minimum requirements for IPC programmes 2019<\/td>\n          <td>Environmental cleanliness domain; Core Component 8<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Readiness checklist Section 4.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>RC-04<\/strong><\/td>\n          <td>checklist item<\/td>\n          <td>Health care waste is segregated at the point of generation (such as a three-bin system for general, infectious, and sharps waste) and safely stored/treated.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO/UNICEF WASH FIT (2nd ed., 2022); WHO Minimum requirements for IPC programmes 2019<\/td>\n          <td>Health care waste management domain; Core Component 8<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Readiness checklist Section 5.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>RC-05<\/strong><\/td>\n          <td>checklist item<\/td>\n          <td>Sharps are placed immediately into puncture-resistant sharps containers located within arm's reach and replaced before passing the three-quarters fill line.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO/UNICEF WASH FIT (2nd ed., 2022)<\/td>\n          <td>Sharps waste safety indicators<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Readiness checklist item 5.2.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>RC-06<\/strong><\/td>\n          <td>checklist item / app rule<\/td>\n          <td>Improvement action plans assign each corrective action to a responsible role with a due date and review completion at the next review meeting.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO/UNICEF WASH FIT (2nd ed., 2022)<\/td>\n          <td>Incremental improvement plan &amp; review cycle<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Kit uses roles (never personal names) for accountability.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>IPC-01<\/strong><\/td>\n          <td>app rule / checklist item<\/td>\n          <td>Regular IPC monitoring, audit of practices and supplies, and timely feedback to staff and leadership are core requirements of an IPC programme.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO Minimum requirements for IPC programmes 2019<\/td>\n          <td>Core Component 6: Monitoring/audit of IPC practices and feedback<\/td>\n          <td>Not yet verified against source text – check during local IPC lead review<\/td>\n          <td>Basis for monthly review routine.<\/td>\n        <\/tr>\n        <tr>\n          <td><strong>IPC-02<\/strong><\/td>\n          <td>checklist item / training claim<\/td>\n          <td>Each facility should have a designated, trained IPC focal person (or lead) responsible for coordinating IPC activities and local reviews.<\/td>\n          <td><span class=\"type-badge\">Published guidance<\/span><\/td>\n          <td>WHO Minimum requirements for IPC programmes 2019<\/td>\n          <td>Core Component 1: IPC programmes (primary care &amp; facility level)<\/td>\n          <td>Not yet verified against source text – check during local I
