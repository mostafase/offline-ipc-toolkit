<style>

<script id="ipc-core">
/* ==========================================================================
   IPC CORE — pure calculation and validation functions.
   No DOM access here, so the same code is unit-tested in Node (tests/).
   ========================================================================== */
(function (root) {
  'use strict';

  var APP_VERSION = '1.0.0';
  var SCHEMA_VERSION = 1;
  var BACKUP_FORMAT = 'ipc-starter-kit-backup';
  var MAX_BACKUP_BYTES = 5 * 1024 * 1024;
  var MAX_QTY = 1000000;
  var MAX_COUNT = 100000;
  var TXN_TYPES = ['receipt', 'issue', 'count', 'adjust'];
  // Adjustment reason codes (coded, so no free text is needed). Sign rule: -1 remove, +1 add, 0 either.
  var ADJUST_REASONS = { expired: -1, damaged: -1, lost: -1, transfer_out: -1, found: 1, transfer_in: 1, correction: 0 };
  var AREA_CODE_RE = /^[A-Z0-9][A-Z0-9-]{0,11}$/;
  var BATCH_RE = /^[A-Za-z0-9][A-Za-z0-9\-\/.]{0,19}$/;
  var LANG_RE = /^[a-z]{2,3}(-[A-Za-z0-9]{2,8})?$/;
  // Control characters and characters used for markup are never allowed in short text fields.
  var BAD_TEXT_RE = /[\u0000-\u001f\u007f<>]/;

  /* ---------- small helpers ---------- */
  function isInt(n) { return typeof n === 'number' && isFinite(n) && Math.floor(n) === n; }
  function isNonNegInt(n, max) { return isInt(n) && n >= 0 && n <= (max || MAX_COUNT); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function isoDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function parseDate(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    var y = +s.slice(0, 4), m = +s.slice(5, 7), d = +s.slice(8, 10);
    if (y < 1) return null;
    var dt = new Date(Date.UTC(y, m - 1, d));
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
    return dt;
  }
  function isValidDate(s) { return parseDate(s) !== null; }
  function isValidPeriod(s) { return typeof s === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(s); }
  function addDays(s, n) {
    var d = parseDate(s); d.setUTCDate(d.getUTCDate() + n);
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
  }
  function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
  function periodOf(dateStr) { return dateStr.slice(0, 7); }
  function addMonths(period, n) {
    var y = +period.slice(0, 4), m = +period.slice(5, 7) - 1 + n;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return y + '-' + pad2(m + 1);
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function zeros5() { return [0, 0, 0, 0, 0]; }

  /* ---------- CRC32 checksum (matches Python zlib.crc32 over UTF-8 bytes) ---------- */
  var CRC_TABLE = (function () {
    var t = [], c, n, k;
    for (n = 0; n < 256; n++) { c = n; for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
    return t;
  })();
  function utf8(str) {
    if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(str);
    var out = [], i, c, c2, cp;
    for (i = 0; i < str.length; i++) {
      c = str.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
      else if (c >= 0xd800 && c < 0xdc00 && i + 1 < str.length) {
        c2 = str.charCodeAt(++i); cp = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
        out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
      } else out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
    return out;
  }
  function crc32(str) {
    var bytes = utf8(str), crc = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    var hex = ((crc ^ 0xFFFFFFFF) >>> 0).toString(16);
    while (hex.length < 8) hex = '0' + hex;
    return hex;
  }

  /* ---------- dataset ---------- */
  function emptyData() {
    return {
      schema: SCHEMA_VERSION,
      settings: {
        facilityLabel: '',
        areaCodes: [],
        smallSampleThreshold: 200,   // facility choice (see evidence register HH-07)
        expiryWindowDays: 90,        // facility choice (see evidence register ST-08)
        language: 'en'
      },
      hh: { entries: [], draft: null },
      stock: { items: [], txns: [] },
      meta: { lastBackupAt: null, nextId: 1 }
    };
  }
  function newId(data, prefix) { var n = data.meta.nextId; data.meta.nextId = n + 1; return prefix + n; }

  /* ==========================================================================
     HAND HYGIENE
     One OPPORTUNITY = one or more moments (indications) occurring together.
     Each opportunity has exactly one outcome: rub (hand rub), wash (handwashing), missed.
     Observed adherence = 100 x actions performed / observed opportunities.
     ========================================================================== */
  function hhOpp(e) { return e.rub + e.wash + e.missed; }

  // Sum any set of sessions/entries by adding counts FIRST (never average percentages).
  function hhSum(entries) {
    var s = { sessions: 0, opp: 0, rub: 0, wash: 0, missed: 0, actions: 0, ind: zeros5(), act: zeros5(), momentOpp: 0 };
    entries.forEach(function (e) {
      s.sessions += 1; s.rub += e.rub; s.wash += e.wash; s.missed += e.missed;
      if (e.ind && e.act) {
        s.momentOpp += hhOpp(e);
        for (var i = 0; i < 5; i++) { s.ind[i] += e.ind[i]; s.act[i] += e.act[i]; }
      }
    });
    s.opp = s.rub + s.wash + s.missed;
    s.actions = s.rub + s.wash;
    return s;
  }

  // Returns a number 0..100 or null when there is nothing to divide by.
  function pct(num, den) { return den > 0 ? (100 * num) / den : null; }

  // Whole-number percentage for display. Never shows 100% unless every opportunity had an
  // action, and never 0% unless none did (avoids misleading rounding).
  function fmtPct(num, den) {
    if (!(den > 0)) return null;
    var p = Math.round((100 * num) / den);
    if (p === 100 && num < den) return '>99%';
    if (p === 0 && num > 0) return '<1%';
    return p + '%';
  }

  // Record one opportunity into a draft session. moments = array of moment numbers 1..5.
  function draftRecord(draft, moments, outcome) {
    if (!moments || !moments.length) throw new Error('no_moment');
    if (['rub', 'wash', 'missed'].indexOf(outcome) < 0) throw new Error('bad_outcome');
    var uniq = [];
    moments.forEach(function (m) { if (m >= 1 && m <= 5 && uniq.indexOf(m) < 0) uniq.push(m); });
    if (!uniq.length) throw new Error('no_moment');
    uniq.sort();
    var d = clone(draft);
    d[outcome] += 1;                       // ONE opportunity, whatever the number of moments
    uniq.forEach(function (m) {
      d.ind[m - 1] += 1;                   // each moment is an indication
      if (outcome !== 'missed') d.act[m - 1] += 1;
    });
    d.last = { moments: uniq, outcome: outcome };
    return d;
  }
  function draftUndo(draft) {
    if (!draft || !draft.last) return draft;
    var d = clone(draft), l = d.last;
    d[l.outcome] -= 1;
    l.moments.forEach(function (m) { d.ind[m - 1] -= 1; if (l.outcome !== 'missed') d.act[m - 1] -= 1; });
    d.last = null;
    return d;
  }
  function newDraft(period, area) {
    return { period: period, area: area, rub: 0, wash: 0, missed: 0, ind: zeros5(), act: zeros5(), last: null };
  }
  function entryFromDraft(draft, id) {
    return { id: id, period: draft.period, area: draft.area, source: 'tally', rub: draft.rub, wash: draft.wash,
             missed: draft.missed, ind: draft.ind.slice(), act: draft.act.slice() };
  }

  // Validate a hand hygiene entry. Returns a list of {code, field} problems (empty = valid).
  function validateHHEntry(e, settings) {
    var errs = [];
    function err(code, field) { errs.push({ code: code, field: field || '' }); }
    if (!isValidPeriod(e.period)) err('hh_period', 'period');
    if (settings && settings.areaCodes.indexOf(e.area) < 0) err('hh_area', 'area');
    ['rub', 'wash', 'missed'].forEach(function (k) { if (!isNonNegInt(e[k])) err('hh_count', k); });
    if (errs.length) return errs;
    var opp = hhOpp(e), actions = e.rub + e.wash;
    if (opp === 0) err('hh_zero', 'rub');
    if (e.ind !== null || e.act !== null) {
      if (!Array.isArray(e.ind) || !Array.isArray(e.act) || e.ind.length !== 5 || e.act.length !== 5) { err('hh_moments', 'ind'); return errs; }
      var sumInd = 0;
      for (var i = 0; i < 5; i++) {
        if (!isNonNegInt(e.ind[i]) || !isNonNegInt(e.act[i])) { err('hh_moments', 'ind' + (i + 1)); continue; }
        sumInd += e.ind[i];
        if (e.ind[i] > opp) err('hh_ind_gt_opp', 'ind' + (i + 1));
        if (e.act[i] > e.ind[i]) err('hh_act_gt_ind', 'act' + (i + 1));
        if (e.act[i] > actions) err('hh_act_gt_actions', 'act' + (i + 1));
        if (e.ind[i] - e.act[i] > e.missed) err('hh_missed_mismatch', 'act' + (i + 1));
      }

  // Group entries by period + area after filtering. Rows sorted newest period first.
  function hhGroup(entries, filter, threshold) {
    filter = filter || {};
    var sel = entries.filter(function (e) {
      if (filter.area && e.area !== filter.area) return false;
      if (filter.from && e.period < filter.from) return false;
      if (filter.to && e.period > filter.to) return false;
      return true;
    });
    var keys = {}, order = [];
    sel.forEach(function (e) {
      var k = e.period + '|' + e.area;
      if (!keys[k]) { keys[k] = []; order.push(k); }
      keys[k].push(e);
    });
    order.sort(function (a, b) { var pa = a.split('|'), pb = b.split('|'); return pa[0] < pb[0] ? 1 : pa[0] > pb[0] ? -1 : (pa[1] < pb[1] ? -1 : pa[1] > pb[1] ? 1 : 0); });
    var rows = order.map(function (k) {
      var s = hhSum(keys[k]), p = k.split('|');
      s.period = p[0]; s.area = p[1]; s.small = s.opp > 0 && s.opp < (threshold || 0);
      return s;
    });
    var total = hhSum(sel);
    total.small = total.opp > 0 && total.opp < (threshold || 0);
    return { rows: rows, total: total, entries: sel };
  }

  /* ==========================================================================
     STOCK
     Balances are derived by replaying transactions in date order (stable for same date).
     Usable stock = positive balances of batches that have no expiry date or expire today or later.
     ========================================================================== */
  function itemTxns(txns, itemId) {
    var list = [];
    txns.forEach(function (t, i) { if (t.itemId === itemId) list.push({ t: t, i: i }); });
    list.sort(function (a, b) { return a.t.date < b.t.date ? -1 : a.t.date > b.t.date ? 1 : a.i - b.i; });
    return list.map(function (x) { return x.t; });
  }
  function itemBatches(txns, itemId, throughDate) {
    var map = {}, order = [], negative = false;
    itemTxns(txns, itemId).forEach(function (t) {
      if (throughDate && t.date > throughDate) return;
      var k = t.batch + '|' + t.expiry;
      if (!map[k]) { map[k] = { batch: t.batch, expiry: t.expiry, qty: 0, lastCount: null }; order.push(k); }
      var b = map[k];
      if (t.type === 'receipt') b.qty += t.qty;
      else if (t.type === 'issue') b.qty -= t.qty;
      else if (t.type === 'adjust') b.qty += t.qty;
      else if (t.type === 'count') { b.qty = t.qty; b.lastCount = t.date; }
      if (b.qty < 0) negative = true;

  }
  function isExpired(batch, today) { return !!batch.expiry && batch.expiry < today; }
  // Usable batches, earliest expiry first (no-expiry batches last): first-expiry, first-out.
  function usableBatchesFEFO(batches, today) {
    return batches.filter(function (b) { return b.qty > 0 && !isExpired(b, today); })
      .sort(function (a, b) {
        if (!a.expiry && !b.expiry) return 0;
        if (!a.expiry) return 1; if (!b.expiry) return -1;
        return a.expiry < b.expiry ? -1 : a.expiry > b.expiry ? 1 : 0;
      });
  }
  function itemWindow(item, settings) { return isInt(item.alertDays) ? item.alertDays : settings.expiryWindowDays; }

  function stockStatus(item, txns, settings, today) {
    var batches = itemBatches(txns, item.id);
    var usable = usableBatchesFEFO(batches, today);
    var windowDays = itemWindow(item, settings), limit = addDays(today, windowDays);
    var expiredBatches = batches.filter(function (b) { return b.qty > 0 && isExpired(b, today); });
    var expiring = usable.filter(function (b) { return b.expiry && b.expiry <= limit; });
    var s = {
      item: item, batches: batches, usableBatches: usable, expiredBatches: expiredBatches, expiringBatches: expiring,
      usable: usable.reduce(function (a, b) { return a + b.qty; }, 0),
      expired: expiredBatches.reduce(function (a, b) { return a + b.qty; }, 0),
      expiringQty: expiring.reduce(function (a, b) { return a + b.qty; }, 0),
      earliest: usable.length ? usable[0] : null,
      windowDays: windowDays,
      lastCount: batches.reduce(function (a, b) { return b.lastCount && (!a || b.lastCount > a) ? b.lastCount : a; }, null)
    };
    s.stockout = s.usable === 0;
    s.low = !s.stockout && s.usable <= item.reorderPoint;
    s.expiringSoon = expiring.length > 0;
    s.hasExpired = s.expired > 0;
    s.code = s.stockout ? 'stockout' : s.low ? 'low' : s.expiringSoon ? 'expiring' : 'ok';
    return s;
  }
  function allStockStatus(data, today) {
    return data.stock.items.filter(function (i) { return i.active !== false; })
      .map(function (i) { return stockStatus(i, data.stock.txns, data.settings, today); });
  }

  // Plan an issue across usable batches, earliest expiry first.
  function planIssue(batches, qty, today) {
    var usable = usableBatchesFEFO(batches, today), left = qty, alloc = [];
    var available = usable.reduce(function (a, b) { return a + b.qty; }, 0);
    for (var i = 0; i < usable.length && left > 0; i++) {
      var take = Math.min(left, usable[i].qty);
      alloc.push({ batch: usable[i].batch, expiry: usable[i].expiry, qty: take });
      left -= take;
    }
    return { ok: left === 0 && qty > 0, allocations: alloc, available: available };
  }

  function validateItem(item, data) {
    var errs = [];
    function err(code, field) { errs.push({ code: code, field: field }); }
    if (typeof item.name !== 'string' || !item.name.trim() || item.name.length > 50 || BAD_TEXT_RE.test(item.name)) err('item_name', 'name');
    else if (data.stock.items.some(function (o) { return o.id !== item.id && o.name.trim().toLowerCase() === item.name.trim().toLowerCase(); })) err('item_dup', 'name');
    if (typeof item.unit !== 'string' || !item.unit.trim() || item.unit.length > 30 || BAD_TEXT_RE.test(item.unit)) err('item_unit', 'unit');
    if (!isNonNegInt(item.reorderPoint, MAX_QTY)) err('item_reorder', 'reorderPoint');
    if (typeof item.tracksExpiry !== 'boolean') err('item_track', 'tracksExpiry');
    if (item.alertDays !== null && !(isInt(item.alertDays) && item.alertDays >= 1 && item.alertDays <= 730)) err('item_alert', 'alertDays');
    if (typeof item.active !== 'boolean') err('item_active', 'active');
    var old = data.stock.items.filter(function (o) { return o.id === item.id; })[0];
    if (old && data.stock.txns.some(function (t) { return t.itemId === item.id; })) {
      if (old.unit !== item.unit) err('item_unit_locked', 'unit');          // one consistent unit per item
      if (old.tracksExpiry !== item.tracksExpiry) err('item_track_locked', 'tracksExpiry');
    }
    return errs;
  }

  // Validate one stock transaction against the current data (txns other than itself).
  function validateTxn(t, data, today) {
    var errs = [];
    function err(code, field) { errs.push({ code: code, field: field }); }
    var item = data.stock.items.filter(function (i) { return i.id === t.itemId; })[0];
    if (!item) { err('txn_item', 'itemId'); return errs; }
    if (TXN_TYPES.indexOf(t.type) < 0) err('txn_type', 'type');
    if (!isValidDate(t.date)) err('txn_date', 'date');
    else if (today && t.date > today) err('txn_future', 'date');
    if (!isInt(t.qty) || Math.abs(t.qty) > MAX_QTY) err('txn_qty', 'qty');
    if (item.tracksExpiry) {
      if (!isValidDate(t.expiry)) err('txn_expiry', 'expiry');
      if (t.batch !== '' && !BATCH_RE.test(t.batch)) err('txn_batch', 'batch');
    } else if (t.batch !== '' || t.expiry !== '') err('txn_no_batch', 'batch');
    if (t.area !== '' && data.settings.areaCodes.indexOf(t.area) < 0) err('txn_area', 'area');
    if (errs.length) return errs;
    if (t.type === 'adjust') {
      if (!Object.prototype.hasOwnProperty.call(ADJUST_REASONS, t.reason)) err('txn_reason', 'reason');
      else {

      }
    } else {
      if (t.reason !== '') err('txn_reason', 'reason');
      if (t.type === 'count' ? t.qty < 0 : t.qty <= 0) err('txn_qty', 'qty');
    }
    if (t.type === 'receipt' && t.expiry && t.expiry < t.date) err('txn_receive_expired', 'expiry');
    if (t.type === 'issue' && t.expiry && t.expiry < t.date) err('txn_issue_expired', 'expiry');
    if (t.type !== 'issue' && t.area !== '') err('txn_area', 'area');
    if (errs.length) return errs;
    // Simulate: no batch may ever go below zero.
    var sim = data.stock.txns.filter(function (o) { return o.id !== t.id; }).concat([t]);
    if (itemBatches(sim, t.itemId).negative) err('txn_insufficient', 'qty');
    return errs;
  }

  /* ==========================================================================
     STRICT DATA VALIDATION (used before any restore replaces data)
     Unknown fields are rejected. Users must keep identifiers out of permitted text fields.
     ========================================================================== */
  function keysExactly(obj, allowed, path, errs) {
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) { errs.push(path + ': not an object'); return false; }
    Object.keys(obj).forEach(function (k) { if (allowed.indexOf(k) < 0) errs.push(path + ': unexpected field "' + String(k).slice(0, 30) + '"'); });
    allowed.forEach(function (k) { if (!Object.prototype.hasOwnProperty.call(obj, k)) errs.push(path + ': missing field "' + k + '"'); });
    return true;
  }
  function validateData(d) {
    var errs = [];
    if (!keysExactly(d, ['schema', 'settings', 'hh', 'stock', 'meta'], 'data', errs)) return errs;
    if (d.schema !== SCHEMA_VERSION) errs.push('data.schema: unsupported version');
    var s = d.settings;
    if (keysExactly(s, ['facilityLabel', 'areaCodes', 'smallSampleThreshold', 'expiryWindowDays', 'language'], 'settings', errs)) {
      if (typeof s.facilityLabel !== 'string' || s.facilityLabel.length > 40 || BAD_TEXT_RE.test(s.facilityLabel)) errs.push('settings.facilityLabel: invalid');
      if (!Array.isArray(s.areaCodes) || s.areaCodes.length > 40) errs.push('settings.areaCodes: invalid');
      else s.areaCodes.forEach(function (c, i) {
        if (typeof c !== 'string' || !AREA_CODE_RE.test(c)) errs.push('settings.areaCodes[' + i + ']: invalid code');
        else if (s.areaCodes.indexOf(c) !== i) errs.push('settings.areaCodes[' + i + ']: duplicate');
      });
      if (!(isInt(s.smallSampleThreshold) && s.smallSampleThreshold >= 0 && s.smallSampleThreshold <= 10000)) errs.push('settings.smallSampleThreshold: invalid');
      if (!(isInt(s.expiryWindowDays) && s.expiryWindowDays >= 1 && s.expiryWindowDays <= 730)) errs.push('settings.expiryWindowDays: invalid');
      if (typeof s.language !== 'string' || !LANG_RE.test(s.language)) errs.push('settings.language: invalid');
    }
    if (keysExactly(d.meta, ['lastBackupAt', 'nextId'], 'meta', errs)) {
      if (d.meta.lastBackupAt !== null && (typeof d.meta.lastBackupAt !== 'string' || isNaN(Date.parse(d.meta.lastBackupAt)))) errs.push('meta.lastBackupAt: invalid');
      if (!(isInt(d.meta.nextId) && d.meta.nextId >= 1)) errs.push('meta.nextId: invalid');
    }
    if (errs.length) return errs;
    var ids = {};
    function checkId(id, path) {
      if (typeof id !== 'string' || !/^[a-z]\d{1,9}$/.test(id)) { errs.push(path + '.id: invalid'); return; }
      if (ids[id]) errs.push(path + '.id: duplicate'); ids[id] = true;
      if (+id.slice(1) >= d.meta.nextId) errs.push(path + '.id: not below meta.nextId');
    }
    if (keysExactly(d.hh, ['entries', 'draft'], 'hh', errs)) {
      if (!Array.isArray(d.hh.entries)) errs.push('hh.entries: not a list');
      else d.hh.entries.forEach(function (e, i) {
        var p = 'hh.entries[' + i + ']';
        if (!keysExactly(e, ['id', 'period', 'area', 'source', 'rub', 'wash', 'missed', 'ind', 'act'], p, errs)) return;
        checkId(e.id, p);
        if (['tally', 'paper'].indexOf(e.source) < 0) errs.push(p + '.source: invalid');
        validateHHEntry(e, s).forEach(function (x) { errs.push(p + ': ' + x.code + (x.field ? ' (' + x.field + ')' : '')); });
      });
      if (d.hh.draft !== null) {
        var dr = d.hh.draft;
        if (keysExactly(dr, ['period', 'area', 'rub', 'wash', 'missed', 'ind', 'act', 'last'], 'hh.draft', errs)) {
          var tmp = { period: dr.period, area: dr.area, rub: dr.rub, wash: dr.wash, missed: dr.missed, ind: dr.ind, act: dr.act };
          validateHHEntry(tmp, s).filter(function (x) { return x.code !== 'hh_zero'; })
            .forEach(function (x) { errs.push('hh.draft: ' + x.code); });
          if (dr.last !== null) {
            if (keysExactly(dr.last, ['moments', 'outcome'], 'hh.draft.last', errs)) {
              if (!Array.isArray(dr.last.moments) || !dr.last.moments.length || dr.last.moments.some(function (m) { return [1, 2, 3, 4, 5].indexOf(m) < 0; })) errs.push('hh.draft.last.moments: invalid');
              if (['rub', 'wash', 'missed'].indexOf(dr.last.outcome) < 0) errs.push('hh.draft.last.outcome: invalid');
            }
          }
        }
      }
    }
    if (keysExactly(d.stock, ['items', 'txns'], 'stock', errs)) {
      if (!Array.isArray(d.stock.items) || !Array.isArray(d.stock.txns)) { errs.push('stock: items/txns must be lists'); return errs; }
      var shadow = { settings: s, stock: { items: [], txns: [] } };
      d.stock.items.forEach(function (it, i) {
        var p = 'stock.items[' + i + ']';
        if (!keysExactly(it, ['id', 'name', 'unit', 'reorderPoint', 'tracksExpiry', 'alertDays', 'active'], p, errs)) return;
        checkId(it.id, p);
        validateItem(it, shadow).forEach(function (x) { errs.push(p + ': ' + x.code); });
        shadow.stock.items.push(it);
      });
      d.stock.txns.forEach(function (t, i) {

        checkId(t.id, p);

        validateTxn(t, shadow, null).forEach(function (x) { errs.push(p + ': ' + x.code); });

    return errs.slice(0, 50);
  }

  /* ---------- backup files ---------- */
  function makeBackup(data, mode, nowIso) {
    return {
      format: BACKUP_FORMAT,
      formatVersion: SCHEMA_VERSION,
      appVersion: APP_VERSION,
      createdAt: nowIso,
      mode: mode,
      checksum: crc32(JSON.stringify(data)),
      data: data
    };
  }
  function backupFileName(nowDate, mode) {
    var d = nowDate;
    return 'ipc-kit-backup_' + (mode === 'practice' ? 'PRACTICE_' : '') + isoDate(d) + '_' + pad2(d.getHours()) + pad2(d.getMinutes()) + '_v' + SCHEMA_VERSION + '.json';
  }
  // Parse and fully validate a backup file. Never modifies anything.
  function parseBackup(text) {
    var res = { ok: false, errors: [], backup: null, summary: null };
    if (typeof text !== 'string' || !text.trim()) { res.errors.push('empty'); return res; }
    if (text.length > MAX_BACKUP_BYTES) { res.errors.push('too_large'); return res; }
    var b;
    try { b = JSON.parse(text); } catch (e) { res.errors.push('not_json'); return res; }
    if (!b || typeof b !== 'object' || b.format !== BACKUP_FORMAT) { res.errors.push('not_backup'); return res; }
    if (!isInt(b.formatVersion) || b.formatVersion < 1) { res.errors.push('not_backup'); return res; }
    if (b.formatVersion > SCHEMA_VERSION) { res.errors.push('newer_version'); return res; }
    var allowedTop = ['format', 'formatVersion', 'appVersion', 'createdAt', 'mode', 'checksum', 'data'];
    Object.keys(b).forEach(function (k) { if (allowedTop.indexOf(k) < 0) res.errors.push('unexpected field "' + String(k).slice(0, 30) + '"'); });
    if (['real', 'practice'].indexOf(b.mode) < 0) res.errors.push('bad_mode');
    if (typeof b.createdAt !== 'string' || isNaN(Date.parse(b.createdAt))) res.errors.push('bad_date');
    if (!b.data || typeof b.data !== 'object') { res.errors.push('no_data'); return res; }
    if (typeof b.checksum !== 'string' || crc32(JSON.stringify(b.data)) !== b.checksum) res.errors.push('checksum');

    var dataErrs = validateData(b.data);
    if (dataErrs.length) { res.errors = res.errors.concat(dataErrs); return res; }
    res.ok = true; res.backup = b;
    res.summary = {
      createdAt: b.createdAt, mode: b.mode, appVersion: String(b.appVersion || ''),
      entries: b.data.hh.entries.length, opp: hhSum(b.data.hh.entries).opp,
      items: b.data.stock.items.length, txns: b.data.stock.txns.length, areas: b.data.settings.areaCodes.length
    };
    return res;
  }

  /* ---------- CSV (aggregate report export) ---------- */
  function csvCell(v) {

  }

  var HH_CSV_HEADER = ['period', 'area', 'sessions', 'opportunities', 'hand_rub', 'handwash', 'missed', 'actions',
    'adherence_percent', 'small_sample', 'moment_data_opportunities',
    'm1_indications', 'm1_actions', 'm2_indications', 'm2_actions', 'm3_indications', 'm3_actions',
    'm4_indications', 'm4_actions', 'm5_indications', 'm5_actions'];
  function hhRowCSV(r, period, area) {

  }

<script id="ipc-embedded-kit">
window.IPC_EMBEDDED_KIT = {"order":["field-kit/index.html","field-kit/quick-start.html","field-kit/hand-hygiene-observation-sheet.html","field-kit/stock-card-and-count-sheet.html","field-kit/readiness-checklist.html","field-kit/review-routine-and-action-log.html","field-kit/practice-scenarios.html","field-kit/data-handling-plan.html","field-kit/ipc-lead-review-and-pilot-checklist.html","evidence/evidence-register.html","docs/DEVICE-TESTING.md","docs/TRANSLATING.md"],"docs":{"field-kit/index.html":{"id":"field-kit/index.html","slug":"index","label":"Field kit index (all 8 sheets)","title":"Printable Field Kit Index – IPC Starter Kit v1.0.0","kind":"html","inAllSheets":false,"scopeClass":"fk-sheet-index","scopedCss":"@page { size: auto; margin: 12mm; }\n.fk-sheet-index, .fk-sheet-index * { box-sizing: border-box; }\n.fk-sheet-index { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n      color: #000;\n      background: #fff;\n      margin: 0;\n      padding: 12px;\n      font-size: 13px;\n      line-height: 1.4; }\n.fk-sheet-index .page { max-width: 190mm;\n      margin: 0 auto; }\n.fk-sheet-index .nav-bar { margin-bottom: 8px;\n      padding-bottom: 5px;\n      border-bottom: 1px solid #444;\n      font-size: 12px; }\n.fk-sheet-index .nav-bar a { color: #000; text-decoration: underline; margin-right: 14px; }\n.fk-sheet-index h1 { font-size: 20px;\n      margin: 0 0 6px 0;\n      border-bottom: 2px solid #000;\n      padding-bottom: 4px; }\n.fk-sheet-index .privacy-banner { border: 1.5px solid #000;\n      padding: 5px 8px;\n      font-weight: bold;\n      background: #f4f4f4;\n      margin-bottom: 10px; }\n.fk-sheet-index table { width: 100%;\n      border-collapse: collapse;\n      margin-bottom: 12px; }\n.fk-sheet-index th, .fk-sheet-index td { border: 1px solid #000;\n      padding: 6px 8px;\n      text-align: left;\n      vertical-align: top; }\n.fk-sheet-index th { background: #eee; }\n.fk-sheet-index td a { color: #000;\n      font-weight: bold;\n      text-decoration: underline; }\n.fk-sheet-index .ev { font-size: 10.5px; color: #222; }\n.fk-sheet-index footer { margin-top: 12px;\n      padding-top: 6px;\n      border-top: 1px solid #000;\n      font-size: 11px;\n      text-align: center; }\n.fk-sheet-index footer a { color: #000; }\n@media print {\n  .fk-sheet-index { padding: 0; font-size: 11.5px; }\n  .fk-sheet-index .nav-bar { display: none; }\n  .fk-sheet-index .page { max-width: 100%; }\n}","bodyHtml":"<div class=\"page\">\n    <div class=\"nav-bar\">\n      <a href=\"../ipc-kit.html\">Open App (ipc-kit.html)<\/a>\n      <a href=\"../evidence/evidence-register.html\">Evidence Register<\/a>\n      <a href=\"../docs/DEVICE-TESTING.md\">Device Testing Guide<\/a>\n      <a href=\"../docs/TRANSLATING.md\">Translation Guide<\/a>\n    <\/div>\n\n    <h1>IPC Starter Kit – Printable Field Kit Index<\/h1>\n    <p>\n      All sheets below work without internet and print cleanly in black-and-white on both <strong>A4<\/strong> and <strong>US Letter<\/strong> paper (<code>Ctrl+P<\/code> or <code>Cmd+P<\/code>). Use them alongside <a href=\"../ipc-kit.html\">ipc-kit.html<\/a> or as a standalone paper kit if a device cannot run the browser app.\n    <\/p>\n    <p style=\"font-size:12px;margin:4px 0 8px\">\n      <strong>Android / LineageOS note:<\/strong> If tapping links here fails with <code>ERR_FILE_NOT_FOUND<\/code> (Android <code>content://<\/code> file openers allow only one file at a time), either open <code>ipc-kit.html<\/code> (which includes all 8 printable sheets &amp; guides built inside the app) or open <a href=\"ALL-PRINTABLE-SHEETS.html\"><code>ALL-PRINTABLE-SHEETS.html<\/code><\/a> directly from your Files app.\n    <\/p>\n\n    <div class=\"privacy-banner\">\n      Privacy Rule across all sheets: Do not write names, ID numbers or clinical details on this sheet. Always use a ROLE (for example, <em>Ward in-charge<\/em> or <em>IPC focal person<\/em>), never a person's name <span class=\"ev\">[HH-10, PR-02, PR-03]<\/span>.\n    <\/div>\n\n    <table>\n      <thead>\n        <tr>\n          <th style=\"width: 30%;\">Sheet<\/th>\n          <th style=\"width: 42%;\">One-line description<\/th>\n          <th style=\"width: 28%;\">Print hint<\/th>\n        <\/tr>\n      <\/thead>\n      <tbody>\n        <tr>\n          <td>0. <a href=\"ALL-PRINTABLE-SHEETS.html\">All 8 Printable Sheets Combined<\/a><br><code>ALL-PRINTABLE-SHEETS.html<\/code><\/td>\n          <td>Single self-contained file containing all 8 sheets below with same-page navigation (recommended if Android blocks links between files).<\/td>\n          <td>Print full kit packet in one job (~10 pages total) or select page ranges.<\/td>\n        <\/tr>\n        <tr>\n          <td>1. <a href=\"quick-start.html\">Quick Start Guide<\/a><br><code>quick-start.html<\/code><\/td>\n          <td>One-page overview of what the kit is, privacy rules, how to open the app, the 5-minute practice run, and everyday routines.<\/td>\n          <td>Print 1 copy per care area and post near the computer or IPC binder (1 page).<\/td>\n        <\/tr>\n        <tr>\n          <td>2. <a href=\"hand-hygiene-observation-sheet.html\">Hand Hygiene Observation Sheet<\/a><br><code>hand-hygiene-observation-sheet.html<\/code><\/td>\n          <td>One-page tally form with 20 opportunity rows, moments M1–M5, outcome checkboxes, and session totals for app entry <span class=\"ev\">[HH-01..HH-08]<\/span>.<\/td>\n          <td>Print 1 sheet per 20-minute observation session (fits on 1 page).<\/td>\n        <\/tr>\n        <tr>\n          <td>3. <a href=\"stock-card-and-count-sheet.html\">Stock Card &amp; Physical Count Sheet<\/a><br><code>stock-card-and-count-sheet.html<\/code><\/td>\n          <td>Page 1 tracks receipts, issues, counts, and adjustments for a single IPC supply item; Page 2 records monthly shelf counts <span class=\"ev\">[ST-01..ST-10]<\/span>.<\/td>\n          <td>Print 2-sided or as 2 separate pages; keep 1 Page-1 card per supply item in the store.<\/td>\n        <\/tr>\n        <tr>\n          <td>4. <a href=\"readiness-checklist.html\">IPC Area Readiness Checklist<\/a><br><code>readiness-checklist.html<\/code><\/td>\n          <td>One-page monthly walkthrough checking water, soap/handwashing, hand rub, cleaning supplies, and waste/sharps safety <span class=\"ev\">[RC-01..RC-06]<\/span>.<\/td>\n          <td>Print 1 copy per clinical area each month (fits on 1 page).<\/td>\n        <\/tr>\n        <tr>\n          <td>5. <a href=\"review-routine-and-action-log.html\">Monthly Review Routine &amp; Action Log<\/a><br><code>review-routine-and-action-log.html<\/code><\/td>\n          <td>Step-by-step agenda for a 30-minute no-blame monthly review plus a corrective action log assigned by role and due date <span class=\"ev\">[HH-12, RC-06, IPC-01]<\/span>.<\/td>\n          <td>Print 1 copy per monthly review meeting and file in the IPC binder (1 page).<\/td>\n        <\/tr>\n        <tr>\n          <td>6. <a href=\"practice-scenarios.html\">Hand Hygiene Practice Scenarios<\/a><br><code>practice-scenarios.html<\/code><\/td>\n          <td>Group-training worksheet with 6 hand hygiene and data interpretation scenarios on Page 1 and the trainer answer key on Page 2 <span class=\"ev\">[HH-09]<\/span>.<\/td>\n          <td>Print Page 1 for trainees and Page 2 for the trainer (2 pages).<\/td>\n        <\/tr>\n        <tr>\n          <td>7. <a href=\"data-handling-plan.html\">Facility Data-Handling Plan<\/a><br><code>data-handling-plan.html<\/code><\/td>\n          <td>Fill-in stewardship form covering approved devices, fixed folder path, backups, PIN lock, retention, and small-group review <span class=\"ev\">[PR-01..PR-03]<\/span>.<\/td>\n          <td>Print 1 copy for the facility, complete before real use, and keep signed in the IPC binder (1 page).<\/td>\n        <\/tr>\n        <tr>\n          <td>8. <a href=\"ipc-lead-review-and-pilot-checklist.html\">IPC Lead Review &amp; Pilot Checklist<\/a><br><code>ipc-lead-review-and-pilot-checklist.html<\/code><\/td>\n          <td>Part A pre-launch review (including mandatory source citation verification) and Part B 2–4 week pilot checklist with Go/No-Go criteria <span class=\"ev\">[IPC-02]<\/span>.<\/td>\n          <td>Print 1 copy before launching the kit in your facility (1 page).<\/td>\n        <\/tr>\n      <\/tbody>\n    <\/table>\n\n    <footer>\n      IPC Starter Kit v1.0.0 · Original text © 2026 @mostafase · <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\">CC BY-NC-SA 4.0<\/a> · Sources: see evidence register (<a href=\"../evidence/evidence-register.html\">evidence/evidence-register.html<\/a>)\n    <\/footer>\n  <\/div>"},"field-kit/quick-start.html":{"id":"field-kit/quick-start.html","slug":"quick-start","label":"1. One-page quick start","title":"Quick Start Guide – IPC Starter Kit v1.0.0","kind":"html","inAllSheets":true,"scopeClass":"fk-sheet-quick-start","scopedCss":"@page { size: auto; margin: 12mm; }\n.fk-sheet-quick-start, .fk-sheet-quick-start * { box-sizing: border-box; }\n.fk-sheet-quick-start { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n      color: #000;\n      background: #fff;\n      margin: 0;\n      padding: 8px;\n      font-size: 12.5px;\n      line-height: 1.35; }\n.fk-sheet-quick-start .page { max-width: 190mm;\n      margin: 0 auto; }\n.fk-sheet-quick-start .nav-bar { margin-bottom: 6px;\n      padding-bottom: 4px;\n      border-bottom: 1px solid #444;\n      font-size: 11.5px; }\n.fk-sheet-quick-start .nav-bar a { color: #000; text-decoration: underline; margin-right: 12px; }\n.fk-sheet-quick-start h1 { font-size: 18px;\n      margin: 0 0 4px 0;\n      padding-bottom: 3px;\n      border-bottom: 2px solid #000; }\n.fk-sheet-quick-start h2 { font-size: 13.5px;\n      margin: 7px 0 3px 0;\n      text-transform: uppercase;\n      letter-spacing: 0.3px; }\n.fk-sheet-quick-start p, .fk-sheet-quick-start ul, .fk-sheet-quick-start ol { margin: 3px 0; }\n.fk-sheet-quick-start ul, .fk-sheet-quick-start ol { padding-left: 18px; }\n.fk-sheet-quick-start li { margin-bottom: 2px; }\n.fk-sheet-quick-start .privacy-box { border: 2px solid #000;\n      padding: 5px 8px;\n      margin: 5px 0;\n      background: #f8f8f8;\n      page-break-inside: avoid;\n      break-inside: avoid; }\n.fk-sheet-quick-start .privacy-box strong { display: block;\n      font-size: 13px;\n      margin-bottom: 2px; }\n.fk-sheet-quick-start .grid-2 { display: flex;\n      gap: 10px;\n      flex-wrap: wrap; }\n.fk-sheet-quick-start .col { flex: 1 1 250px;\n      border: 1px solid #000;\n      padding: 6px 8px;\n      page-break-inside: avoid;\n      break-inside: avoid; }\n.fk-sheet-quick-start .cb { display: inline-block;\n      width: 5.2mm;\n      height: 5.2mm;\n      border: 1.5px solid #000;\n      vertical-align: middle;\n      margin-right: 4px;\n      background: #fff; }\n.fk-sheet-quick-start .badge { display: inline-block;\n      border: 1px solid #000;\n      padding: 0 4px;\n      font-weight: bold;\n      font-size: 11px; }\n.fk-sheet-quick-start .ev { font-size: 10px;\n      font-weight: normal;\n      color: #222; }\n.fk-sheet-quick-start footer { margin-top: 8px;\n      padding-top: 4px;\n      border-top: 1px solid #000;\n      font-size: 10.5px;\n      text-align: center; }\n.fk-sheet-quick-start footer a { color: #000; }\n@media print {\n  .fk-sheet-quick-start { padding: 0; font-size: 11.5px; line-height: 1.28; }\n  .fk-sheet-quick-start .nav-bar { display: none; }\n  .fk-sheet-quick-start .page { max-width: 100%; }\n}","bodyHtml":"<div class=\"page\">\n    <div class=\"nav-bar\">\n      <a href=\"index.html\">← Field Kit Index<\/a>\n      <a href=\"../ipc-kit.html\">Open App (ipc-kit.html)<\/a>\n      <a href=\"../evidence/evidence-register.html\">Evidence Register<\/a>\n    <\/div>\n\n    <h1>IPC Starter Kit – One-Page Quick Start<\/h1>\n    <p>\n      <strong>What this kit is:<\/strong> A free, fully offline starter kit for infection prevention and control (IPC) in clinics and hospital wards <span class=\"ev\">[IPC-01, IPC-03]<\/span>. It includes a one-file browser app (<code>ipc-kit.html<\/code>) and printable paper sheets for hand hygiene observation, IPC supply stock tracking, readiness checks, and a 30-minute monthly review.\n    <\/p>\n\n    <div class=\"privacy-box\">\n      <strong>Privacy Rule: Do not write names, ID numbers or clinical details on this sheet.<\/strong>\n      Never record patient or staff names, ID numbers, clinical details, photos, or free-text observation notes on paper or in the app <span class=\"ev\">[HH-10, PR-02, PR-03]<\/span>. The app saves only grouped counts by <strong>MONTH<\/strong> and <strong>AREA CODE<\/strong>. Where a responsible person is needed, always write a <strong>ROLE<\/strong> (for example, <em>Ward in-charge<\/em> or <em>IPC focal person<\/em>), never a person's name <span class=\"ev\">[RC-06]<\/span>.\n    <\/div>\n\n    <div class=\"grid-2\">\n      <div class=\"col\">\n        <h2>1. How to Open the App<\/h2>\n        <ul>\n          <li><strong>Desktop (Windows, macOS, Linux):<\/strong> Double-click <code>ipc-kit.html<\/code>. No install, no internet, no account, and no admin rights are needed. Keep the folder in one fixed place.<\/li>\n          <li><strong>Where data lives:<\/strong> Data is saved only in that browser on that device (browser local storage). Clearing browser data, switching browsers, or moving the file shows an empty dataset—use backup files to keep records safe.<\/li>\n          <li><strong>Top bar checks:<\/strong> Check the mode badge (<span class=\"badge\">PRACTICE – fictional data<\/span> or <span class=\"badge\">REAL DATA<\/span>) and save status (<span class=\"badge\">✔ Saved on this device 14:05<\/span> or <span class=\"badge\">⚠ Not saved<\/span>).<\/li>\n          <li><strong>Android / iPhone / iPad:<\/strong> Unzip first and open <code>ipc-kit.html<\/code> directly in Chrome/Firefox (avoid Jelly WebView or tapping cross-file links under <code>content://<\/code>, which cause <code>ERR_FILE_NOT_FOUND<\/code>). All printable sheets are built inside <code>ipc-kit.html<\/code> (and <code>field-kit/ALL-PRINTABLE-SHEETS.html<\/code>). Run <code>Settings &gt; Check this device<\/code>; if saving fails or on iPhone/iPad Safari, use paper forms.<\/li>\n        <\/ul>\n      <\/div>\n\n      <div class=\"col\">\n        <h2>2. First Launch &amp; 5-Minute Practice Run<\/h2>\n        <p>On first launch, choose <strong>Try a 5-minute practice run<\/strong> (uses fictional data kept separate from real data) or <strong>Set up for real use<\/strong> (enter facility-approved area codes first, such as <code>OPD<\/code>, <code>MAT<\/code>, <code>WARD-A<\/code>; capital letters, numbers, or dash, up to 12 characters).<\/p>\n        <p><strong>5-minute practice checklist on the Home tab:<\/strong><\/p>\n        <ol>\n          <li><span class=\"cb\"><\/span>Answer the 6 practice questions (~2 min) <span class=\"ev\">[HH-09]<\/span>.<\/li>\n          <li><span class=\"cb\"><\/span>Tally 3 opportunities, including one with two moments at the same time (~1 min) <span class=\"ev\">[HH-01, HH-02]<\/span>.<\/li>\n          <li><span class=\"cb\"><\/span>Finish the session and read the result (~30 s) <span class=\"ev\">[HH-03, HH-06]<\/span>.<\/li>\n          <li><span class=\"cb\"><\/span>Record one stock issue and look at the alerts (~1 min) <span class=\"ev\">[ST-06, ST-07]<\/span>.<\/li>\n          <li><span class=\"cb\"><\/span>Make a backup file (~30 s).<\/li>\n        <\/ol>\n      <\/div>\n    <\/div>\n\n    <h2>3. Everyday Use (App Tabs: Home · Hand hygiene · Stock · Reports · Backup · Settings)<\/h2>\n    <ul>\n      <li><strong>Hand hygiene (weekly sessions of ~20 min) <span class=\"ev\">[HH-08]<\/span>:<\/strong> Use <code>Hand hygiene &gt; Tally<\/code> (pick Month and Area code, tick all moments 1–5 that apply, tap one outcome: <em>Hand rub<\/em>, <em>Handwash<\/em>, or <em>Missed<\/em>; use <em>Undo last<\/em> to fix a tap, then <em>Finish session and add to totals<\/em>) OR observe on the paper sheet (<code>hand-hygiene-observation-sheet.html<\/code>) and enter totals in <code>Hand hygiene &gt; Paper totals<\/code> <span class=\"ev\">[HH-01..HH-06]<\/span>.<\/li>\n      <li><strong>Stock (as supplies move + monthly count):<\/strong> Check <code>Stock &gt; Status<\/code> to see usable stock, stockouts, items at/below reorder point, items expiring within the alert window (default 90 days), and expired stock to remove. The earliest-expiring usable batch is marked <em>Use first<\/em> <span class=\"ev\">[ST-02, ST-03, ST-07..ST-10]<\/span>. Record movements in <code>Stock &gt; Record<\/code> (<em>Receipt<\/em>, <em>Issue<\/em>, <em>Physical count<\/em>, or <em>Adjustment<\/em> with reason code) or on <code>stock-card-and-count-sheet.html<\/code> <span class=\"ev\">[ST-01, ST-04..ST-06]<\/span>.<\/li>\n      <li><strong>Weekly backup:<\/strong> Open <code>Backup<\/code> and click <strong>Download backup file<\/strong> (saves <code>ipc-kit-backup_YYYY-MM-DD_HHMM_v1.json<\/code>; practice files include <code>PRACTICE<\/code>). Copy it to the approved backup location in your facility's Data-Handling Plan <span class=\"ev\">[PR-01]<\/span>. If file download fails on your device, use <strong>Show backup text<\/strong> and <strong>Paste backup text<\/strong>.<\/li>\n      <li><strong>Monthly review (30 minutes):<\/strong> Open <code>Reports<\/code> to print or download CSV reports (review any small groups before sharing). Meet using <code>review-routine-and-action-log.html<\/code> and check area readiness with <code>readiness-checklist.html<\/code> <span class=\"ev\">[HH-12, RC-01..RC-06, IPC-01]<\/span>.<\/li>\n    <\/ul>\n\n    <h2>4. Where to Get Help<\/h2>\n    <p>\n      Ask your facility's <strong>IPC focal person<\/strong> or <strong>Ward in-charge<\/strong> <span class=\"ev\">[IPC-02]<\/span>. Before starting real data collection, the IPC focal person must complete <code>ipc-lead-review-and-pilot-checklist.html<\/code> and <code>data-handling-plan.html<\/code>.\n    <\/p>\n\n    <footer>\n      IPC Starter Kit v1.0.0 · Original text © 2026 @mostafase · <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\">CC BY-NC-SA 4.0<\/a> · Sources: see evidence register (<a href=\"../evidence/evidence-register.html\">evidence/evidence-register.html<\/a>)\n    <\/footer>\n  <\/div>"},"field-kit/hand-hygiene-observation-sheet.html":{"id":"field-kit/hand-hygiene-observation-sheet.html","slug":"hand-hygiene-observation-sheet","label":"2. Hand hygiene observation sheet","title":"Hand Hygiene Observation Sheet – IPC Starter Kit v1.0.0","kind":"html","inAllSheets":true,"scopeClass":"fk-sheet-hand-hygiene-observation-sheet","scopedCss":"@page { size: auto; margin: 12mm; }\n.fk-sheet-hand-hygiene-observation-sheet, .fk-sheet-hand-hygiene-observation-sheet * { box-sizing: border-box; }\n.fk-sheet-hand-hygiene-observation-sheet { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n      color: #000;\n      background: #fff;\n      margin: 0;\n      padding: 6px;\n      font-size: 11.5px;\n      line-height: 1.25; }\n.fk-sheet-hand-hygiene-observation-sheet .page { max-width: 190mm;\n      margin: 0 auto; }\n.fk-sheet-hand-hygiene-observation-sheet .nav-bar { margin-bottom: 5px;\n      padding-bottom: 3px;\n      border-bottom: 1px solid #444;\n      font-size: 11px; }\n.fk-sheet-hand-hygiene-observation-sheet .nav-bar a { color: #000; text-decoration: underline; margin-right: 12px; }\n.fk-sheet-hand-hygiene-observation-sheet .top-header { display: flex;\n      justify-content: space-between;\n      align-items: baseline;\n      border-bottom: 2px solid #000;\n      padding-bottom: 2px;\n      margin-bottom: 4px; }\n.fk-sheet-hand-hygiene-observation-sheet h1 { font-size: 16px; margin: 0; }\n.fk-sheet-hand-hygiene-observation-sheet .privacy-banner { border: 1.5px solid #000;\n      padding: 3px 6px;\n      font-weight: bold;\n      text-align: center;\n      background: #f4f4f4;\n      margin-bottom: 4px;\n      font-size: 11.5px; }\n.fk-sheet-hand-hygiene-observation-sheet .meta-row { display: flex;\n      gap: 8px;\n      margin-bottom: 4px;\n      flex-wrap: wrap; }\n.fk-sheet-hand-hygiene-observation-sheet .meta-box { border: 1px solid #000;\n      padding: 3px 6px;\n      flex: 1 1 120px;\n      font-weight: bold; }\n.fk-sheet-hand-hygiene-observation-sheet .meta-box span { font-weight: normal;\n      font-size: 10.5px;\n      display: block; }\n.fk-sheet-hand-hygiene-observation-sheet .howto { border: 1px solid #000;\n      padding: 3px 6px;\n      margin-bottom: 4px;\n      font-size: 10.5px; }\n.fk-sheet-hand-hygiene-observation-sheet table { width: 100%;\n      border-collapse: collapse;\n      margin-bottom: 4px; }\n.fk-sheet-hand-hygiene-observation-sheet th, .fk-sheet-hand-hygiene-observation-sheet td { border: 1px solid #000;\n      padding: 1.5px 4px;\n      text-align: center;\n      vertical-align: middle; }\n.fk-sheet-hand-hygiene-observation-sheet th { background: #eee;\n      font-size: 10.5px; }\n.fk-sheet-hand-hygiene-observation-sheet .cb { display: inline-block;\n      width: 5.2mm;\n      height: 5.2mm;\n      border: 1.5px solid #000;\n      vertical-align: middle;\n      background: #fff; }\n.fk-sheet-hand-hygiene-observation-sheet .lbl { font-size: 10px;\n      vertical-align: middle;\n      margin-left: 2px; }\n.fk-sheet-hand-hygiene-observation-sheet .bottom-grid { display: flex;\n      gap: 6px;\n      flex-wrap: wrap;\n      page-break-inside: avoid;\n      break-inside: avoid; }\n.fk-sheet-hand-hygiene-observation-sheet .bottom-col { flex: 1 1 180px;\n      border: 1px solid #000;\n      padding: 4px 6px; }\n.fk-sheet-hand-hygiene-observation-sheet .bottom-col h2 { font-size: 11.5px;\n      margin: 0 0 3px 0;\n      border-bottom: 1px solid #000;\n      padding-bottom: 2px; }\n.fk-sheet-hand-hygiene-observation-sheet .totals-table th, .fk-sheet-hand-hygiene-observation-sheet .totals-table td { padding: 2px 4px;\n      font-size: 10.5px; }\n.fk-sheet-hand-hygiene-observation-sheet .totals-table td.left { text-align: left; }\n.fk-sheet-hand-hygiene-observation-sheet .legend-list { margin: 2px 0;\n      padding-left: 15px;\n      font-size: 10.5px; }\n.fk-sheet-hand-hygiene-observation-sheet .legend-list li { margin-bottom: 1.5px; }\n.fk-sheet-hand-hygiene-observation-sheet .ev { font-size: 9.5px; font-weight: normal; color: #222; }\n.fk-sheet-hand-hygiene-observation-sheet footer { margin-top: 4px;\n      padding-top: 3px;\n      border-top: 1px solid #000;\n      font-size: 10px;\n      text-align: center; }\n.fk-sheet-hand-hygiene-observation-sheet footer a { color: #000; }\n@media print {\n  .fk-sheet-hand-hygiene-observation-sheet { padding: 0; font-size: 10.8px; }\n  .fk-sheet-hand-hygiene-observation-sheet .nav-bar { display: none; }\n  .fk-sheet-hand-hygiene-observation-sheet .page { max-width: 100%; }\n}","bodyHtml":"<div class=\"page\">\n    <div class=\"nav-bar\">\n      <a href=\"index.html\">← Field Kit Index<\/a>\n      <a href=\"../ipc-kit.html\">Open App (ipc-kit.html)<\/a>\n      <a href=\"../evidence/evidence-register.html\">Evidence Register<\/a>\n    <\/div>\n\n    <div class=\"top-header\">\n      <h1>Hand Hygiene Observation Sheet (One Page)<\/h1>\n      <span>Target session: ~20 minutes <span class=\"ev\">[HH-08]<\/span> · Trained observer <span class=\"ev\">[HH-09]<\/span><\/span>\n    <\/div>\n\n    <div class=\"privacy-banner\">\n      Do not write names, ID numbers or clinical details on this sheet. <span class=\"ev\">[HH-10, PR-02, PR-03]<\/span>\n    <\/div>\n\n    <div class=\"meta-row\">\n      <div class=\"meta-box\">Month (YYYY-MM): __________________<span>Example: 2026-11<\/span><\/div>\n      <div class=\"meta-box\">Area code: __________________<span>Facility code, e.g. OPD, MAT, WARD-A<\/span><\/div>\n      <div class=\"meta-box\">Session number: ___________<span>1, 2, 3… within the month<\/span><\/div>\n      <div class=\"meta-box\" style=\"flex: 0 1 110px;\">Page ____ of ____<span>No observer name/ID<\/span><\/div>\n    <\/div>\n\n    <div class=\"howto\">\n      <strong>How to use:<\/strong> Use <strong>one row per hand hygiene opportunity<\/strong>. Tick <strong>every moment (M1–M5)<\/strong> that applies at the same time; two moments happening together count as <strong>one opportunity (one row)<\/strong> <span class=\"ev\">[HH-02]<\/span>. Then tick <strong>ONE outcome<\/strong> in that row: <em>Hand rub<\/em> (~20–30 s), <em>Handwash<\/em> with soap and water (~40–60 s), or <em>Missed<\/em> <span class=\"ev\">[HH-04, HH-13]<\/span>. Wearing gloves does not replace hand hygiene <span class=\"ev\">[HH-11]<\/span>.\n    <\/div>\n\n    <table>\n      <thead>\n        <tr>\n          <th style=\"width: 7%;\">#<\/th>\n          <th colspan=\"5\" style=\"width: 50%;\">Moments that apply (tick all that apply at the same time) <span class=\"ev\">[HH-01, HH-02]<\/span><\/th>\n          <th colspan=\"3\" style=\"width: 43%;\">Outcome (tick ONE per row) <span class=\"ev\">[HH-04]<\/span><\/th>\n        <\/tr>\n        <tr>\n          <th>Opp.<\/th>\n          <th>M1<br><span class=\"ev\">Before pt<\/span><\/th>\n          <th>M2<br><span class=\"ev\">Clean/aseptic<\/span><\/th>\n          <th>M3<br><span class=\"ev\">Body fluid<\/span><\/th>\n          <th>M4<br><span class=\"ev\">After pt<\/span><\/th>\n          <th>M5<br><span class=\"ev\">Surroundings<\/span><\/th>\n          <th>Hand rub<\/th>\n          <th>Handwash<\/th>\n          <th>Missed<\/th>\n        <\/tr>\n      <\/thead>\n      <tbody>\n        <tr><td>1<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>2<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>3<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>4<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>5<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>6<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>7<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>8<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>9<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>10<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>11<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>12<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>13<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>14<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>15<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>16<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>17<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>18<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>19<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n        <tr><td>20<\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><td><span class=\"cb\"><\/span><\/td><\/tr>\n      <\/tbody>\n    <\/table>\n\n    <div class=\"bottom-grid\">\n      <div class=\"bottom-col\" style=\"flex: 1.1 1 200px;\">\n        <h2>Session Totals (Hand hygiene &gt; Paper totals)<\/h2>\n        <table class=\"totals-table\">\n          <tr><td class=\"left\"><strong>Hand rub<\/strong><\/td><td style=\"width: 40%;\"><\/td><\/tr>\n          <tr><td class=\"left\"><strong>Handwash<\/strong><\/td><td><\/td><\/tr>\n          <tr><td class=\"left\"><strong>Missed<\/strong><\/td><td><\/td><\/tr>\n          <tr><td class=\"left\"><strong>Opportunities (= sum)<\/strong> <span class=\"ev\">[HH-02]<\/span><\/td><td><\/td><\/tr>\n        <\/table>\n        <div style=\"font-size: 10px; margin-top: 3px;\">\n          Adherence = 100 × (Hand rub + Handwash) / Opportunities <span class=\"ev\">[HH-03]<\/span>. Combine sessions by adding counts first, never by averaging percentages <span class=\"ev\">[HH-05]<\/span>. Always report as <em>X of Y opportunities, Z%<\/em> (&lt;200 opportunities = <em>Small sample – interpret with care<\/em>) <span class=\"ev\">[HH-06, HH-07]<\/span>.\n        <\/div>\n        <div style=\"margin-top: 4px; font-weight: bold; font-size: 11px;\">\n          Entered in app: <span class=\"cb\"><\/span> <span style=\"font-weight: normal; font-size: 10px;\">(initials NOT needed)<\/span>\n        <\/div>\n      <\/div>\n\n      <div class=\"bottom-col\" style=\"flex: 1 1 175px;\">\n        <h2>Optional Per-Moment Breakdown<\/h2>\n        <table class=\"totals-table\">\n          <thead>\n            <tr><th>Moment<\/th><th>Indications<br><span class=\"ev\">(boxes ticked)<\/span><\/th><th>Actions<br><span class=\"ev\">(rub or wash)<\/span><\/th><\/tr>\n          <\/thead>\n          <tbody>\n            <tr><td>M1<\/td><td><\/td><td><\/td><\/tr>\n            <tr><td>M2<\/td><td><\/td><td><\/td><\/tr>\n            <tr><td>M3<\/td><td><\/td><td><\/td><\/tr>\n            <tr><td>M4<\/td><td><\/td><td><\/td><\/tr>\n            <tr><td>M5<\/td><td><\/td><td><\/td><\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n\n      <div class=\"bottom-col\" style=\"flex: 1.2 1 210px;\">\n        <h2>Moment Legend <span class=\"ev\">[HH-01]<\/span><\/h2>\n        <ol class=\"legend-list\">\n          <li><strong>Before touching a patient<\/strong><\/li>\n          <li><strong>Before a clean/aseptic procedure<\/strong><\/li>\n          <li><strong>After body fluid exposure risk<\/strong><\/li>\n          <li><strong>After touching a patient<\/strong><\/li>\n          <li><strong>After touching patient surroundings<\/strong><\/li>\n        <\/ol>\n      <\/div>\n    <\/div>\n\n    <footer>\n      IPC Starter Kit v1.0.0 · Original text © 2026 @mostafase · <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\">CC BY-NC-SA 4.0<\/a> · Sources: see evidence register (<a href=\"../evidence/evidence-register.html\">evidence/evidence-register.html<\/a>)\n    <\/footer>\n  <\/div>"},"field-kit/stock-card-and-count-sheet.html":{"id":"field-kit/stock-card-and-count-sheet.html","slug":"stock-card-and-count-sheet","label":"3. Stock card & count sheet","title":"Stock Card and Physical Count Sheet – IPC Starter Kit v1.0.0","kind":"html","inAllSheets":true,"scopeClass":"fk-sheet-stock-card-and-count-sheet","scopedCss":"@page { size: auto; margin: 12mm; }\n.fk-sheet-stock-card-and-count-sheet, .fk-sheet-stock-card-and-count-sheet * { box-sizing: border-box; }\n.fk-sheet-stock-card-and-count-sheet { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n      color: #000;\n      background: #fff;\n      margin: 0;\n      padding: 8px;\n      font-size: 11.5px;\n      line-height: 1.3; }\n.fk-sheet-stock-card-and-count-sheet .page { max-width: 190mm;\n      margin: 0 auto; }\n.fk-sheet-stock-card-and-count-sheet .page-break { page-break-before: always;\n      break-before: page; }\n.fk-sheet-stock-card-and-count-sheet .nav-bar { margin-bottom: 6px;\n      padding-bottom: 4px;\n      border-bottom: 1px solid #444;\n      font-size: 11px; }\n.fk-sheet-stock-card-and-count-sheet .nav-bar a { color: #000; text-decoration: underline; margin-right: 12px; }\n.fk-sheet-stock-card-and-count-sheet .top-header { display: flex;\n      justify-content: space-between;\n      align-items: baseline;\n      border-bottom: 2px solid #000;\n      padding-bottom: 2px;\n      margin-bottom: 4px; }\n.fk-sheet-stock-card-and-count-sheet h1 { font-size: 16px; margin: 0; }\n.fk-sheet-stock-card-and-count-sheet .privacy-banner { border: 1.5px solid #000;\n      padding: 3px 6px;\n      font-weight: bold;\n      text-align: center;\n      background: #f4f4f4;\n      margin-bottom: 5px;\n      font-size: 11.5px; }\n.fk-sheet-stock-card-and-count-sheet .meta-grid { display: flex;\n      gap: 6px;\n      margin-bottom: 5px;\n      flex-wrap: wrap; }\n.fk-sheet-stock-card-and-count-sheet .meta-box { border: 1px solid #000;\n      padding: 4px 6px;\n      flex: 1 1 130px;\n      font-weight: bold; }\n.fk-sheet-stock-card-and-count-sheet .meta-box span { font-weight: normal;\n      font-size: 10px;\n      display: block; }\n.fk-sheet-stock-card-and-count-sheet .rules-box { border: 1px solid #000;\n      padding: 4px 6px;\n      margin-bottom: 5px;\n      font-size: 10.5px;\n      background: #fafafa; }\n.fk-sheet-stock-card-and-count-sheet table { width: 100%;\n      border-collapse: collapse;\n      margin-bottom: 5px; }\n.fk-sheet-stock-card-and-count-sheet th, .fk-sheet-stock-card-and-count-sheet td { border: 1px solid #000;\n      padding: 3.5px 4px;\n      text-align: center;\n      vertical-align: middle;\n      font-size: 10.5px; }\n.fk-sheet-stock-card-and-count-sheet th { background: #eee;\n      font-weight: bold; }\n.fk-sheet-stock-card-and-count-sheet td.tall { height: 7.2mm; }\n.fk-sheet-stock-card-and-count-sheet .cb { display: inline-block;\n      width: 5.2mm;\n      height: 5.2mm;\n      border: 1.5px solid #000;\n      vertical-align: middle;\n      margin-right: 2px;\n      background: #fff; }\n.fk-sheet-stock-card-and-count-sheet .ev { font-size: 9.5px; font-weight: normal; color: #222; }\n.fk-sheet-stock-card-and-count-sheet footer { margin-top: 6px;\n      padding-top: 3px;\n      border-top: 1px solid #000;\n      font-size: 10px;\n      text-align: center; }\n.fk-sheet-stock-card-and-count-sheet footer a { color: #000; }\n@media print {\n  .fk-sheet-stock-card-and-count-sheet { padding: 0; font-size: 11px; }\n  .fk-sheet-stock-card-and-count-sheet .nav-bar { display: none; }\n  .fk-sheet-stock-card-and-count-sheet .page { max-width: 100%; }\n}","bodyHtml":"<!-- PAGE 1: STOCK CARD -->\n  <div class=\"page\">\n    <div class=\"nav-bar\">\n      <a href=\"index.html\">← Field Kit Index<\/a>\n      <a href=\"../ipc-kit.html\">Open App (ipc-kit.html)<\/a>\n      <a href=\"../evidence/evidence-register.html\">Evidence Register<\/a>\n    <\/div>\n\n    <div class=\"top-header\">\n      <h1>Page 1: IPC Supply Stock Card <span class=\"ev\">[ST-06]<\/span><\/h1>\n      <span>Keep ONE card per item · Use earliest-expiring usable batch first <span class=\"ev\">[ST-07]<\/span><\/span>\n    <\/div>\n\n    <div class=\"privacy-banner\">\n      Do not write names, ID numbers or clinical details on this sheet. <span class=\"ev\">[PR-02, PR-03]<\/span>\n    <\/div>\n\n    <div class=\"meta-grid\">\n      <div class=\"meta-box\" style=\"flex: 1.6 1 180px;\">Item: ____________________________<span>Example: Alcohol hand rub 500 mL<\/span><\/div>\n      <div class=\"meta-box\">Unit: __________________<span>ONE unit only (locked after first entry) <span class=\"ev\">[ST-01]<\/span><\/span><\/div>\n      <div class=\"meta-box\">Reorder point: _________<span>Order when balance is at/below <span class=\"ev\">[ST-09]<\/span><\/span><\/div>\n      <div class=\"meta-box\">Alert window (days): _____<span>Default: 90 days <span class=\"ev\">[ST-08]<\/span><\/span><\/div>\n      <div class=\"meta-box\" style=\"flex: 0.9 1 120px;\">Tracks expiry:<br><span class=\"cb\"><\/span> Yes &nbsp; <span class=\"cb\"><\/span> No<\/div>\n    <\/div>\n\n    <div class=\"rules-box\">\n      <strong>Stock card rules:<\/strong>\n      <strong>Balance<\/strong> counts <em>usable stock only<\/em> (stockout = 0 usable stock) <span class=\"ev\">[ST-02, ST-03]<\/span>. Expired stock never counts as usable and must be removed; an expiry date is usable up to and including that day <span class=\"ev\">[ST-10]<\/span>. Issue the earliest-expiring usable batch first (<em>Use first<\/em>) <span class=\"ev\">[ST-07]<\/span>.<br>\n      <strong>Type codes:<\/strong> <code>R<\/code> = Receipt · <code>I<\/code> = Issue · <code>C<\/code> = Physical count <span class=\"ev\">[ST-04]<\/span> · <code>A<\/code> = Adjustment <span class=\"ev\">[ST-05]<\/span>.<br>\n      <strong>Adjustment reason codes <span class=\"ev\">[ST-05]<\/span>:<\/strong> <em>Expired – removed<\/em> · <em>Damaged<\/em> · <em>Lost<\/em> · <em>Transferred out<\/em> · <em>Found<\/em> · <em>Transferred in<\/em> · <em>Correction<\/em>.\n    <\/div>\n\n    <table>\n      <thead>\n        <tr>\n          <th style=\"width: 10%;\">Date<br><span class=\"ev\">(YYYY-MM-DD)<\/span><\/th>\n          <th style=\"width: 6%;\">Type<br><span class=\"ev\">R/I/C/A<\/span><\/th>\n          <th style=\"width: 11%;\">Batch<\/th>\n          <th style=\"width: 11%;\">Expiry<br><span class=\"ev\">(YYYY-MM-DD)<\/span><\/th>\n          <th style=\"width: 7%;\">In<br><span class=\"ev\">(+)<\/span><\/th>\n          <th style=\"width: 7%;\">Out<br><span class=\"ev\">(-)<\/span><\/th>\n          <th style=\"width: 8%;\">Counted<br><span class=\"ev\">(C)<\/span><\/th>\n          <th style=\"width: 9%;\">Adjustment<br><span class=\"ev\">(+/-)<\/span><\/th>\n          <th style=\"width: 13%;\">Reason code<br><span class=\"ev\">(for A)<\/span><\/th>\n          <th style=\"width: 9%;\">Balance<br><span class=\"ev\">(usable)<\/span><\/th>\n          <th style=\"width: 9%;\">Area code<br><span class=\"ev\">(issues)<\/span><\/th>\n        <\/tr>\n      <\/thead>\n      <tbody>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n      <\/tbody>\n    <\/table>\n\n    <footer>\n      IPC Starter Kit v1.0.0 · Original text © 2026 @mostafase · <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\">CC BY-NC-SA 4.0<\/a> · Sources: see evidence register (<a href=\"../evidence/evidence-register.html\">evidence/evidence-register.html<\/a>)\n    <\/footer>\n  <\/div>\n\n  <!-- PAGE 2: PHYSICAL COUNT SHEET -->\n  <div class=\"page page-break\">\n    <div class=\"top-header\">\n      <h1>Page 2: Physical Count Sheet <span class=\"ev\">[ST-04]<\/span><\/h1>\n      <span>Compare physical count against stock cards / app records<\/span>\n    <\/div>\n\n    <div class=\"privacy-banner\">\n      Do not write names, ID numbers or clinical details on this sheet. <span class=\"ev\">[PR-02, PR-03]<\/span>\n    <\/div>\n\n    <div class=\"meta-grid\">\n      <div class=\"meta-box\">Date of count (YYYY-MM-DD): __________________<\/div>\n      <div class=\"meta-box\">Store / Area code: ___________________<\/div>\n      <div class=\"meta-box\">Role performing count: _______________________<span>Role only (e.g. Storekeeper, IPC focal person) – no name<\/span><\/div>\n    <\/div>\n\n    <div class=\"rules-box\">\n      <strong>Physical count rules <span class=\"ev\">[ST-02, ST-04, ST-05, ST-10]<\/span>:<\/strong>\n      <ol style=\"margin: 2px 0; padding-left: 18px;\">\n        <li><strong>Count only what you can see:<\/strong> Open boxes if needed and count using the item's locked unit <span class=\"ev\">[ST-01]<\/span>.<\/li>\n        <li><strong>Separate expired or damaged stock:<\/strong> Any batch past its expiry date (or damaged) is NOT usable stock. Move it out of the usable storage area immediately and record an adjustment (<em>Expired – removed<\/em> or <em>Damaged<\/em>) <span class=\"ev\">[ST-02, ST-05, ST-10]<\/span>.<\/li>\n        <li><strong>Enter counts the same day:<\/strong> Update the stock card or enter the count in <code>Stock &gt; Record &gt; Physical count<\/code> on the same day so balances match actual usable stock on the shelf <span class=\"ev\">[ST-04]<\/span>.<\/li>\n      <\/ol>\n    <\/div>\n\n    <table>\n      <thead>\n        <tr>\n          <th style=\"width: 24%;\">Item<\/th>\n          <th style=\"width: 11%;\">Unit<br><span class=\"ev\">[ST-01]<\/span><\/th>\n          <th style=\"width: 12%;\">Batch<\/th>\n          <th style=\"width: 13%;\">Expiry<br><span class=\"ev\">(YYYY-MM-DD)<\/span><\/th>\n          <th style=\"width: 12%;\">Counted quantity<\/th>\n          <th style=\"width: 14%;\">Expired?<br><span class=\"ev\">[ST-10]<\/span><\/th>\n          <th style=\"width: 14%;\">Damaged?<br><span class=\"ev\">[ST-05]<\/span><\/th>\n        <\/tr>\n      <\/thead>\n      <tbody>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><\/tr>\n        <tr><td class=\"tall\"><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><td><span class=\"cb\"><\/span>Y <span class=\"cb\"><\/span>N<\/td><\/tr>\n      <\/tbody>\n    <\/table>\n\n    <div style=\"font-weight: bold; font-size: 11px; margin-top: 4px;\">\n      Entered in app / stock cards on same day: <span class=\"cb\"><\/span> <span style=\"font-weight: normal; font-size: 10px;\">(initials NOT needed)<\/span>\n    <\/div>\n\n    <footer>\n      IPC Starter Kit v1.0.0 · Original text © 2026 @mostafase · <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\">CC BY-NC-SA 4.0<\/a> · Sources: see evidence register (<a href=\"../evidence/evidence-register.html\">evidence/evidence-register.html<\/a>)\n    <\/footer>\n  <\/div>"},"field-kit/readiness-checklist.html":{"id":"field-kit/readiness-checklist.html","slug":"readiness-checklist","label":"4. IPC area readiness checklist","title":"IPC Area Readiness Checklist – IPC Starter Kit v1.0.0","kind":"html","inAllSheets":true,"scopeClass":"fk-sheet-readiness-checklist","scopedCss":"@page { size: auto; margin: 12mm; }\n.fk-sheet-readiness-checklist, .fk-sheet-readiness-checklist * { box-sizing: border-box; }\n.fk-sheet-readiness-checklist { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n      color: #000;\n      background: #fff;\n      margin: 0;\n      padding: 6px;\n      font-size: 11.5px;\n      line-height: 1.25; }\n.fk-sheet-readiness-checklist .page { max-width: 190mm;\n      margin: 0 auto; }\n.fk-sheet-readiness-checklist .nav-bar { margin-bottom: 5px;\n      padding-bottom: 3px;\n      border-bottom: 1px solid #444;\n      font-size: 11px; }\n.fk-sheet-readiness-checklist .nav-bar a { color: #000; text-decoration: underline; margin-right: 12px; }\n.fk-sheet-readiness-checklist .top-header { display: flex;\n      justify-content: space-between;\n      align-items: baseline;\n      border-bottom: 2px solid #000;\n      padding-bottom: 2px;\n      margin-bottom: 4px; }\n.fk-sheet-readiness-checklist h1 { font-size: 16px; margin: 0; }\n.fk-sheet-readiness-checklist .privacy-banner { border: 1.5px solid #000;\n      padding: 3px 6px;\n      font-weight: bold;\n      text-align: center;\n      background: #f4f4f4;\n      margin-bottom: 4px;\n      font-size: 11.5px; }\n.fk-sheet-readiness-checklist .meta-row { display: flex;\n      gap: 8px;\n      margin-bottom: 4px;\n      flex-wrap: wrap; }\n.fk-sheet-readiness-checklist .meta-box { border: 1px solid #000;\n      padding: 3px 6px;\n      flex: 1 1 140px;\n      font-weight: bold; }\n.fk-sheet-readiness-checklist .meta-box span { font-weight: normal;\n      font-size: 10px;\n      display: block; }\n.fk-sheet-readiness-checklist .roles-box { border: 1px solid #000;\n      padding: 3px 6px;\n      margin-bottom: 4px;\n      font-size: 10.5px;\n      background: #fafafa; }\n.fk-sheet-readiness-checklist table { wi
